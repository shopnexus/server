# Infrastructure the test suites own, apart from the development stack, so a
# test run never wipes development data. Its own project name keeps a
# `down -v` here from reaching the development containers. Ports sit one above
# the development ones so both stacks run at once.
#
# Restate runs on the host network, like the development one, so it can
# call endpoints that test processes serve on 127.0.0.1.
name: shopnexus-server2-test

services:
  postgres:
    image: postgres:19rc1
    environment:
      POSTGRES_USER: server2
      POSTGRES_PASSWORD: server2
      POSTGRES_DB: server2_test
    ports:
      - "56433:5432"
    # Data on tmpfs: fast, and `down` really resets it. Postgres 19 keeps its
    # data directory under /var/lib/postgresql/19/docker, inside this mount.
    # Sized explicitly; an uncapped tmpfs defaults to half the host's RAM.
    tmpfs:
      - /var/lib/postgresql:size=1g
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server2 -d server2_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  restate:
    image: restatedev/restate:1.8.0
    network_mode: host
    environment:
      RESTATE_BASE_DIR: /restate-data
      RESTATE_INGRESS__BIND_ADDRESS: 127.0.0.1:56581
      RESTATE_ADMIN__BIND_ADDRESS: 127.0.0.1:56571
      RESTATE_BIND_ADDRESS: 127.0.0.1:56561
      RESTATE_ADVERTISED_ADDRESS: http://127.0.0.1:56561
    tmpfs:
      - /restate-data:size=512m
    mem_limit: 768m
