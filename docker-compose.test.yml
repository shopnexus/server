# Infrastructure the test suites own, apart from the development stack, so a
# test run never wipes development data. Its own project name keeps a
# `down -v` here from reaching the development containers. Ports sit one above
# the development ones so both stacks run at once.
#
# Restate runs on the host network, like the development one, so it can
# call endpoints that test processes serve on 127.0.0.1.
name: shopnexus-server2-test

services:
  postgres:
    image: postgres:19rc1
    environment:
      POSTGRES_USER: server2
      POSTGRES_PASSWORD: server2
      POSTGRES_DB: server2_test
    ports:
      - "56433:5432"
    # Data on tmpfs: fast, and `down` really resets it. Postgres 19 keeps its
    # data directory under /var/lib/postgresql/19/docker, inside this mount.
    # Sized explicitly; an uncapped tmpfs defaults to half the host's RAM.
    # go test runs a package per CPU, each test on a cloned database of about
    # 8.5 MB, and 1 GB filled up once catalog and media joined. The tmpfs
    # counts toward mem_limit.
    tmpfs:
      - /var/lib/postgresql:size=2g
    mem_limit: 2560m
    # Test packages run their tests in parallel, each test on its own
    # database and pool of up to 4 connections.
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server2 -d server2_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  restate:
    image: restatedev/restate:1.8.0
    network_mode: host
    environment:
      RESTATE_BASE_DIR: /restate-data
      RESTATE_INGRESS__BIND_ADDRESS: 127.0.0.1:56581
      RESTATE_ADMIN__BIND_ADDRESS: 127.0.0.1:56571
      RESTATE_BIND_ADDRESS: 127.0.0.1:56561
      RESTATE_ADVERTISED_ADDRESS: http://127.0.0.1:56561
      # The tmpfs counts toward mem_limit; RocksDB sizes itself for a server.
      RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE: 256MB
      # Signs every request to the test endpoints; make test writes the key.
      RESTATE_WORKER__INVOKER__REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE: /identity.pem
    volumes:
      - ./.restate/identity.pem:/identity.pem:ro
    tmpfs:
      - /restate-data:size=512m
    mem_limit: 1536m

  # Object store on tmpfs; each test writes under keys of its own.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: server2rustfs
      RUSTFS_SECRET_KEY: server2rustfs-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:56491:9000"
    tmpfs:
      - /data:size=512m,uid=10001,gid=10001
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
