# Infrastructure the test suites own, apart from the development stack, so a
# test run never wipes development data. Its own project name keeps a
# `down -v` here from reaching the development containers. Ports sit one above
# the development ones so both stacks run at once.
#
# Restate runs on the host network, like the development one, so it can
# call endpoints that test processes serve on 127.0.0.1.
name: shopnexus-server-test

services:
  postgres:
    image: paradedb/paradedb:0.26.3-pg18
    environment:
      POSTGRES_USER: server
      POSTGRES_PASSWORD: server
      POSTGRES_DB: server_test
    ports:
      - "56433:5432"
    # Data on tmpfs: fast, and `down` really resets it. Postgres 18 keeps its
    # data directory under /var/lib/postgresql/18/docker, inside this mount.
    # Sized explicitly; an uncapped tmpfs defaults to half the host's RAM.
    # go test runs a package per CPU, each test on a cloned database of about
    # 13 MB with ParadeDB's extensions and index, and 2 GB filled up once
    # search joined. The tmpfs counts toward mem_limit.
    tmpfs:
      - /var/lib/postgresql:size=4g
    mem_limit: 4608m
    # Test packages run their tests in parallel, each test on its own
    # database and pool of up to 4 connections. 200 ran out once ParadeDB's
    # index writes made the tests hold their connections longer.
    command: postgres -c max_connections=400
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server -d server_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  restate:
    image: restatedev/restate:1.8.0
    network_mode: host
    environment:
      RESTATE_BASE_DIR: /restate-data
      RESTATE_INGRESS__BIND_ADDRESS: 127.0.0.1:56581
      RESTATE_ADMIN__BIND_ADDRESS: 127.0.0.1:56571
      RESTATE_BIND_ADDRESS: 127.0.0.1:56561
      RESTATE_ADVERTISED_ADDRESS: http://127.0.0.1:56561
      # The tmpfs counts toward mem_limit; RocksDB sizes itself for a server.
      RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE: 256MB
      # Signs every request to the test endpoints; make test writes the key.
      RESTATE_WORKER__INVOKER__REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE: /identity.pem
    volumes:
      - ./.restate/identity.pem:/identity.pem:ro
    # Every message with text starts a scam check, and on 2026-11-11 one run
    # of make test filled 2 GB; Restate then stops writing until restarted.
    tmpfs:
      - /restate-data:size=3g
    mem_limit: 4096m

  # Object store on tmpfs; each test writes under keys of its own.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: server-rustfs
      RUSTFS_SECRET_KEY: server-rustfs-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:56491:9000"
    tmpfs:
      - /data:size=512m,uid=10001,gid=10001
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
