# Development stack: postgres, restate, and otel-lgtm (profile obs, on via
# .env). `make run` starts it and runs the server on the host.
#
# Ports sit in the 564xx-565xx range, away from the usual ones, so the stack
# runs beside other projects on the same machine.
name: shopnexus-server2

services:
  postgres:
    image: paradedb/paradedb:0.26.3-pg18
    environment:
      POSTGRES_USER: server2
      POSTGRES_PASSWORD: server2
      POSTGRES_DB: server2
    ports:
      - "56432:5432"
    # ParadeDB is Postgres 18 with pg_search preloaded. Postgres 18 keeps
    # data under /var/lib/postgresql/18/docker and declares the volume one
    # level up; a volume made by 19rc1 starts an empty 18 directory beside it.
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server2 -d server2"]
      interval: 2s
      timeout: 3s
      retries: 30

  restate:
    image: restatedev/restate:1.8.0
    # Host network: ufw drops container-to-host traffic, and Restate must call
    # the server's endpoint on the host. Every port binds to 127.0.0.1.
    network_mode: host
    environment:
      RESTATE_BASE_DIR: /restate-data
      RESTATE_INGRESS__BIND_ADDRESS: 127.0.0.1:56580
      RESTATE_ADMIN__BIND_ADDRESS: 127.0.0.1:56570
      RESTATE_BIND_ADDRESS: 127.0.0.1:56560
      RESTATE_ADVERTISED_ADDRESS: http://127.0.0.1:56560
      # Signs every request to the server's endpoint; make run writes the key.
      RESTATE_WORKER__INVOKER__REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE: /identity.pem
    volumes:
      - restate:/restate-data
      - ./.restate/identity.pem:/identity.pem:ro

  # S3-compatible object store for uploads and media. make run creates the
  # bucket and opens media/ for reading.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: server2rustfs
      RUSTFS_SECRET_KEY: server2rustfs-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:56490:9000"
    volumes:
      - rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [obs]
    ports:
      - "56300:3000"
      - "56317:4317"
      - "56318:4318"
    volumes:
      - lgtm:/data

  # The self-hosted models (see ARCHITECTURE.md, Search and Assist): speech
  # to text, SigLIP 2 photo embeddings and video frames, as the umbrella's
  # compose runs them. The image is about 5.4 GB. Start it with
  #   docker compose --profile models up -d ai-models
  # Without it photo search is unavailable and ListingEmbed retries photos.
  ai-models:
    image: ghcr.io/shopnexus/ai:main
    profiles: [models]
    environment:
      AI_ADDR: ":8000"
      AI_STT_MODELS: gipformer-1.5=/models/gipformer-1.5
      AI_VAD_MODEL: /models/silero_vad.onnx
      AI_NUM_THREADS: "4"
      AI_MAX_CONCURRENT: "2"
      AI_MAX_UPLOAD_MB: "100"
      AI_MAX_AUDIO_SECONDS: "300"
      AI_EMBED_MODELS: siglip2-so400m-patch16-384=/models/siglip2-so400m-patch16-384
      AI_EMBED_MAX_INPUTS: "16"
      AI_EMBED_MAX_CONCURRENT: "2"
      AI_EMBED_MAX_IMAGE_MB: "10"
      AI_FRAMES_MAX_CONCURRENT: "2"
      AI_FRAMES_MAX_SECONDS: "35"
      AI_FRAMES_MIN_SHARPNESS: "30"
    ports:
      - "127.0.0.1:56810:8000"

volumes:
  postgres:
  restate:
  rustfs:
  lgtm:
