# Development stack: postgres, restate, and otel-lgtm (profile obs, on via
# .env). `make run` starts it and runs the server on the host.
#
# Ports sit in the 564xx-565xx range so this stack runs beside ai-portal and
# the old shopnexus server.
name: shopnexus-server2

services:
  postgres:
    image: postgres:19rc1
    environment:
      POSTGRES_USER: server2
      POSTGRES_PASSWORD: server2
      POSTGRES_DB: server2
    ports:
      - "56432:5432"
    # Postgres 18 and later keep data under /var/lib/postgresql/<major>/docker
    # and declare the volume one level up.
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server2 -d server2"]
      interval: 2s
      timeout: 3s
      retries: 30

  restate:
    image: restatedev/restate:1.8.0
    # Host network: ufw drops container-to-host traffic, and Restate must call
    # the server's endpoint on the host. Every port binds to 127.0.0.1.
    network_mode: host
    environment:
      RESTATE_BASE_DIR: /restate-data
      RESTATE_INGRESS__BIND_ADDRESS: 127.0.0.1:56580
      RESTATE_ADMIN__BIND_ADDRESS: 127.0.0.1:56570
      RESTATE_BIND_ADDRESS: 127.0.0.1:56560
      RESTATE_ADVERTISED_ADDRESS: http://127.0.0.1:56560
      # Signs every request to the server's endpoint; make run writes the key.
      RESTATE_WORKER__INVOKER__REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE: /identity.pem
    volumes:
      - restate:/restate-data
      - ./.restate/identity.pem:/identity.pem:ro

  # S3-compatible object store for uploads and media. make run creates the
  # bucket and opens media/ for reading.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: server2rustfs
      RUSTFS_SECRET_KEY: server2rustfs-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:56490:9000"
    volumes:
      - rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [obs]
    ports:
      - "56300:3000"
      - "56317:4317"
      - "56318:4318"
    volumes:
      - lgtm:/data

volumes:
  postgres:
  restate:
  rustfs:
  lgtm:
