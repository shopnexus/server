# Development stack. The server itself runs on the host (`make run`).
#
#   make up                     postgres, restate, and otel-lgtm (profile obs, on via .env)
#   make mock                   prism serving api/openapi.yaml
#
# Ports sit in the 564xx-565xx range so this stack runs beside ai-portal and
# the old shopnexus server.
name: shopnexus-server2

services:
  postgres:
    image: postgres:19rc1
    environment:
      POSTGRES_USER: server2
      POSTGRES_PASSWORD: server2
      POSTGRES_DB: server2
    ports:
      - "56432:5432"
    # Postgres 18 and later keep data under /var/lib/postgresql/<major>/docker
    # and declare the volume one level up.
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server2 -d server2"]
      interval: 2s
      timeout: 3s
      retries: 30

  restate:
    image: restatedev/restate:1.8.0
    # Host network: ufw drops container-to-host traffic, and Restate must call
    # the server's endpoint on the host. Every port binds to 127.0.0.1.
    network_mode: host
    environment:
      RESTATE_BASE_DIR: /restate-data
      RESTATE_INGRESS__BIND_ADDRESS: 127.0.0.1:56580
      RESTATE_ADMIN__BIND_ADDRESS: 127.0.0.1:56570
      RESTATE_BIND_ADDRESS: 127.0.0.1:56560
      RESTATE_ADVERTISED_ADDRESS: http://127.0.0.1:56560
    volumes:
      - restate:/restate-data

  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [obs]
    ports:
      - "56300:3000"
      - "56317:4317"
      - "56318:4318"
    volumes:
      - lgtm:/data

  prism:
    image: stoplight/prism:5.15.10
    profiles: [mock]
    # -m false: multiprocess mode crashes in 5.15.10 (TypeError on isPrimary).
    command: ["mock", "-m", "false", "-h", "0.0.0.0", "/api/openapi.yaml"]
    ports:
      - "56400:4010"
    volumes:
      - ./api:/api:ro

volumes:
  postgres:
  restate:
  lgtm:
