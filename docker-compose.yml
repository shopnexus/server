# Development stack. The server itself runs on the host (`make run`).
#
#   make up                     postgres, nats, and otel-lgtm (profile obs, on via .env)
#   make mock                   prism serving api/openapi.yaml
#
# Ports sit in the 562xx-564xx range so this stack runs beside ai-portal and
# the old shopnexus server.
name: shopnexus-server2

services:
  postgres:
    image: postgres:19rc1
    environment:
      POSTGRES_USER: server2
      POSTGRES_PASSWORD: server2
      POSTGRES_DB: server2
    ports:
      - "56432:5432"
    # Postgres 18 and later keep data under /var/lib/postgresql/<major>/docker
    # and declare the volume one level up.
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server2 -d server2"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The nats image is built FROM scratch: no shell for a healthcheck. The
  # server retries its connection at start instead.
  nats:
    image: nats:2.15.1
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "56222:4222"
      - "56822:8222"
    volumes:
      - nats:/data

  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [obs]
    ports:
      - "56300:3000"
      - "56317:4317"
      - "56318:4318"
    volumes:
      - lgtm:/data

  prism:
    image: stoplight/prism:5.15.10
    profiles: [mock]
    command: ["mock", "-h", "0.0.0.0", "/api/openapi.yaml"]
    ports:
      - "56400:4010"
    volumes:
      - ./api:/api:ro

volumes:
  postgres:
  nats:
  lgtm:
