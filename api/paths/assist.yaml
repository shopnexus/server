listingReads:
  post:
    operationId: createListingRead
    x-rate-limit: costly
    x-uc: [UC-LST-01]
    summary: Read a video, a photo or the seller's Chợ Tốt listing into a listing draft.
    description: |
      Starts reading what the body names: a video the caller uploaded with
      POST /v1/uploads, one photo upload of the caller's, or the link to the
      seller's own listing on Chợ Tốt.
      A video may carry the phone's transcript; then the server runs no
      speech recognition.
      The answer comes at once with status reading. Each step that finishes
      adds its fields and sends a listing_read update on /v1/ws; the app
      then reads the read with GET. Checks, in order: for a link not_a_link
      and unsupported_source; then account_suspended, phone_required,
      read_limit_reached (30 video reads, 60 photo reads or 30 link reads in
      24 hours); then invalid_upload for a video or a photo. A link is not
      fetched until the read runs.
    tags: [assist]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/assist.yaml#/ListingReadRequest"
    responses:
      "202":
        description: The read, reading.
        content:
          application/json:
            schema:
              $ref: "../schemas/assist.yaml#/ListingRead"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended), or has no phone to sign in with (phone_required)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: |
          The video is not the caller's, not a video, not uploaded yet, expired or already read (invalid_upload); the
          photo is not the caller's, not a photo, not uploaded yet, already in a listing or expired (invalid_upload); the
          text is not an http or https link (not_a_link), or not a link to a listing on chotot.com (unsupported_source).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "429":
        description: "The account started as many reads of this source as its cap allows in the last 24 hours (read_limit_reached)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
listingRead:
  get:
    operationId: getListingRead
    x-uc: [UC-LST-01]
    summary: Read a listing read.
    tags: [assist]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The read as it is now.
        content:
          application/json:
            schema:
              $ref: "../schemas/assist.yaml#/ListingRead"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such read for this caller, or it is past its 24 hours (listing_read_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
listingReadEvents:
  get:
    operationId: streamListingRead
    x-uc: [UC-LST-01]
    summary: Watch a listing read as the model writes it.
    description: |
      A server-sent event stream. It sends event read with the read as GET
      /v1/listing-reads/{id} answers it, then event text with the title and
      description each time the model has written more, then event read
      again when the read ends, and closes. A read that has ended gets one
      event read. A comment line every 15 s keeps the stream open; the
      stream closes 30 s after the read's 2-minute deadline at the latest.
    tags: [assist]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: |
          The events. Each data line is JSON: a ListingRead after event read,
          a ReadText after event text.
        content:
          text/event-stream:
            schema:
              oneOf:
                - $ref: "../schemas/assist.yaml#/ListingRead"
                - $ref: "../schemas/assist.yaml#/ReadText"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such read for this caller, or it is past its 24 hours (listing_read_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
priceGuides:
  post:
    operationId: createPriceGuide
    x-rate-limit: costly
    x-uc: [UC-LST-01]
    summary: Price a listing draft against similar listings and the buyers watching for it.
    description: |
      Compares the draft with the listings most like it, by text and by
      photo, and answers the range, the two suggestions, the similar
      listings, their prices, and the search watches a listing of the draft
      would match. Stores nothing. POST because the body carries the draft.
    tags: [assist]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/assist.yaml#/PriceGuideRequest"
    responses:
      "200":
        description: The guide; empty lists when nothing is similar.
        content:
          application/json:
            schema:
              $ref: "../schemas/assist.yaml#/PriceGuide"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: |
          The category is not a subcategory or the commune is not on the list
          (invalid_listing, with fields); a photo is not the caller's, not a
          photo, already in a listing or expired (invalid_upload).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
