me:
  get:
    operationId: getMyAccount
    summary: Read the caller's account.
    tags: [account]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The account.
        content:
          application/json:
            schema:
              $ref: "../schemas/account.yaml#/MyAccount"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/NotFound"
  patch:
    operationId: updateMyAccount
    summary: Change the display name, the bio or the avatar.
    description: |
      A new avatar is processed before the reply, which carries its URL.
    tags: [account]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/account.yaml#/AccountUpdate"
    responses:
      "200":
        description: The updated account.
        content:
          application/json:
            schema:
              $ref: "../schemas/account.yaml#/Account"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "404":
        $ref: "../responses/common.yaml#/NotFound"
      "409":
        $ref: "../responses/common.yaml#/Conflict"
      "422":
        description: "The name or the bio breaks a rule (invalid_account, with fields), or the avatar upload is not the caller's or not a photo media can process (invalid_upload)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: deleteMyAccount
    summary: Delete the caller's account.
    description: |
      Needs a sign-in within 15 minutes. The account's listings, profile,
      sign-in methods, addresses, saves, search history, blocks, follows and
      notifications go, and its sessions end. The row stays without a name,
      bio or avatar for the orders, reviews and messages that name it, where
      other people see the account as deleted. A phone of the account signs
      up again as a new account. The recipients of the orders it bought are
      blanked a year later.
    tags: [account]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "409":
        description: "An order of the caller is pending or shipped (orders_open), or the account changed twice during the call (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "428":
        $ref: "../responses/common.yaml#/PreconditionRequired"
myIdentities:
  post:
    operationId: addMyIdentity
    summary: Add the phone or email the caller's account lacks.
    description: |
      A phone_token adds a phone to an account that has only an email;
      google_token or email_code (from sendMyEmailCode) adds an email to an
      account that has only a phone. Needs a sign-in within 15 minutes: a
      sign-in method is never removed, so one added with a leaked access
      token would let its holder in for good.
    tags: [account]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/account.yaml#/AddIdentityRequest"
    responses:
      "200":
        description: The account's identities after the add.
        content:
          application/json:
            schema:
              $ref: "../schemas/account.yaml#/Identities"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        description: Not signed in, the account was deleted (session_revoked), or a token failed a check (invalid_phone_token, invalid_google_token).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "409":
        description: The account has this kind already (identity_kind_taken), another account signs in with this value (identity_taken), or a race (try_again).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: invalid_phone, invalid_code (details.attempts_left), code_expired or code_locked.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "428":
        $ref: "../responses/common.yaml#/PreconditionRequired"
myEmailCodes:
  post:
    operationId: sendMyEmailCode
    summary: Mail a six-digit code that adds this email address to the caller's account.
    description: |
      The code works only for the caller's account, through
      POST /v1/accounts/me/identities. Needs a sign-in within 15 minutes.
      Limits as for sendEmailCode.
    tags: [account]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/EmailCodeRequest"
    responses:
      "200":
        description: The code is on its way.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/EmailCode"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "422":
        description: The address is not valid (invalid_email).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "429":
        description: Too soon after the last code to this address (otp_too_soon), or over a limit (otp_limit); details.retry_after gives seconds.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "428":
        $ref: "../responses/common.yaml#/PreconditionRequired"
blocks:
  post:
    operationId: blockAccount
    summary: Block an account.
    description: |
      Neither the caller nor the account may then message the other, open a
      conversation with them or open a deal on their listings. Blocking
      again changes nothing; running deals and orders stay as they are.
    tags: [account]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/account.yaml#/BlockCreate"
    responses:
      "204":
        description: Blocked.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such account (account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The caller named themselves (invalid_block)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  get:
    operationId: listBlocks
    summary: List the accounts the caller blocks, newest block first.
    tags: [account]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of blocks.
        content:
          application/json:
            schema:
              $ref: "../schemas/account.yaml#/BlockList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "409":
        description: "ShopNexus cannot be blocked (account_is_system)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
block:
  delete:
    operationId: unblockAccount
    summary: Lift a block; an absent one is fine.
    tags: [account]
    security:
      - bearerAuth: []
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Unblocked.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
follows:
  post:
    operationId: followAccount
    summary: Follow an account.
    description: |
      The caller hears when the account first publishes a listing.
      Following again changes nothing. A block between the two, either way,
      refuses a follow, and blocking deletes the follows between them.
    tags: [account]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/account.yaml#/FollowCreate"
    responses:
      "204":
        description: Following.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The caller is suspended (account_suspended), or a block stands between the two (blocked)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such account (account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The caller follows 1,000 accounts (follow_limit_reached), or the account was deleted (account_deleted)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The caller named themselves (invalid_follow)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  get:
    operationId: listFollows
    summary: List the accounts the caller follows, newest follow first.
    tags: [account]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of follows.
        content:
          application/json:
            schema:
              $ref: "../schemas/account.yaml#/FollowList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
follow:
  delete:
    operationId: unfollowAccount
    summary: Stop following an account; an absent follow is fine.
    tags: [account]
    security:
      - bearerAuth: []
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Not following.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
