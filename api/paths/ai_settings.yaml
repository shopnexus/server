# The AI settings, an admin's: providers, models with their tags and
# prices, agents and spend. Bifrost runs the providers of its config.json;
# the server owns agents, callers, prices and tags in its database and its
# reconciler writes them into Bifrost as teams, virtual keys and pricing
# overrides. A write saves the row first, then reconciles; when Bifrost
# cannot take it the answer is 503, the row stays and the next reconcile,
# within 5 minutes, writes it.
providers:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listAIProviders
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "The providers Bifrost runs, each with its status over the last hour. Admins only."
    description: >-
      Read-only: a new provider or key is an infra change. status is unknown with no request in the last hour;
      down when Bifrost marks the provider's status error, or when at least half of at least 5 requests failed;
      degraded when at least 5% of at least 20 requests failed; else ok.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIProviderList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "503":
        $ref: "../responses/common.yaml#/AIGatewayUnavailable"
providerModels:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AIProviderName"
  get:
    operationId: listAIProviderModels
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "A provider's catalog in Bifrost, each model with its list price. Admins only."
    description: "The model picker reads it; a model's list price is where its price starts."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIProviderModelList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "404":
        description: "Bifrost runs no such provider (ai_provider_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AIGatewayUnavailable"
models:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listAIModels
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "Every model an agent uses, or that has a price or tags, with its price and its catalog's. Admins only."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIModelList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "503":
        $ref: "../responses/common.yaml#/AIGatewayUnavailable"
modelTags:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  put:
    operationId: setAIModelTags
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "Replace a model's tags. Admins only; each change is a console action."
    description: "The model is in the body, as its id may hold a slash. An agent that requires a tag the model loses keeps running on it."
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/ai_settings.yaml#/AIModelTags"
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIModelTags"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "422":
        $ref: "../responses/common.yaml#/AISettingsRefused"
modelPrice:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  put:
    operationId: setAIModelPrice
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "Set a model's price, new or over the old. Admins only; each change is a console action."
    description: >-
      One price per model, shared by the agents that use it. Bifrost logs each call's cost with it, which the
      agents' budgets and spend count. The model is in the body, as its id may hold a slash.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/ai_settings.yaml#/AIModelPrice"
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIModelPrice"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "404":
        description: "Bifrost runs no such provider (ai_provider_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        $ref: "../responses/common.yaml#/AISettingsRefused"
      "503":
        $ref: "../responses/common.yaml#/AIGatewayUnavailable"
agents:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listAIAgents
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "The app agents and the console agents, each with this month's spend. Admins only."
    description: "When Bifrost cannot be read, budget_spent_usd and budget_resets_at are null and the rest answers."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIAgentList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
  post:
    operationId: createAIAgent
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "Make a console agent. Admins only; each change is a console action."
    description: >-
      The model and each fallback must have a price and carry the required tags; an agent that requires
      Embedding takes no fallback. The agent gets one caller named after its slug. The agent is saved first,
      then written into Bifrost; after 503 the same create again answers the saved agent.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/ai_settings.yaml#/AIAgentNew"
    responses:
      "201":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIAgent"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "409":
        description: "Another agent or caller has this name or slug (ai_agent_taken)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        $ref: "../responses/common.yaml#/AISettingsRefused"
      "503":
        $ref: "../responses/common.yaml#/AIGatewayUnavailable"
agent:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AIAgentID"
  patch:
    operationId: updateAIAgent
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "Change an agent. Admins only; each change is a console action."
    description: >-
      The agent is saved first; a new model, fallbacks, budget, callers' limits or on/off is then written into
      Bifrost, so the code that calls the agent needs no deploy. After 503 the change is saved and Bifrost takes
      it within 5 minutes. New instructions are a new version.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/ai_settings.yaml#/AIAgentPatch"
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIAgent"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "404":
        description: "No such agent (ai_agent_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "Another agent has this name (ai_agent_taken), or the agent changed meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        $ref: "../responses/common.yaml#/AISettingsRefused"
      "503":
        $ref: "../responses/common.yaml#/AIGatewayUnavailable"
agentUsage:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: getAIAgentUsage
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "Each agent's requests by day over a range. Admins only."
    description: "A console agent's are its turns; an app agent's are its team's requests in Bifrost."
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - name: range
        in: query
        schema:
          type: string
          enum: [7d, 30d, 90d]
          default: 7d
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIAgentUsageList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "503":
        $ref: "../responses/common.yaml#/AIGatewayUnavailable"
agentActivity:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: getAIAgentActivity
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "What the console agents did over a range. Admins only."
    description: |
      Each agent's API calls by operation (how many waited for approval,
      how many failed, how long they took), its turns by how they ended
      (stop: loop, context_full, length, deadline, budget), its approvals
      by status, and how often the rate limit refused a member's message.
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - name: range
        in: query
        schema:
          type: string
          enum: [7d, 30d, 90d]
          default: 7d
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIAgentActivity"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
agentVersions:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AIAgentID"
  get:
    operationId: listAIAgentVersions
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "An agent's instructions, newest first. Admins only."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AIAgentVersionList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "404":
        description: "No such agent (ai_agent_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
spend:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: getAISpend
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-12]
    summary: "The spend of each UTC day from from to to, in all and by agent, as Bifrost logged it. Admins only."
    description: "At most 366 days (else ai_spend_range_invalid). Bifrost's totals trail real time by up to lag_s seconds."
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/ai_settings.yaml#/AISpend"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
      "422":
        description: "to is before from, or the range is longer than 366 days (ai_spend_range_invalid)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AIGatewayUnavailable"
dashboards:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listDashboardFloors
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-10]
    summary: "The ops dashboards and the lowest role that opens each. Admins only."
    description: "Moderators read the same list on GET /v1/console/me."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/console.yaml#/DashboardFloorList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
  patch:
    operationId: setDashboardFloors
    x-capability: none
    x-role: admin
    x-uc: [UC-MOD-10]
    summary: "Change dashboards' floors. Admins only; each change is a console action."
    description: "The ticket and the dashboards' forwardAuth check read the new floor at once, so a dashboard session of a member below it is refused on its next request."
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console.yaml#/DashboardFloorsPatch"
    responses:
      "200":
        description: "Done."
        content:
          application/json:
            schema:
              $ref: "../schemas/console.yaml#/DashboardFloorList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/ConsoleForbidden"
