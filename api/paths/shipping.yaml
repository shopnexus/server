carrierAccounts:
  get:
    operationId: listCarrierAccounts
    x-uc: [UC-ACC-04]
    summary: The carrier accounts the caller linked, and the carriers they can link.
    tags: [shipping]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Linked accounts, GHN before GHTK, in code order, and the carriers this stack runs.
        content:
          application/json:
            schema:
              $ref: "../schemas/shipping.yaml#/CarrierAccountList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
carrierAccount:
  parameters:
    - name: carrier
      in: path
      required: true
      description: ghtk or ghn; another value is 422 invalid_carrier.
      schema:
        type: string
  put:
    operationId: linkCarrierAccount
    x-uc: [UC-ACC-04]
    summary: Link the caller's account at a carrier, or replace the one linked.
    description: |
      GHTK: the seller's email and password, exchanged at once for the
      shop's token through GHTK's partner API; the password is not stored.
      GHN: the seller's token and ShopId, checked against GHN's shop list;
      or the phone and the code from POST .../otp, with which GHN makes the
      seller a shop that ShopNexus is staff of, so no token is kept.
      The token is stored encrypted and never returned.
    tags: [shipping]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/shipping.yaml#/CarrierLogin"
    responses:
      "200":
        description: The linked account.
        content:
          application/json:
            schema:
              $ref: "../schemas/shipping.yaml#/CarrierAccount"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "422":
        description: "The carrier refused the account (carrier_login_failed), the code is wrong or expired (carrier_otp_invalid), the phone has no GHN account or is not a mobile (carrier_phone_unknown), GHN refused for a reason of its own (carrier_refused), or the carrier is not ghtk or ghn, or the body is the other carrier's (invalid_carrier)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "The stack runs the carrier off (carrier_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: unlinkCarrierAccount
    x-uc: [UC-ACC-04]
    summary: Unlink the caller's account at a carrier.
    tags: [shipping]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Unlinked.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No account linked at that carrier (carrier_account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "A shipment at that carrier is still open (shipments_open)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "Not ghtk or ghn (invalid_carrier)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
carrierOTP:
  post:
    operationId: sendCarrierOTP
    x-uc: [UC-ACC-04]
    x-rate-limit: code
    summary: Have GHN text the code that links the seller's GHN account.
    tags: [shipping]
    security:
      - bearerAuth: []
    parameters:
      - name: carrier
        in: path
        required: true
        description: ghn; another value is 422 invalid_carrier.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/shipping.yaml#/CarrierOTPRequest"
    responses:
      "204":
        description: GHN texted the code; it lasts 10 minutes.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "422":
        description: "No GHN account has the phone, or it is not a mobile (carrier_phone_unknown), or the carrier is not ghn (invalid_carrier)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "429":
        $ref: "../responses/common.yaml#/TooManyRequests"
      "503":
        description: "The stack runs the carrier off (carrier_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
carrierPickups:
  get:
    operationId: listCarrierPickups
    x-rate-limit: costly
    summary: The pickup points the caller registered at the carrier, read from it.
    tags: [shipping]
    security:
      - bearerAuth: []
    parameters:
      - name: carrier
        in: path
        required: true
        description: ghtk or ghn; another value is 422 invalid_carrier.
        schema:
          type: string
    responses:
      "200":
        description: The carrier's pickup points; may be empty.
        content:
          application/json:
            schema:
              $ref: "../schemas/shipping.yaml#/PickupPointList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "409":
        description: "Not linked at that carrier, or its token no longer opens and the caller links it again (carrier_not_linked, carrier_relink_needed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "Not ghtk or ghn (invalid_carrier)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "The stack runs the carrier off (carrier_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
shipmentQuote:
  get:
    operationId: quoteShipment
    x-uc: [UC-DEAL-04]
    x-rate-limit: costly
    summary: The carrier's fee for a linked shipment of a pending order, read-only.
    description: |
      The seller, before making a linked shipment. The fee depends on the
      order's recipient, the pickup and the weight. Give carrier_pickup_id
      or address_id or saved_pickup=true, exclusively, or none for the carrier's default pickup point.
    tags: [shipping]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: carrier
        in: query
        required: true
        description: ghtk or ghn; another value is 422 invalid_carrier.
        schema:
          type: string
      - name: service
        in: query
        required: true
        description: standard or express.
        schema:
          type: string
      - name: weight_grams
        in: query
        required: true
        description: 1 to 20,000 grams.
        schema:
          type: integer
      - name: carrier_pickup_id
        in: query
        required: false
        description: One of the carrier's pickup points, from GET /v1/carrier-accounts/{carrier}/pickups.
        schema:
          type: string
      - name: saved_pickup
        in: query
        required: false
        schema:
          type: boolean
          enum: [true]
      - name: address_id
        in: query
        required: false
        description: An address of the caller's from GET /v1/addresses.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The fee.
        content:
          application/json:
            schema:
              $ref: "../schemas/shipping.yaml#/Quote"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such order of the caller's (order_not_found), or missing/foreign pickup address (address_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "Not linked at that carrier, or its token no longer opens (carrier_not_linked, carrier_relink_needed); the saved pickup is absent (pickup_not_configured)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "Not ghtk or ghn (invalid_carrier); the service, weight or pickup breaks a rule (invalid_shipment, with fields); the carrier does not know an address (carrier_address_unknown); or the carrier refused, its words in details.reason (carrier_refused)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "The stack runs the carrier off (carrier_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
carrierWebhook:
  post:
    operationId: carrierWebhook
    x-rate-limit: exempt
    x-uc: [UC-DEAL-05]
    summary: A carrier's status report.
    description: |
      GHTK and GHN call it with the secret ShopNexus gave them in the
      path; GHTK signs nothing. GHTK posts label_id and status_id,
      form-encoded or as JSON; GHN posts JSON with OrderCode and Status.
      The operation declares no request body, so the request validator
      leaves any body to the handler: once the secret matches it answers
      200, also for a code no order has or a body it cannot read, so the
      carrier does not resend.
    tags: [shipping, internal]
    parameters:
      - name: carrier
        in: path
        required: true
        schema:
          type: string
      - name: secret
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Taken.
      "404":
        description: "Wrong carrier or secret (not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
shippingSettings:
  put:
    operationId: putShippingSettings
    x-uc: [UC-ACC-04]
    summary: Replace the caller's pickup preference.
    tags: [shipping]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/shipping.yaml#/ShippingSettings"
    responses:
      "200":
        description: The normalized settings.
        content:
          application/json:
            schema:
              $ref: "../schemas/shipping.yaml#/ShippingSettings"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: Missing or foreign address (address_not_found).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: Invalid contact phone (invalid_shipping_settings, with fields).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
devShipmentStatus:
  post:
    operationId: setShipmentStatus
    summary: Report a step of every shipment with a tracking code, as its carrier would.
    description: |
      Served only while a carrier is the fake, as on the dev and test
      stacks, to anyone, since the fake's parcels move only through it; a
      live carrier's parcels never move through it.
      Production does not serve it. The step joins the parcel's timeline
      and moves its orders as a carrier's report does: delivered completes
      the order 3 days later unless the buyer confirms first; returning or
      returned fails it at once and releases the listing. A closed order
      changes nothing.
    tags: [shipping, internal]
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/shipping.yaml#/DevShipmentReport"
    responses:
      "204":
        description: Taken, whether or not an order changed.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "404":
        description: "No order has a shipment with the tracking code (shipment_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
