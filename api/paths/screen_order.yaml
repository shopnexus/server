screenOrder:
  get:
    operationId: getOrderScreen
    summary: The selected order, its current deal and the public counterpart.
    description: |
      Historical orders keep their own state. The buyer also receives own_review
      and ticket (null without one). Those fields are absent for the seller.
      Recipient and pickup fields follow the canonical Order's privacy rules.
    tags: [screen]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The view.
        content:
          application/json:
            schema:
              $ref: "../schemas/screen_order.yaml#/OrderScreen"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: Unknown order or caller outside its parties (order_not_found).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
screenOrders:
  get:
    operationId: getOrdersScreen
    summary: One page of the caller's orders on one side, each with the public counterpart.
    description: |
      Newest order first, paged by order ID. The buyer's rows also carry
      own_review, as GET /v1/screens/order/{order_id} reads it; a seller's
      rows have none. Recipient and pickup fields follow the canonical
      Order's privacy rules. Every page also carries the side's count over
      all of the caller's orders: cod_orders for buying, awaiting_shipment
      for selling.
    tags: [screen]
    security:
      - bearerAuth: []
    parameters:
      - name: role
        in: query
        required: true
        description: buying lists the orders where the caller is the buyer; selling, the seller.
        schema:
          type: string
          enum: [buying, selling]
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: The view.
        content:
          application/json:
            schema:
              $ref: "../schemas/screen_order.yaml#/OrdersScreen"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
screenCodSetup:
  get:
    operationId: getCodSetupScreen
    summary: The caller's account, addresses, pickup preference and linked carriers.
    tags: [screen]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The view.
        content:
          application/json:
            schema:
              $ref: "../schemas/screen_order.yaml#/CodSetupScreen"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
screenCodCheckout:
  get:
    operationId: getCodCheckoutScreen
    summary: The buyer's checkout before requesting COD.
    description: |
      The address is the selected owned address or the default; null with
      an empty book. shipping_estimate is null on every call, with the fake
      carrier and the real ones, linked or not: the server has no estimator
      before an order exists, and the buyer gives no weight. The seller
      reads the carrier's fee for the order with GET /v1/shipments/quote
      once it is requested. This read makes no carrier call or write.
    tags: [screen]
    security:
      - bearerAuth: []
    parameters:
      - name: deal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: address_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The view.
        content:
          application/json:
            schema:
              $ref: "../schemas/screen_order.yaml#/CodCheckoutScreen"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: Unknown deal or caller outside its buyer (deal_not_found); explicit missing or foreign address (address_not_found).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
