# The console agent: a member's conversations with an agent that runs in
# the agent runtime. The server keeps the conversations, their messages and
# each turn's events, starts a turn's run on the runtime and streams the
# run back. The agent reads and changes ShopNexus through this API with a
# token of its turn: it may call the operations whose x-capability its
# agent holds, as the member it works for, and a change it asks for waits
# for a member's approval.
conversations:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listConsoleAgentConversations
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: The agent conversation of a record, those about records of a kind, or the caller's own.
    description: |
      With subject_kind and subject_id, the conversation of that ticket or
      account, which every member shares (at most one). With subject_kind
      alone, the conversations about records of that kind. With none, the
      caller's conversations without a record. Newest activity first.
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - name: subject_kind
        in: query
        schema:
          $ref: "../schemas/console_agent.yaml#/AgentSubjectKind"
      - name: subject_id
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentConversationList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "422":
        $ref: "../responses/common.yaml#/AgentSubjectInvalid"
  post:
    operationId: createConsoleAgentConversation
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Open the agent conversation of a record, or start one of the caller's own.
    description: |
      A record has one conversation, shared by every member: the first call
      for a subject makes it, and later calls answer the same one. Without a
      subject the conversation is new and the caller's; a repeated
      Idempotency-Key answers the conversation its first call made.
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKeyOptional"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentConversationNew"
    responses:
      "200":
        description: The conversation.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentConversation"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "422":
        $ref: "../responses/common.yaml#/AgentSubjectInvalid"
conversation:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentConversationID"
  get:
    operationId: getConsoleAgentConversation
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: One agent conversation with its messages and turns, oldest first.
    description: |
      The messages are the conversation's history as the model reads it:
      what members wrote, what the agent answered, the commands it ran and
      what they printed. Each turn names the member who started it.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentConversationDetail"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentConversationNotFound"
  patch:
    operationId: renameConsoleAgentConversation
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Give a conversation a title.
    description: >-
      A member renames their own conversation without a subject, an admin any. Another member's own is not found;
      a ticket's or an account's shared conversation is an admin's (agent_forbidden).
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentConversationRename"
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentConversation"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "A shared conversation, for a moderator (agent_forbidden)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        $ref: "../responses/common.yaml#/AgentConversationNotFound"
      "422":
        description: "The title is empty or longer than 80 characters (agent_title_invalid)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: deleteConsoleAgentConversation
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Delete a conversation with its messages, turns and approvals.
    description: >-
      Who may is as for the rename. A conversation with a turn running is refused (agent_turn_in_progress).
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "A shared conversation, for a moderator (agent_forbidden)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        $ref: "../responses/common.yaml#/AgentConversationNotFound"
      "409":
        description: "A turn of the conversation is running (agent_turn_in_progress)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
conversationTurns:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentConversationID"
  post:
    operationId: askConsoleAgent
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Write to a console agent in a conversation; its turn starts and the answer comes on the turn's events.
    description: |
      The server adds the message to the conversation, opens the turn as
      running and starts its run on the agent runtime with the picked
      agent (the Console assistant when agent_id is left out), then
      answers 202 with the turn's id; the console opens GET
      /v1/console/agent/turns/{id}/events to watch it. Closing the stream
      does not stop the run. A repeated Idempotency-Key answers the turn
      its first call opened and starts no run.
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKeyOptional"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentQuestion"
    responses:
      "202":
        description: The turn is running.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnStarted"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation (agent_conversation_not_found), or agent_id is no console agent (ai_agent_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "A turn is still running in this conversation (agent_turn_in_progress) or the agent is turned
          off (ai_agent_disabled)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The message is empty once trimmed (agent_input_rejected)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "429":
        description: "The member asked too much in a short time (agent_rate_limited)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turn:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  get:
    operationId: getConsoleAgentTurn
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: One turn.
    description: Its status, why it stopped, its usage, and last_seq, where a page that loads opens the stream.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurn"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
turnEvents:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  get:
    operationId: streamConsoleAgentTurnEvents
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: A turn's run as server-sent events, replayed after Last-Event-ID and then live.
    description: |
      text/event-stream. Each event has `id:` its seq and `data:` one
      AgentRunEvent as JSON; a comment line keeps the connection open. The
      server replays the turn's events after the given seq and then follows
      the run live, so a closed tab reconnects with Last-Event-ID, or with
      after in the query on a page load. The stream ends after turn.paused
      or turn.finished; after a resume the console opens it again from its
      last seq. Closing the stream does not stop the run.
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - name: Last-Event-ID
        in: header
        description: The seq of the last event the console has.
        schema:
          type: string
          maxLength: 20
      - name: after
        in: query
        description: Last-Event-ID for a stream the page opens itself; the header wins.
        schema:
          type: string
          maxLength: 20
    responses:
      "200":
        description: The stream.
        content:
          text/event-stream:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentRunEvent"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
turnPause:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: pauseConsoleAgentTurn
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Pause a run before its next model call.
    description: >-
      The commands the agent is running finish first, so none is cut halfway (turn.pausing, then turn.paused). A
      paused turn resumes with POST .../resume or a new message. To cut the commands short, stop the turn.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "202":
        description: Taken; the run's events show it.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnStop:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: stopConsoleAgentTurn
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Stop a run now.
    description: >-
      Ends the model call and the commands in flight at once; the agent reads that a staff member stopped them. The
      turn goes stopped and keeps what it wrote; it resumes as a paused one does.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "202":
        description: Taken; the run's events show it.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnResume:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: resumeConsoleAgentTurn
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Resume the conversation's last turn where it ended, with no new message.
    description: >-
      Takes a paused, stopped, failed or timed out turn that is its conversation's last. The turn runs again on the
      history it left (turn.resumed); the console opens the stream again from its last seq.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "202":
        description: The turn is running.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnSteer:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: steerConsoleAgentTurn
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Write to a running turn; the agent reads it before its next model call.
    description: >-
      The message joins the conversation at the next step (in the step event's messages). A turn that is not
      running takes a new message instead (POST .../conversations/{id}/turns).
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentSteer"
    responses:
      "202":
        description: Waiting to be read.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
operations:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listConsoleAgentOperations
    x-capability: turn
    x-uc: [UC-MOD-08]
    summary: The API operations an agent may be given, by capability.
    description: |
      For a member, every operation an agent may hold through its
      capabilities, for the AI settings. For an agent's turn, the ones its
      agent holds: the commands of the shopnexus CLI in its sandbox. An
      operation with approval set changes something: the agent's call does
      not run it but answers 202 with an approval that a member approves or
      rejects (GET /v1/console/agent/approvals). Each operation's body is
      its request body's JSON Schema with the references resolved.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentOperationList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
approvals:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listConsoleAgentApprovals
    x-capability: turn
    x-uc: [UC-MOD-08]
    summary: The changes agents asked for, newest first.
    description: |
      A member sees the approvals of the conversations they may open;
      without conversation_id, every one of those, so at most 100. An
      agent's turn sees its own conversation's only, so it can tell what
      became of the changes it asked for.
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - name: conversation_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: "../schemas/console_agent.yaml#/AgentApprovalStatus"
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentApprovalList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
approvalApprove:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentApprovalID"
  post:
    operationId: approveConsoleAgentApproval
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Approve a change an agent asked for; the server makes the call as the approver.
    description: |
      The stored request runs now with the approver's session and rights,
      as if they had made it: a role too low or a record that changed
      since fails it like any call. The approval answers with the call's
      status and body: approved for a 2xx, failed otherwise. Any member
      who may open the conversation may approve.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Decided.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentApproval"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentApprovalNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentApprovalDecided"
approvalReject:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentApprovalID"
  post:
    operationId: rejectConsoleAgentApproval
    x-capability: none
    x-uc: [UC-MOD-08]
    summary: Reject a change an agent asked for.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Decided.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentApproval"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentApprovalNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentApprovalDecided"
consoleAgents:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listConsoleAgents
    x-capability: none
    summary: The console agents a member may pick in the ask box.
    description: The agents turned on; the Console assistant is the default.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/ConsoleAgentList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
