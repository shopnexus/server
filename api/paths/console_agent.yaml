# The console agent: a member's conversations with the agent, which the
# server forwards to the agent service with the member's id and role. The
# agent only reads, through the server's MCP tools; every change stays a
# console call of its own.
conversations:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listConsoleAgentConversations
    x-uc: [UC-MOD-08]
    summary: The agent conversation of a record, those about records of a kind, or the caller's own.
    description: |
      With subject_kind and subject_id, the conversation of that ticket or
      account, which every member shares (at most one). With subject_kind
      alone, the conversations about records of that kind. With neither,
      the caller's conversations without a record. Newest activity first.
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - name: subject_kind
        in: query
        schema:
          $ref: "../schemas/console_agent.yaml#/AgentSubjectKind"
      - name: subject_id
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentConversationList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "422":
        $ref: "../responses/common.yaml#/AgentSubjectInvalid"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
  post:
    operationId: createConsoleAgentConversation
    x-uc: [UC-MOD-08]
    summary: Open the agent conversation of a record, or start one of the caller's own.
    description: |
      A record has one conversation, shared by every member: the first call
      for a subject makes it, and later calls answer the same one. Without a
      subject the conversation is new and the caller's.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentConversationNew"
    responses:
      "200":
        description: The conversation.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentConversation"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "422":
        $ref: "../responses/common.yaml#/AgentSubjectInvalid"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
conversation:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentConversationID"
  get:
    operationId: getConsoleAgentConversation
    x-uc: [UC-MOD-08]
    summary: One agent conversation with its turns, oldest first.
    description: Each turn names the member who asked.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentConversationDetail"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentConversationNotFound"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
conversationTurns:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentConversationID"
  post:
    operationId: askConsoleAgent
    x-uc: [UC-MOD-08]
    summary: Ask a console agent in a conversation; the run starts and the answer comes on its events.
    description: |
      The server adds the picked agent's configuration (the Console
      assistant when agent_id is left out) and forwards the question. The
      agent stores the turn as running and answers 202 with its id at once;
      the console then opens GET /v1/console/agent/turns/{id}/events to
      watch the run step by step. Closing the stream does not stop the run.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentQuestion"
    responses:
      "202":
        description: The turn is running.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnStarted"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation (agent_conversation_not_found), or agent_id is no console agent (ai_agent_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "A turn is still running in this conversation (agent_turn_in_progress), the conversation is
          closed (agent_conversation_closed) or the agent is turned off (ai_agent_disabled)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The question is longer than 2000 characters (agent_input_rejected)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "429":
        description: "The agent's budget is spent (agent_budget), and the rest of the console works without it; or
          the member asked too much in a short time (agent_rate_limited)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turn:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  get:
    operationId: getConsoleAgentTurn
    summary: One turn as the agent keeps it.
    description: |
      Its status, answer, sources, outcome, usage, the updates sent to it
      and, while it waits, its questions. last_seq is where a page that
      loads opens the stream.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurn"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnEvents:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  get:
    operationId: streamConsoleAgentTurnEvents
    summary: A turn's run as server-sent events, replayed after Last-Event-ID and then live.
    description: |
      text/event-stream. Each event has `id:` its seq and `data:` one
      AgentRunEvent as JSON; a comment line keeps the connection open. The
      agent replays the turn's events after the given seq from its database
      and then follows the run live, so a closed tab reconnects with
      Last-Event-ID, or with after in the query on a page load. The server
      copies the stream event by event and sets no deadline. The stream ends
      after turn.finished, turn.paused or clarify; after Continue, answers or
      an update to a paused turn the console opens it again from its last
      seq. Closing the stream ends the server's read, not the run.
    tags: [console, internal]
    security:
      - consoleAuth: []
    parameters:
      - name: Last-Event-ID
        in: header
        description: The seq of the last event the console has.
        schema:
          type: string
          maxLength: 20
      - name: after
        in: query
        description: Last-Event-ID for a stream the page opens itself; the header wins.
        schema:
          type: string
          maxLength: 20
    responses:
      "200":
        description: The stream.
        content:
          text/event-stream:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentRunEvent"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnPause:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: pauseConsoleAgentTurn
    summary: Pause a run before its next model call.
    description: "The model call in flight and the tools it asked for finish, so no tool is cut halfway. The turn goes paused (turn.pausing, then turn.paused) and keeps its state, so any agent replica can continue it."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "202":
        description: Taken; the run's events show it.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnStop:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: stopConsoleAgentTurn
    summary: Stop a run now.
    description: "Ends the model call in flight at once (Stop now). The turn goes paused with reason stop_now and keeps what it wrote; it can be continued."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "202":
        description: Taken; the run's events show it.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnContinue:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: continueConsoleAgentTurn
    summary: Continue a paused, failed, timed out or stopped turn.
    description: "Resumes the same turn with no new message, its counters carried on (turn.resumed with by continue). A spent budget or a guardrail block cannot be continued."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "202":
        description: Taken; the run's events show it.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnEnd:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: endConsoleAgentTurn
    summary: End a paused turn.
    description: "A paused turn, or one awaiting input, ends cancelled and writes nothing more."
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: The turn is cancelled.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnSteer:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: steerConsoleAgentTurn
    summary: Steer a run, or continue a paused one with a message.
    description: |
      The text waits on the turn's control stream and the run reads it
      before its next model call (steer.read names the step). Sent to a
      paused turn it continues the run (turn.resumed with by steer). An
      update that carries an attachment, a skill or another agent is a new
      question instead.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentSteer"
    responses:
      "202":
        description: Waiting to be read.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentSteering"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
turnInput:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentTurnID"
  post:
    operationId: answerConsoleAgentTurn
    summary: Answer the clarifying questions a turn waits on.
    description: The turn is awaiting_input after a clarify event; the answers go to the run and it goes on.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentInput"
    responses:
      "202":
        description: The run goes on.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentTurnState"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/AgentTurnNotFound"
      "409":
        $ref: "../responses/common.yaml#/AgentTurnState"
      "422":
        description: "The answers do not fit the turn's questions (agent_answers_invalid)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
toolCall:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentToolCallID"
  get:
    operationId: getConsoleAgentToolCall
    summary: One tool call in full, for the tool panel.
    description: Events carry a tool call's summary only; this is its input, result, timing and attempts.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentToolCall"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such tool call (agent_tool_call_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
document:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentDocumentID"
  get:
    operationId: getConsoleAgentDocument
    summary: A document a turn wrote, with every version, newest first.
    description: Documents are kept with their chat and deleted with it. Export is the console's (Markdown copy, print to PDF).
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentDocument"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such document (agent_document_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
skills:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listConsoleAgentSkills
    summary: Every saved skill; each is shared with every member.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentSkillList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
  post:
    operationId: createConsoleAgentSkill
    summary: Save a skill, a question with {{variables}}, for every member.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentSkillNew"
    responses:
      "201":
        description: Saved.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentSkill"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "409":
        description: "Another skill has this slug (agent_skill_taken)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The skill's fields do not fit (agent_skill_invalid)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
skill:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
    - $ref: "../parameters/common.yaml#/AgentSkillID"
  get:
    operationId: getConsoleAgentSkill
    summary: One skill.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentSkill"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such skill (agent_skill_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
  patch:
    operationId: updateConsoleAgentSkill
    summary: Change a skill; its maker or an admin may.
    tags: [console, internal]
    security:
      - consoleAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/console_agent.yaml#/AgentSkillPatch"
    responses:
      "200":
        description: Changed.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/AgentSkill"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The skill is another member's and the caller is no admin (agent_forbidden)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such skill (agent_skill_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "Another skill has this slug (agent_skill_taken)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The skill's fields do not fit (agent_skill_invalid)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
  delete:
    operationId: deleteConsoleAgentSkill
    summary: Delete a skill; its maker or an admin may.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The skill is another member's and the caller is no admin (agent_forbidden)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such skill (agent_skill_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        $ref: "../responses/common.yaml#/AgentUnavailable"
consoleAgents:
  parameters:
    - $ref: "../parameters/common.yaml#/ConsoleCSRF"
  get:
    operationId: listConsoleAgents
    summary: The console agents a member may pick in the ask box.
    description: The agents turned on; the Console assistant is the default.
    tags: [console, internal]
    security:
      - consoleAuth: []
    responses:
      "200":
        description: Done.
        content:
          application/json:
            schema:
              $ref: "../schemas/console_agent.yaml#/ConsoleAgentList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
