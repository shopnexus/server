          type: string
          format: uuid
    responses:
      "200":
        description: The listing.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/Listing"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing of the caller's (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is not active or hidden (listing_state_conflict), or changed meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
listingUnmarkSold:
  post:
    operationId: unmarkListingSold
    summary: Undo marking a listing sold; it goes back on sale.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The listing.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/Listing"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing of the caller's (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is not sold (listing_state_conflict), the seller has 20 listings on sale or hidden (listing_cap_reached), or it changed meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
myListings:
  get:
    operationId: listMyListings
    summary: List the caller's listings, newest first.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - name: pane
        in: query
        required: true
        description: on_sale holds listings in processing, active, hidden and rejected; sold holds sold ones.
        schema:
          type: string
          enum: [on_sale, sold]
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of listings.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/ListingList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
categories:
