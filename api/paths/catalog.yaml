          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is not hidden (listing_state_conflict), or changed meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
listingMarkSold:
  post:
    operationId: markListingSold
    summary: Record a sale made off the app.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The listing.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/Listing"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing of the caller's (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is not active or hidden (listing_state_conflict), or changed meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
listingUnmarkSold:
  post:
    operationId: unmarkListingSold
    summary: Undo marking a listing sold; it goes back on sale.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The listing.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/Listing"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing of the caller's (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is not sold (listing_state_conflict), the seller has 20 listings in processing, active, hidden, rejected or reserved (listing_cap_reached), or it changed meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
listingPhotoCopies:
  post:
    operationId: copyListingPhotos
    x-uc: [UC-LST-02]
    summary: Copy the photos of one of the caller's listings into new uploads, to post a new listing from them.
    description: |
      For Đăng lại. Each processed photo of the listing, in order, becomes
      a new waiting upload of the caller's, which POST /v1/listings and
      PUT /v1/listing-drafts/{id} take like a photo the app put; the
      listing keeps its own photos. An upload expires 24 hours after the
      copy unless a listing takes it or a draft keeps it. A photo copied
      from the caller's listing on another site stays marked copied once
      the new listing is processed. A photo not processed yet is left out.
      Any status but deleted may be copied. A repeated Idempotency-Key for
      the same listing returns the same uploads, with fresh URLs; a new key
      makes new ones.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "201":
        description: The new uploads, in the listing's photo order.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/ListingPhotoCopies"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing of the caller's, or it is deleted (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
categories:
  get:
    operationId: listCategories
    summary: The category tree.
    tags: [catalog]
    responses:
      "200":
        description: Every category.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/CategoryList"
regions:
  get:
    operationId: listProvinces
    summary: The provinces, after the 2025 merger.
    tags: [catalog]
    responses:
      "200":
        description: Every province.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/ProvinceList"
regionCommunes:
  get:
    operationId: listCommunes
    summary: The communes of a province.
    tags: [catalog]
    parameters:
      - name: province_code
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9]{2}$"
    responses:
      "200":
        description: The province's communes.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/CommuneList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
regionNearest:
  get:
    operationId: nearestCommune
    summary: The commune nearest a point, with its province.
    description: |
      The commune whose point is closest to lat and lng, as the app asks
      when it fills in the area from the phone's position. The communes
      table holds one point per commune and no boundaries, so a commune
      farther than 30 km counts as none. The point is used for this request
      only; it is neither stored nor logged.
    tags: [catalog]
    parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
    responses:
      "200":
        description: The nearest commune.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/Location"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "404":
        description: "No commune lies within 30 km of the point (no_commune_near)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
listingDrafts:
  get:
    operationId: listListingDrafts
    summary: List the caller's drafts.
    description: |
      Every draft of the caller's, in full, last edited first; at most 20,
      so there are no pages. Drafts past expires_at are deleted first.
    tags: [catalog]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The drafts.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/ListingDraftList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
listingDraft:
  put:
    operationId: putListingDraft
    summary: Create or replace one of the caller's drafts.
    description: |
      The app mints the ID, a UUIDv7, so a draft made offline has its ID
      before it reaches the server. The last PUT wins. Photos a listing took
      or that expired are dropped; each of the others is kept 30 days from
      this PUT, and a later PUT never shortens that. The draft is kept 30
      days from this PUT. Drafts of the caller's past expires_at are deleted
      first, so they free their places.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/catalog.yaml#/ListingDraftInput"
    responses:
      "200":
        description: The draft, replaced.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/ListingDraft"
      "201":
        description: The draft, created.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/ListingDraft"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "The ID is another account's draft (draft_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "A create when the caller has 20 drafts (draft_limit_reached), or the photos collided with another write (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "A photo is not the caller's photo upload, waiting before its expiry and in the store as declared (invalid_upload)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: deleteListingDraft
    summary: Delete one of the caller's drafts.
    description: Its photos expire on their own. The app calls it after a post from the draft.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Deleted, or there was no such draft of the caller's.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
