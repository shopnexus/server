listings:
  post:
    operationId: createListing
    summary: Post a listing.
    description: |
      The listing starts in processing while its photos are processed, then
      turns active, or rejected when a photo is refused. Checks, in order:
      account_suspended, listing_cap_reached (20 listings in
      processing, active, hidden, rejected or reserved), invalid_listing,
      invalid_upload.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/catalog.yaml#/ListingInput"
    responses:
      "201":
        description: The listing, in processing.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/Listing"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended), or has no phone to sign in with (phone_required)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The seller has 20 listings in processing, active, hidden, rejected or reserved (listing_cap_reached)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "A field breaks a rule (invalid_listing, with fields), or an upload is not the caller's, not uploaded yet, or already used (invalid_upload)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
listing:
  get:
    operationId: getListing
    summary: Read a listing.
    description: |
      Anyone may read an active listing. Its seller, signed in, also reads it
      in any other status; anyone else gets 404.
    tags: [catalog]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The listing.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/Listing"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing for this caller (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  put:
    operationId: updateListing
    summary: Replace a listing's content.
    description: |
      The body is the whole listing, as when posting. Photos not in the
      listing yet take it back to processing until they are processed; an
      edit of a rejected listing does too. Sold listings cannot be edited.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/catalog.yaml#/ListingInput"
    responses:
      "200":
        description: The listing.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/Listing"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "404":
        description: "No such listing of the caller's (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is sold or deleted (listing_state_conflict), or changed meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "A field breaks a rule (invalid_listing, with fields), or an added upload is not the caller's, not uploaded yet, or already used (invalid_upload)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: deleteListing
    summary: Delete a listing.
    tags: [catalog]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Deleted.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing of the caller's (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is already deleted (listing_state_conflict), or changed meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
