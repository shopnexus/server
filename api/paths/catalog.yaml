        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/CategoryList"
regions:
  get:
    operationId: listProvinces
    summary: The provinces, after the 2025 merger.
    tags: [catalog]
    responses:
      "200":
        description: Every province.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/ProvinceList"
regionCommunes:
  get:
    operationId: listCommunes
    summary: The communes of a province.
    tags: [catalog]
    parameters:
      - name: province_code
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9]{2}$"
    responses:
      "200":
        description: The province's communes.
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/CommuneList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
