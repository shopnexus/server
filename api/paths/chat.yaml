conversations:
  post:
    operationId: openConversation
    summary: Open the conversation with a listing's seller, or reuse the pair's, and send the first message.
    description: |
      One conversation per pair of people, whatever their roles. Checks, in
      order: account_suspended, the listing exists, own_listing,
      listing_unavailable, blocked, then the message.
    tags: [chat]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/chat.yaml#/ConversationOpen"
    responses:
      "201":
        description: The conversation.
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.yaml#/Conversation"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended), has no phone to sign in with (phone_required), or a block stands between the two (blocked)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such listing (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing) or not on sale (listing_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The message breaks a rule (invalid_message, with fields), or a photo is not the caller's, not uploaded or already used (invalid_upload)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
conversationMessages:
  get:
    operationId: listMessages
    summary: List a conversation's messages, newest first.
    description: |
      The deal messages of the two people's deals come in the same list, by
      the time of their moves.
    tags: [chat]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of messages.
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.yaml#/MessageList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation of the caller's (conversation_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  post:
    operationId: sendMessage
    summary: Send a message.
    description: |
      A photo message is processing until its photos are processed; only
      the sender sees it until it is sent. A suspended account may still
      write in a support chat. Deal messages come from moves on the deals,
      never from this endpoint.
    tags: [chat]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/chat.yaml#/MessageDraft"
    responses:
      "201":
        description: The message.
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.yaml#/Message"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended), or a block stands between the two (blocked)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such conversation of the caller's (conversation_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The other person deleted their account (account_deleted)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The message breaks a rule (invalid_message, with fields), or a photo is not the caller's, not uploaded or already used (invalid_upload)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
conversationRead:
  post:
    operationId: readConversation
    summary: Mark the conversation read up to a message.
    description: |
      A message older than the caller's marker moves nothing. Every read
      clears the caller's unread mark (POST /v1/conversations/{id}/unread).
    tags: [chat]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/chat.yaml#/ReadMark"
    responses:
      "204":
        description: Marked.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation, or message in it, of the caller's (conversation_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
conversationUnread:
  post:
    operationId: markConversationUnread
    summary: Mark a conversation unread until the caller reads it.
    description: |
      The conversation counts at least 1 in the inbox row's unread and in
      GET /v1/me/unread. POST /v1/conversations/{id}/read clears the mark.
      The read marker, and what the other member sees as read, stay.
    tags: [chat]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Marked.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation of the caller's (conversation_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "A support chat cannot be archived or marked (conversation_is_support)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
conversationArchive:
  post:
    operationId: archiveConversation
    summary: Archive a conversation; the next message brings it back.
    tags: [chat]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Archived.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation of the caller's (conversation_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "A support chat cannot be archived or marked (conversation_is_support)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
conversationUnarchive:
  post:
    operationId: unarchiveConversation
    summary: Unarchive a conversation.
    tags: [chat]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Unarchived.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation of the caller's (conversation_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "A support chat cannot be archived or marked (conversation_is_support)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
unread:
  get:
    operationId: getUnread
    summary: Count the caller's unread messages, unread notices and the offers waiting on them.
    description: |
      unread counts the messages over unarchived pair conversations, as the
      inbox does; notifications counts the unread notices, as Home's
      notifications_unread does; offers counts the buyers' open offers on
      the caller's listings as the deals hold them, so an offer a change of
      the listing voided counts until the deal records that change. Module
      screen serves it, since it reads chat, notification and deal; the
      chat tag keeps it in the app's chat client.
    tags: [chat]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The count.
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.yaml#/Unread"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
quickReplies:
  get:
    operationId: getQuickReplies
    summary: The caller's quick replies; an account that never saved any reads the defaults.
    description: |
      The defaults are three answers a seller often gives, in the request's
      language. Reading them writes nothing; the first PUT saves the list.
    tags: [chat]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/AcceptLanguage"
    responses:
      "200":
        description: The quick replies.
        headers:
          Vary:
            $ref: "../headers/common.yaml#/VaryAcceptLanguage"
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.yaml#/QuickReplies"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
  put:
    operationId: putQuickReplies
    summary: Replace the caller's quick replies.
    description: |
      The list replaces the saved one whole, in the order given; an empty
      list saves no answer, and the defaults do not come back. The last PUT
      wins.
    tags: [chat]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/chat.yaml#/QuickReplies"
    responses:
      "200":
        description: The saved quick replies, trimmed.
        content:
          application/json:
            schema:
              $ref: "../schemas/chat.yaml#/QuickReplies"
      "400":
        description: "A malformed body (invalid_request, malformed_json): over 20 answers, or an answer that is blank or over 200 characters."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
