saved:
  get:
    operationId: listSaved
    summary: List the caller's saved listings, those still on sale first.
    description: |
      The saves of listings that are not sold, hidden or deleted come first,
      then the others, each group newest save first. A listing that sells
      between two pages moves to the end, so the later pages may show it
      again or skip a save that moved up.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of saves.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SavedList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
savedListing:
  put:
    operationId: saveListing
    summary: Save someone else's listing on sale or being shipped; saving again changes nothing.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Saved.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing), not on sale (listing_unavailable), or the caller has 500 saves (saved_limit_reached)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: unsaveListing
    summary: Forget a saved listing; an absent one is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Forgotten.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
search:
  get:
    operationId: search
    summary: Search active listings; without q, browse them.
    description: |
      Three ways to search, all under the person's filters and sorts. With q a
      model reads the query; BM25 on its words, its Vietnamese rewrite against
      listing text vectors and its English description against listing photos
      are fused by weighted RRF. With photo, the photo against listing photos
      alone. With like, the listing's title, text vector and photos. Without
      any, the call browses, newest first by default, and category alone is the
      category page. sort=nearby is the "Gần bạn" feed, which Home's first page
      comes from. A model that fails leaves the lists it feeds out; q then
      searches its raw words, with no chips. A signed-in caller's first page
      with q is kept in the search history, and a signed-in caller never sees
      the listings they hid nor those of an account on either side of their
      blocks. With watch, a watch of the caller's runs its query and filters.
      photo and watch need a signed-in caller. province keeps the listings of
      one province, in the results and in counts, and goes with every other
      filter.
    tags: [discovery]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: category
        in: query
        description: A root or subcategory code from GET /v1/categories.
        schema:
          type: string
      - name: province
        in: query
        description: A province code from GET /v1/regions, such as 01 for Hà Nội; keeps the listings whose commune is in it. An unknown code is invalid_province.
        schema:
          type: string
          pattern: "^[0-9]{2}$"
      - name: price_min
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: price_max
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: condition
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: "../schemas/catalog.yaml#/Condition"
      - $ref: "../parameters/discovery.yaml#/RadiusKm"
      - name: offers_only
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        description: relevance by default with q, photo or like, newest without. nearby goes without q, photo and like, and scores the listings by distance and age. nearest and nearby need a position and keep within 50 km without radius_km. The other sorts order the listings the search found.
        schema:
          type: string
          enum: [relevance, newest, nearest, nearby, price_asc, price_desc]
      - name: "off"
        in: query
        description: Chip IDs to leave out; the cached understanding is reused.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - $ref: "../parameters/discovery.yaml#/NearLat"
      - $ref: "../parameters/discovery.yaml#/NearLng"
      - $ref: "../parameters/discovery.yaml#/NearCommune"
      - $ref: "../parameters/discovery.yaml#/SearchPhoto"
      - $ref: "../parameters/discovery.yaml#/SearchLike"
      - $ref: "../parameters/discovery.yaml#/SearchWatch"
      - $ref: "../parameters/discovery.yaml#/SearchCursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of listings.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchView"
      "400":
        description: "A malformed parameter, position_required, invalid_position, invalid_province, invalid_cursor, invalid_price_range, or search_conflict: photo with q or like, sort=nearby with q, photo or like, or watch with any parameter but cursor, limit, sort and off."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "listing_not_found: like names a listing that is not on sale or reserved; watch_not_found: watch is not a watch of the caller's."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "invalid_upload: photo is not a waiting upload of the caller's, or not a readable image."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "search_unavailable: the photo could not be embedded; try again."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
sellerListings:
  get:
    operationId: listSellerListings
    summary: A seller's listings that anyone sees, active and reserved, newest first, as search cards.
    description: |
      The seller view's load more, with the view's next_cursor. Each card
      has saved for a signed-in caller and, with a position, distance_km,
      measured as GET /v1/search measures it. A signed-in caller never sees
      the listings they hid.
    tags: [discovery]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
      - $ref: "../parameters/discovery.yaml#/NearLat"
      - $ref: "../parameters/discovery.yaml#/NearLng"
      - $ref: "../parameters/discovery.yaml#/NearCommune"
    responses:
      "200":
        description: One page of listings.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchItemList"
      "400":
        description: "A malformed parameter, or invalid_position."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such account (account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
searchHistory:
  get:
    operationId: getSearchHistory
    summary: The caller's last 10 text searches, newest first.
    tags: [discovery]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The history.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchHistory"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
  delete:
    operationId: clearSearchHistory
    summary: Empty the caller's search history.
    tags: [discovery]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Emptied.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
searchHistoryItem:
  delete:
    operationId: deleteSearchHistoryItem
    summary: Forget one search; an unknown one is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Forgotten.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
hiddenListing:
  put:
    operationId: hideFromSearch
    summary: Leave someone else's listing out of the caller's searches, Home and the nearby feed; hiding again makes it the newest hide.
    description: The caller keeps the 1,000 newest hides; one more shows the oldest again. Saved listings, the seller page and the listing itself still show it.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Hidden.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing, or it is deleted (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: unhideFromSearch
    summary: Show a hidden listing again; a listing not hidden is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Shown again.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
viewedListing:
  put:
    operationId: markViewed
    summary: Count the caller's open of someone else's listing on sale, once per UTC day.
    description: |
      For a listing view read as a prefetch (Sec-Purpose on
      GET /v1/screens/listing/{id}), which counts nothing until the person
      sees it. Any other read of the view counts by itself. The seller's
      own listing, one not active or reserved and a second open that day
      count nothing, and each answers 204.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Counted, or nothing to count.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
savedAlert:
  put:
    operationId: setSavedAlert
    summary: Hear when the listing's price falls below a level; a listing not saved is saved first.
    description: The caller hears at each new low below the level. A price back at or above it starts over, and setting a level forgets the price last told.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/discovery.yaml#/SavedAlert"
    responses:
      "204":
        description: Set.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing), not on sale (listing_unavailable), the caller has 500 saves (saved_limit_reached), or the save went meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: clearSavedAlert
    summary: Remove the save's own level; the save stays, and a listing not saved is fine.
    description: Without a level of its own, a save tells at each new low below its saved price.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Removed.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
searchWatches:
  post:
    operationId: createSearchWatch
    summary: Follow a text search with its filters; the same words again replace the filters.
    description: |
      One watch per query, folded as the search history folds it. A GPS
      point is turned into its nearest commune and not kept. A sweep every 30
      minutes counts the new listings holding every word of the query or of a
      phrase the model read from it, under the filters, and tells the caller
      while the watch is not muted.
    tags: [discovery]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/discovery.yaml#/SearchWatchInput"
    responses:
      "200":
        description: The watch of the same query, with the new filters.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchWatch"
      "201":
        description: A new watch.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchWatch"
      "400":
        description: "A malformed body, invalid_price_range, invalid_position (no commune within 30 km of the point, or an unknown commune), or position_required (radius_km without a place)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "409":
        description: "The caller has 20 watches (watch_limit_reached)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  get:
    operationId: listSearchWatches
    summary: The caller's watches, newest first.
    tags: [discovery]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The watches.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchWatchList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
searchWatch:
  delete:
    operationId: deleteSearchWatch
    summary: Stop following a search; an unknown watch is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/discovery.yaml#/WatchID"
    responses:
      "204":
        description: Forgotten.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
searchWatchMute:
  post:
    operationId: muteSearchWatch
    summary: Keep counting the watch's new listings without telling the caller.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/discovery.yaml#/WatchID"
    responses:
      "204":
        description: Muted.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "Not a watch of the caller's (watch_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
searchWatchUnmute:
  post:
    operationId: unmuteSearchWatch
    summary: Tell the caller of the watch's new listings again.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/discovery.yaml#/WatchID"
    responses:
      "204":
        description: Unmuted.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "Not a watch of the caller's (watch_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
