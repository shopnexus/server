saved:
  get:
    operationId: listSaved
    summary: List the caller's saved listings, newest save first.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of saves.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SavedList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
savedListing:
  put:
    operationId: saveListing
    summary: Save someone else's listing on sale or being shipped; saving again changes nothing.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Saved.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing), not on sale (listing_unavailable), or the caller has 500 saves (saved_limit_reached)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: unsaveListing
    summary: Forget a saved listing; an absent one is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Forgotten.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
search:
  get:
    operationId: search
    summary: Search active listings; without q, browse them.
    description: |
      Three ways to search, all under the person's filters and sorts. With q a
      model reads the query; BM25 on its words, its Vietnamese rewrite against
      listing text vectors and its English description against listing photos
      are fused by weighted RRF. With photo, the photo against listing photos
      alone. With like, the listing's title, text vector and photos. Without
      any, the call browses, newest first by default, and category alone is the
      category page. sort=nearby is the "Gần bạn" feed, which Home's first page
      comes from. A model that fails leaves the lists it feeds out; q then
      searches its raw words, with no understood and no chips. A signed-in
      caller's first page with q is kept in the search history, and a
      signed-in caller never sees the listings they hid nor those of an
      account on either side of their blocks.
    tags: [discovery]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: category
        in: query
        description: A root or subcategory code from GET /v1/categories.
        schema:
          type: string
      - name: price_min
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: price_max
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: condition
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: "../schemas/catalog.yaml#/Condition"
      - name: radius_km
        in: query
        description: Needs a position.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: offers_only
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        description: relevance by default with q, photo or like, newest without. nearby goes without q, photo and like, and scores the listings by distance and age. nearest and nearby need a position and keep within 50 km without radius_km. The other sorts order the listings the search found.
        schema:
          type: string
          enum: [relevance, newest, nearest, nearby, price_asc, price_desc]
      - name: "off"
        in: query
        description: Chip IDs to leave out; the cached understanding is reused.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - $ref: "../parameters/discovery.yaml#/NearLat"
      - $ref: "../parameters/discovery.yaml#/NearLng"
      - $ref: "../parameters/discovery.yaml#/NearCommune"
      - $ref: "../parameters/discovery.yaml#/SearchPhoto"
      - $ref: "../parameters/discovery.yaml#/SearchLike"
      - $ref: "../parameters/discovery.yaml#/SearchCursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of listings.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchView"
      "400":
        description: "A malformed parameter, position_required, invalid_position, invalid_cursor, invalid_price_range, or search_conflict: photo with q or like, or sort=nearby with q, photo or like."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "listing_not_found: like names a listing that is not on sale or reserved."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "invalid_upload: photo is not a waiting upload of the caller's, or not a readable image."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "search_unavailable: the photo could not be embedded; try again."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
searchHistory:
  get:
    operationId: getSearchHistory
    summary: The caller's last 10 text searches, newest first.
    tags: [discovery]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The history.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchHistory"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
  delete:
    operationId: clearSearchHistory
    summary: Empty the caller's search history.
    tags: [discovery]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Emptied.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
searchHistoryItem:
  delete:
    operationId: deleteSearchHistoryItem
    summary: Forget one search; an unknown one is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Forgotten.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
hiddenListing:
  put:
    operationId: hideFromSearch
    summary: Leave someone else's listing out of the caller's searches, Home and the nearby feed; hiding again makes it the newest hide.
    description: The caller keeps the 1,000 newest hides; one more shows the oldest again. Saved listings, the seller page and the listing itself still show it.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Hidden.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing, or it is deleted (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: unhideFromSearch
    summary: Show a hidden listing again; a listing not hidden is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Shown again.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
savedAlert:
  put:
    operationId: setSavedAlert
    summary: Hear when the listing's price falls below a level; a listing not saved is saved first.
    description: The caller hears at each new low below the level. A price back at or above it starts over, and setting a level forgets the price last told.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/discovery.yaml#/SavedAlert"
    responses:
      "204":
        description: Set.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing), not on sale (listing_unavailable), the caller has 500 saves (saved_limit_reached), or the save went meanwhile (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: clearSavedAlert
    summary: Remove the save's own level; the save stays, and a listing not saved is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Removed.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
priceCutAlerts:
  get:
    operationId: getPriceCutAlerts
    summary: Whether a saved listing without its own level alerts below its saved price; on until set off.
    tags: [discovery]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The switch.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/PriceCutAlerts"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
  put:
    operationId: setPriceCutAlerts
    summary: Turn the switch on or off.
    tags: [discovery]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/discovery.yaml#/PriceCutAlerts"
    responses:
      "204":
        description: Set.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
