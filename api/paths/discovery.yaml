saved:
  get:
    operationId: listSaved
    summary: List the caller's saved listings, newest save first.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of saves.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SavedList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
savedListing:
  put:
    operationId: saveListing
    summary: Save someone else's listing on sale or being shipped; saving again changes nothing.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Saved.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such listing (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing), not on sale (listing_unavailable), or the caller has 500 saves (saved_limit_reached)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: unsaveListing
    summary: Forget a saved listing; an absent one is fine.
    tags: [discovery]
    security:
      - bearerAuth: []
    parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Forgotten.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
search:
  get:
    operationId: search
    summary: Search active listings; without q, browse them.
    description: |
      Three ways to search, all under the person's filters and sorts. With q a
      model reads the query; BM25 on its words, its Vietnamese rewrite against
      listing text vectors and its English description against listing photos
      are fused by weighted RRF. With photo, the photo against listing photos
      alone. With like, the listing's title, text vector and photos. Without
      any, the call browses, newest first by default, and category alone is the
      category page. A model that fails leaves the lists it feeds out; q then
      searches its raw words, with no understood and no chips.
    tags: [discovery]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: category
        in: query
        description: A root or subcategory code from GET /v1/categories.
        schema:
          type: string
      - name: price_min
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: price_max
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: condition
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: "../schemas/catalog.yaml#/Condition"
      - name: radius_km
        in: query
        description: Needs a position.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: offers_only
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        description: relevance by default with q, photo or like, newest without; other sorts order the listings the search found; nearest needs a position and bounds itself to 50 km without radius_km.
        schema:
          type: string
          enum: [relevance, newest, nearest, price_asc, price_desc]
      - name: "off"
        in: query
        description: Chip IDs to leave out; the cached understanding is reused.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - $ref: "../parameters/discovery.yaml#/NearLat"
      - $ref: "../parameters/discovery.yaml#/NearLng"
      - $ref: "../parameters/discovery.yaml#/NearCommune"
      - $ref: "../parameters/discovery.yaml#/SearchPhoto"
      - $ref: "../parameters/discovery.yaml#/SearchLike"
      - $ref: "../parameters/discovery.yaml#/SearchCursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of listings.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchView"
      "400":
        description: "A malformed parameter, position_required, invalid_position, invalid_cursor, invalid_price_range, or search_conflict: photo with q or like."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "listing_not_found: like names a listing that is not on sale or reserved."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "invalid_upload: photo is not a waiting upload of the caller's, or not a readable image."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "search_unavailable: the photo could not be embedded; try again."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
nearbyFeed:
  get:
    operationId: nearbyFeed
    summary: The "Gần bạn" feed, active listings within 50 km by distance and age.
    tags: [discovery]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/discovery.yaml#/NearLat"
      - $ref: "../parameters/discovery.yaml#/NearLng"
      - $ref: "../parameters/discovery.yaml#/NearCommune"
      - $ref: "../parameters/discovery.yaml#/SearchCursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of the feed.
        content:
          application/json:
            schema:
              $ref: "../schemas/discovery.yaml#/SearchView"
      "400":
        description: "A malformed parameter, position_required, invalid_position or invalid_cursor."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
