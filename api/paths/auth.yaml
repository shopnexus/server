signIn:
  post:
    operationId: signIn
    x-rate-limit: auth
    summary: Sign in, or sign up on first use, with a phone number Firebase verified, a Google account or an email code.
    description: |
      phone_token is what Firebase returned for the number: the ID token of
      Firebase Authentication after an SMS code, or the Phone Number
      Verification token of the SIM. google_token is the Google ID token
      Credential Manager returned; it proves the account's email, and an
      email identity with that address is the same account. email_code is
      the code sendEmailCode mailed. A token must be at most 5 minutes old.
      A repeated Idempotency-Key with a proof of the same address returns
      the first sign-in's session with a new refresh token.
    tags: [auth]
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/SignInRequest"
    responses:
      "200":
        description: Signed in.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/SignIn"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        description: A token failed a check (invalid_phone_token, invalid_google_token), or a repeated Idempotency-Key's session was signed out since (session_revoked, session_expired).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "409":
        $ref: "../responses/common.yaml#/Conflict"
      "422":
        description: The verified number is not a Vietnamese mobile number (invalid_phone), or the code is wrong (invalid_code, details.attempts_left), expired or replaced (code_expired) or out of guesses (code_locked).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: The keys that sign phone or Google tokens could not be fetched yet (unavailable); try again.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
refresh:
  post:
    operationId: refreshSession
    summary: Rotate the refresh token and get a new access token.
    description: |
      A refresh token works once. Presenting it again, or two refreshes
      racing with one token, signs the session out. A refresh for a
      suspended account signs the session out with account_suspended, and
      the same token answers account_suspended again while the suspension
      lasts; after it ends, session_revoked.
    tags: [auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/RefreshRequest"
    responses:
      "200":
        description: New tokens.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/Tokens"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
sessions:
  get:
    operationId: listSessions
    summary: List signed-in devices, newest first.
    tags: [auth]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of sessions.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/SessionList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
otherSessions:
  delete:
    operationId: deleteOtherSessions
    summary: Sign out every session of the account but the one this request was made with.
    description: |
      Needs a sign-in within the last 15 minutes. The signed-out devices'
      refresh tokens answer session_revoked, and their push tokens get no
      more pushes.
    tags: [auth]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Every other session is signed out.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "428":
        $ref: "../responses/common.yaml#/PreconditionRequired"
currentSession:
  delete:
    operationId: deleteCurrentSession
    summary: Sign out the session this request was made with.
    description: The access token keeps working until it expires, at most 15 minutes; the app discards it.
    tags: [auth]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Signed out.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
reauthenticate:
  post:
    operationId: reauthenticateSession
    x-rate-limit: auth
    summary: Prove again that the caller holds the account, for the calls that need a sign-in within 15 minutes.
    description: |
      Takes a proof as signIn does: a phone_token, a google_token or an
      email_code from sendEmailCode. The proof must name a phone number or
      an email address of the caller's account. A proof of another account,
      or of an address no account holds, is wrong_account, and no account
      is created or changed. The session's sign-in time becomes the time the
      proof was checked. The reply is a new access token that carries it;
      the refresh token stays as it was, and the tokens it refreshes carry
      the new time too. A repeated Idempotency-Key with a proof of the same
      address answers as the first request did and keeps the first
      request's sign-in time.
    tags: [auth]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/ProofRequest"
    responses:
      "200":
        description: A new access token with the new sign-in time.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/AccessToken"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        description: Not signed in (unauthenticated, invalid_token), or the session was signed out or has expired (session_revoked, session_expired).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "403":
        description: The proof names no phone number or email address of the caller's account (wrong_account), or the account is suspended (account_suspended).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: Another guess at the same code was counted at the same moment (try_again).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: A token failed a check (invalid_phone_token, invalid_google_token), the verified number is not a Vietnamese mobile number (invalid_phone), or the code is wrong (invalid_code, details.attempts_left), expired or replaced (code_expired) or out of guesses (code_locked).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: The keys that sign phone or Google tokens could not be fetched yet (unavailable); try again.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
session:
  delete:
    operationId: deleteSession
    summary: Sign one device out.
    tags: [auth]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Signed out.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/NotFound"
emailCodes:
  post:
    operationId: sendEmailCode
    x-rate-limit: code
    summary: Mail a six-digit code to sign in, or sign up on first use, with an email address.
    description: |
      The reply is the same whether or not an account holds the address.
      The code lasts 5 minutes and takes 5 guesses. Limits: one code per
      address per 45 seconds, five per address per hour, twenty per client
      address per hour.
    tags: [auth]
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/EmailCodeRequest"
    responses:
      "200":
        description: The code is on its way.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/EmailCode"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "422":
        description: The address is not valid (invalid_email).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "429":
        description: Too soon after the last code to this address (otp_too_soon), or over a limit (otp_limit); details.retry_after gives seconds.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
