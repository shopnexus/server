signIn:
  post:
    operationId: signIn
    summary: Sign in, or sign up on first use, with a phone number Firebase verified.
    description: |
      phone_token is what Firebase returned for the number: the ID token of
      Firebase Authentication after an SMS code, or the Phone Number
      Verification token of the SIM. The verification must be at most 5
      minutes old. A repeated Idempotency-Key with a token for the same
      number returns the first sign-in's session with a new refresh token.
    tags: [auth]
    parameters:
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/SignInRequest"
    responses:
      "200":
        description: Signed in.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/SignIn"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        description: The token failed a check (invalid_phone_token), or a repeated Idempotency-Key's session was signed out since (session_revoked, session_expired).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "409":
        $ref: "../responses/common.yaml#/Conflict"
      "422":
        description: The verified number is not a Vietnamese mobile number (invalid_phone).
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: The keys that sign phone tokens could not be fetched yet (unavailable); try again.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
refresh:
  post:
    operationId: refreshSession
    summary: Rotate the refresh token and get a new access token.
    description: A refresh token works once. Presenting it again, or two refreshes racing with one token, signs the session out.
    tags: [auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/RefreshRequest"
    responses:
      "200":
        description: New tokens.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/Tokens"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
logout:
  post:
    operationId: logout
    summary: Sign out the session this request was made with.
    description: The access token keeps working until it expires, at most 15 minutes; the app discards it.
    tags: [auth]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Signed out.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
logoutAll:
  post:
    operationId: logoutAll
    summary: Sign out every session of the account.
    description: Needs a sign-in within the last 15 minutes.
    tags: [auth]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Every session is signed out.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "428":
        $ref: "../responses/common.yaml#/PreconditionRequired"
sessions:
  get:
    operationId: listSessions
    summary: List signed-in devices, newest first.
    tags: [auth]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of sessions.
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/SessionList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
session:
  delete:
    operationId: deleteSession
    summary: Sign one device out.
    tags: [auth]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Signed out.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../responses/common.yaml#/NotFound"
