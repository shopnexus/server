login:
  parameters:
    - $ref: "../parameters/common.yaml#/StaffCSRF"
  post:
    operationId: staffLogin
    summary: Sign a staff member in.
    description: |
      Every call sends the email and password. The first sign-in takes up to
      three calls: one that answers password_change_required, one with
      new_password that answers totp_enrollment_required (the console then
      calls totp-enrollment), and one with the new password and a code.
      Later sign-ins send the password and a code together.

      An unknown email, a wrong password and a disabled member all get
      invalid_credentials. Each call counts toward the email's lock until the
      password proves right; a wrong code counts too. Five failures on one
      email lock it for 15 minutes, whether or not a member has the email.
      Success sets the staff_session cookie.
    tags: [staff]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/staff.yaml#/LoginRequest"
    responses:
      "200":
        description: Signed in.
        headers:
          Set-Cookie:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../schemas/staff.yaml#/Me"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "422":
        $ref: "../responses/common.yaml#/Unprocessable"
      "428":
        $ref: "../responses/common.yaml#/PreconditionRequired"
      "429":
        $ref: "../responses/common.yaml#/TooManyRequests"
loginTotpEnrollment:
  parameters:
    - $ref: "../parameters/common.yaml#/StaffCSRF"
  post:
    operationId: staffLoginTotpEnrollment
    summary: Start TOTP enrollment during the first sign-in.
    description: |
      Only a member without TOTP may call it; a second call replaces the
      secret of the first. The password counts toward the email's lock as in
      login.
    tags: [staff]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/staff.yaml#/EnrollmentRequest"
    responses:
      "200":
        description: The secret to load into an authenticator.
        content:
          application/json:
            schema:
              $ref: "../schemas/staff.yaml#/TOTPEnrollment"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "409":
        $ref: "../responses/common.yaml#/Conflict"
      "428":
        $ref: "../responses/common.yaml#/PreconditionRequired"
logout:
  parameters:
    - $ref: "../parameters/common.yaml#/StaffCSRF"
  post:
    operationId: staffLogout
    summary: Sign this session out and clear the cookie.
    tags: [staff]
    security:
      - staffAuth: []
    responses:
      "204":
        description: Signed out.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
me:
  parameters:
    - $ref: "../parameters/common.yaml#/StaffCSRF"
  get:
    operationId: getStaffMe
    summary: The signed-in staff member.
    tags: [staff]
    security:
      - staffAuth: []
    responses:
      "200":
        description: The member.
        content:
          application/json:
            schema:
              $ref: "../schemas/staff.yaml#/Me"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
mePassword:
  parameters:
    - $ref: "../parameters/common.yaml#/StaffCSRF"
  put:
    operationId: changeStaffPassword
    summary: Change the password and end every session of the member, this one included.
    tags: [staff]
    security:
      - staffAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/staff.yaml#/ChangePasswordRequest"
    responses:
      "204":
        description: Changed; the cookie is cleared and the member signs in again.
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "422":
        $ref: "../responses/common.yaml#/Unprocessable"
members:
  parameters:
    - $ref: "../parameters/common.yaml#/StaffCSRF"
  get:
    operationId: listStaffMembers
    summary: Staff members, newest first. Admins only.
    tags: [staff]
    security:
      - staffAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of members.
        content:
          application/json:
            schema:
              $ref: "../schemas/staff.yaml#/MemberList"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/StaffForbidden"
  post:
    operationId: createStaffMember
    summary: Create a moderator with a temporary password. Admins only.
    tags: [staff]
    security:
      - staffAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/staff.yaml#/CreateMemberRequest"
    responses:
      "201":
        description: Created.
        content:
          application/json:
            schema:
              $ref: "../schemas/staff.yaml#/CreatedMember"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "403":
        $ref: "../responses/common.yaml#/StaffForbidden"
      "409":
        $ref: "../responses/common.yaml#/Conflict"
memberDisable:
  parameters:
    - $ref: "../parameters/common.yaml#/StaffCSRF"
  post:
    operationId: disableStaffMember
    summary: Disable a moderator and end their sessions. Admins only.
    tags: [staff]
    security:
      - staffAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/StaffMemberID"
    responses:
      "200":
        description: The member.
        content:
          application/json:
            schema:
              $ref: "../schemas/staff.yaml#/Member"
      "403":
        $ref: "../responses/common.yaml#/StaffForbidden"
      "404":
        $ref: "../responses/common.yaml#/NotFound"
memberEnable:
  parameters:
    - $ref: "../parameters/common.yaml#/StaffCSRF"
