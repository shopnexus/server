          schema:
            $ref: "../schemas/staff.yaml#/CreateMemberRequest"
    responses:
      "201":
        description: Created.
        content:
          application/json:
            schema:
              $ref: "../schemas/staff.yaml#/CreatedMember"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "403":
        $ref: "../responses/common.yaml#/StaffForbidden"
      "409":
        $ref: "../responses/common.yaml#/Conflict"
