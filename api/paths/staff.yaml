    tags: [staff]
    security:
      - staffAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/StaffMemberID"
    responses:
      "200":
        description: The member.
        content:
          application/json:
            schema:
              $ref: "../schemas/staff.yaml#/Member"
