deals:
  post:
    operationId: openDeal
    x-uc: [UC-DEAL-02]
    summary: Open the caller's deal on a listing.
    description: |
      Returns the caller's existing deal on the listing, or starts one.
      Checks, in order: the caller's deal exists (200); the listing exists;
      account_suspended; own_listing; listing_unavailable. A new deal opens
      the conversation of the buyer and the seller, or reuses the pair's,
      and names it in conversation_id. The conversation shows in the inbox
      once it has a message.
    tags: [deal]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/deal.yaml#/DealOpen"
    responses:
      "200":
        description: The caller's existing deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "201":
        description: A new deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended), has no phone to sign in with (phone_required), or a block stands between the buyer and the seller (blocked)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such listing (listing_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The listing is the caller's (own_listing) or not on sale (listing_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
deal:
  get:
    operationId: getDeal
    summary: Read a deal, as its buyer or its seller.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such deal of the caller's (deal_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
dealOffer:
  post:
    operationId: offerDeal
    x-uc: [UC-DEAL-02]
    summary: Make an offer, or a counter to the buyer's offer.
    description: |
      The buyer offers; the seller counters the buyer's open offer. The
      amount must lie inside the deal's offer_range. A buyer's offer is
      refused while the seller is in away mode.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/deal.yaml#/Offer"
    responses:
      "200":
        description: The deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such deal of the caller's (deal_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The deal's state or the caller's side does not allow an offer (move_not_allowed), the listing is not on sale (listing_unavailable), the buyer offers while the seller is in away mode (seller_away), or the other side moved first (deal_changed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The amount is not a multiple of 1,000 or is outside the offer range (invalid_amount; field amount: step or out_of_range)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
dealAccept:
  post:
    operationId: acceptDeal
    x-uc: [UC-DEAL-02]
    summary: Agree the deal at a price.
    description: |
      The side facing an open price accepts it. The buyer takes the
      listed price by asking for COD at it (POST /v1/deals/{id}/cod). The
      buyer's accept is refused while the seller is in away mode.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/deal.yaml#/Accept"
    responses:
      "200":
        description: The deal, agreed.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such deal of the caller's (deal_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "Nothing to accept (move_not_allowed), the listing is not on sale (listing_unavailable), the buyer accepts while the seller is in away mode (seller_away), the price has changed (price_changed), or the other side moved first (deal_changed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
dealDecline:
  post:
    operationId: declineDeal
    x-uc: [UC-DEAL-02]
    summary: Turn down the other side's open price.
    description: |
      Works in any state of the listing and for a suspended account.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such deal of the caller's (deal_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "No open price of the other side (move_not_allowed), or the other side moved first (deal_changed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
dealWithdraw:
  post:
    operationId: withdrawDeal
    x-uc: [UC-DEAL-02]
    summary: Take back the caller's own open price.
    description: |
      Works in any state of the listing and for a suspended account.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such deal of the caller's (deal_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "No open price of the caller's (move_not_allowed), or the other side moved first (deal_changed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
dealCancel:
  post:
    operationId: cancelDeal
    x-uc: [UC-DEAL-02, UC-DEAL-06]
    summary: Drop the agreed price, and a pending order with it; the deal negotiates again.
    description: |
      Works in any state of the listing and for a suspended account.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such deal of the caller's (deal_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The deal is not agreed (move_not_allowed), or the other side moved first (deal_changed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
myDeals:
  get:
    operationId: listMyDeals
    summary: List the caller's deals on one side, newest first.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: role
        in: query
        required: true
        description: buying lists the deals where the caller is the buyer; selling, the seller.
        schema:
          type: string
          enum: [buying, selling]
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of deals.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/DealList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
dealCod:
  post:
    operationId: requestCod
    x-uc: [UC-DEAL-03]
    summary: Order the listing with cash on delivery, at the price the buyer saw.
    description: |
      Mua ngay. On an agreed deal the price is the agreed one. On a deal
      still negotiating it is the listed price or the seller's open
      counter, and the order agrees the deal at it in the same save, with
      no accept move; a lower price is an offer (POST
      /v1/deals/{id}/offer). The buyer of a deal with no open order, on a
      listing on sale, with fewer than 3 open orders, to one of the
      buyer's addresses, while the seller is not in away mode. The order
      keeps a copy of the address as its recipient. It starts
      pending; either side may cancel it until the seller creates the
      shipment, and it is cancelled with seller_timeout when the seller has
      created none 3 days later. A repeated Idempotency-Key of the caller
      runs nothing more: it answers the first request's refusal, or the
      deal as it is now.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/IdempotencyKeyOptional"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/deal.yaml#/CodRequest"
    responses:
      "200":
        description: The deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such deal of the caller's (deal_not_found), or no such address of the caller's (address_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The deal is sold or has an open order, or the caller is the seller (move_not_allowed); the price is not the one on offer (price_changed); the listing is not on sale (listing_unavailable); the saved pickup is absent (pickup_not_configured); the seller is in away mode (seller_away); the buyer has 3 open orders (cod_limit_reached); or the deal changed meanwhile (deal_changed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
orderShipment:
  post:
    operationId: createShipment
    x-uc: [UC-DEAL-04]
    summary: Create the shipment of a pending order.
    description: |
      The seller, in one commit. manual: the seller made the shipment on
      the carrier's own app and types its code; the server reads it with
      the seller's account at that carrier. linked: the server makes it on
      the seller's account at the carrier asked, GHTK or GHN, picked up
      where pickup_from says. A saved_pickup selection is resolved and
      journaled after the seller and order checks. A retry with the same
      caller and Idempotency-Key recovers that invocation even if the saved
      preference or address has since been removed. The order is shipped,
      the listing is reserved for it, and
      other buyers' pending orders on the listing are cancelled with
      shipped_to_another. A parcel the carrier reports delivered ships
      delivered. Checks, in order: the shipment's fields, for a manual one
      the carrier's answer, then the order is the caller's, the order's
      state, the listing, and for a linked one the carrier's answer. A
      carrier the caller has not linked is 409 carrier_not_linked, once the
      order is found to be the caller's to ship. A stack
      without a carrier (CARRIER=none, production for now) answers 503
      carrier_unavailable.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/deal.yaml#/ShipmentDraft"
    responses:
      "200":
        description: The order's deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such order of the caller's (order_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The order is not the deal's pending one, or the caller is the buyer (move_not_allowed); the listing is not on sale (listing_unavailable); the deal changed meanwhile (deal_changed); or the caller has not linked that carrier, or must link it again because its token no longer opens (carrier_not_linked, carrier_relink_needed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The shipment breaks a rule, the carrier's report of a failed parcel included (invalid_shipment, with fields); the carrier does not know the tracking code (shipment_not_found); the carrier does not know the recipient's or the pickup's address (carrier_address_unknown); or the carrier refused the shipment, its words in details.reason (carrier_refused)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "The stack has no carrier, CARRIER=none (carrier_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  put:
    operationId: editShipment
    x-uc: [UC-DEAL-04]
    summary: Correct the carrier and tracking code of a manual shipment.
    description: |
      The seller, while the shipment is pending_pickup or in_transit. The
      server reads the new code with the seller's account at that carrier,
      as on creation, and takes its status. Checks, in order: the carrier and the code, the
      carrier's answer, then the order is the caller's and its state.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/deal.yaml#/TrackingCode"
    responses:
      "200":
        description: The order's deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such order of the caller's (order_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The order is not shipped, its shipment is linked or no longer pending_pickup or in_transit, or the caller is the buyer (move_not_allowed); the deal changed meanwhile (deal_changed); or the caller has not linked that carrier, or must link it again because its token no longer opens (carrier_not_linked, carrier_relink_needed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The carrier or the code breaks a rule, the carrier's report of a failed parcel included (invalid_shipment, with fields), or the carrier does not know the tracking code (shipment_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "The stack has no carrier, CARRIER=none (carrier_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
orderConfirm:
  post:
    operationId: confirmReceipt
    x-uc: [UC-DEAL-05]
    summary: Confirm receipt of a shipped order.
    description: |
      The buyer, at any time while the order is shipped, whatever the
      carrier reports. The order is completed, the deal sold and the
      listing sold.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/IdempotencyKey"
    responses:
      "200":
        description: The order's deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such order of the caller's (order_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The order is not the deal's shipped one, or the caller is the seller (move_not_allowed); or the deal changed meanwhile (deal_changed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
shipmentLookup:
  get:
    operationId: lookupShipment
    x-uc: [UC-DEAL-04]
    summary: Read a shipment from its carrier, for the seller's preview.
    description: |
      Before the seller confirms a manual shipment or a corrected code.
      The code is read with the caller's own account at that carrier. The
      app warns, and does not block, when cod_amount differs from the
      agreed price.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: carrier
        in: query
        required: true
        description: ghtk, ghn, spx, jt or viettel_post; another value is 422 invalid_shipment.
        schema:
          type: string
      - name: code
        in: query
        required: true
        description: The tracking code, 1 to 50 characters once trimmed.
        schema:
          type: string
    responses:
      "200":
        description: The shipment as its carrier reads it.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/ShipmentPreview"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "The carrier does not know the tracking code (shipment_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The carrier or the code breaks a rule (invalid_shipment, with fields)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The caller has not linked that carrier, or must link it again (carrier_not_linked, carrier_relink_needed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "503":
        description: "The stack has no carrier, CARRIER=none (carrier_unavailable)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
orderCancel:
  post:
    operationId: cancelOrder
    x-uc: [UC-DEAL-06]
    summary: Cancel this pending order; the deal negotiates again.
    description: |
      The selected order must still be the deal's current pending order.
      Either party may cancel, including a suspended caller. The response is
      the canonical Deal, as returned by the other order mutations. A
      repeated Idempotency-Key of the caller runs nothing more: it answers
      the first request's refusal, or the deal as it is now.
    tags: [deal]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/IdempotencyKeyOptional"
    responses:
      "200":
        description: The deal.
        content:
          application/json:
            schema:
              $ref: "../schemas/deal.yaml#/Deal"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such order of the caller's (order_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The order is historical or not pending (move_not_allowed), or the other side moved first (deal_changed)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
