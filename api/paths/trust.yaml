review:
  put:
    operationId: putReview
    x-uc: [UC-TRS-01]
    summary: Review the other party to an order, or edit the review.
    description: |
      The buyer reviews the seller (role seller) and the seller the buyer
      (role buyer). A first review needs the order completed or failed,
      but not with a parcel the carrier lost. It
      stays hidden from the other party and the public until they review
      too or 7 days after the order closed. A review changes, and a deleted
      one is posted again, only while it is hidden, within 7 days of its
      first submission; once it shows, neither side changes it.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/trust.yaml#/ReviewDraft"
    responses:
      "200":
        description: The review.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/Review"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such order of the caller's (order_not_found), or, on delete, no review of it (review_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The order is not completed or failed yet, or the carrier lost its parcel (order_not_delivered), the review shows or 7 days have passed since the first submission (review_locked), the other party replied (review_closed), or another write of the review came first (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "Stars, text or tags break a rule (invalid_review, with fields), or a photo is not one the caller may use (invalid_upload)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: deleteReview
    x-uc: [UC-TRS-01]
    summary: Delete the caller's review of an order within its 7 days.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Deleted.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such order of the caller's (order_not_found), or, on delete, no review of it (review_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "the review shows or 7 days have passed since the first submission (review_locked), the other party replied (review_closed), or another write of the review came first (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
sellerReviews:
  get:
    operationId: listSellerReviews
    x-uc: [UC-DSC-04]
    summary: A seller's visible reviews, newest first; the same as /v1/accounts/{id}/reviews?role=seller.
    description: A signed-in reader gets helpful.marked on each review they may mark.
    tags: [trust]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of reviews.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/ReviewList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "404":
        description: "No such account (account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
accountReviews:
  get:
    operationId: listAccountReviews
    x-uc: [UC-DSC-04]
    summary: A person's visible reviews in one role, newest first.
    description: A signed-in reader gets helpful.marked on each review they may mark.
    tags: [trust]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: query
        required: false
        schema:
          $ref: "../schemas/trust.yaml#/ReviewRole"
          default: seller
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of reviews.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/ReviewList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "404":
        description: "No such account (account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
reviewReply:
  post:
    operationId: replyReview
    x-uc: [UC-TRS-01]
    summary: The reviewed person's one reply, which closes the review.
    description: |
      Only the subject replies, once, to a review they can see. After it the
      reviewer can no longer edit or delete the review.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/trust.yaml#/ReplyDraft"
    responses:
      "200":
        description: The review with its reply.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/Review"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such review of the caller, or it was deleted (review_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The review is still hidden (review_hidden), it has a reply (review_replied), or another write came first (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "The text is empty or too long (invalid_review, with fields)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
reviewHelpful:
  put:
    operationId: markReviewHelpful
    x-uc: [UC-TRS-05]
    summary: Mark a visible review helpful; marking it again changes nothing.
    description: |
      Anyone signed in but the review's reviewer and its subject. The count
      shows in Review.helpful.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Marked.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such visible review (review_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The caller wrote the review or is its subject (own_review)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: unmarkReviewHelpful
    x-uc: [UC-TRS-05]
    summary: Take back the caller's helpful mark; an absent one is fine.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Not marked.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
reports:
  get:
    operationId: listMyReports
    x-uc: [UC-MOD-01]
    summary: List the caller's reports, newest first.
    description: |
      Every report the caller made, withdrawn and resolved ones included,
      paged by report ID. DELETE /v1/reports/{id} withdraws an open one.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of reports.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/ReportList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
  post:
    operationId: createReport
    x-uc: [UC-MOD-01]
    summary: Report a listing or an account.
    description: |
      Exactly one of listing_id and account_id. A report of a listing is
      also about its seller, whom account_id names in the answer. The
      caller has one open report per target: reporting it again replaces
      the reason and note and answers 200.
    tags: [trust]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/trust.yaml#/ReportCreate"
    responses:
      "200":
        description: The open report of the target, with the new reason and note.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/Report"
      "201":
        description: The report, opened.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/Report"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "404":
        description: "No such listing, or a deleted one (listing_not_found), or no such account (account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "A rule is broken (invalid_report, with fields), conversation_id included: it goes with account_id only and must be the caller's conversation with that account. Or the caller named themselves or their own listing (self_report)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "ShopNexus cannot be reported (account_is_system)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
report:
  delete:
    operationId: withdrawReport
    x-uc: [UC-MOD-01]
    summary: Withdraw one of the caller's reports; a withdrawn one is fine.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Withdrawn.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such report of the caller's (report_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
scamWarningDismiss:
  post:
    operationId: dismissScamWarning
    summary: Dismiss the caller's scam warning in a conversation.
    description: |
      The warning stays in the inbox with dismissed true, and Chat hides its
      banner, until a check finds a message code it did not have. Without a
      warning, or dismissed already, nothing changes. A member who blocks
      the other may dismiss.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Dismissed, or nothing to dismiss.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation of the caller's (conversation_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
