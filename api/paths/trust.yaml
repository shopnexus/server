review:
  put:
    operationId: putReview
    summary: Review the seller of an order the caller bought, or edit the review.
    description: |
      The order is shipped, completed or failed. A review changes, and a
      deleted one is posted again, only within 7 days of its first
      submission.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/trust.yaml#/ReviewDraft"
    responses:
      "200":
        description: The review.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/Review"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        description: "The account is suspended (account_suspended)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "404":
        description: "No such order of the caller's (order_not_found), or, on delete, no review of it (review_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "The order is not shipped yet (order_not_shipped), 7 days have passed since the first submission (review_locked), or another write of the review came first (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "Stars or text break a rule (invalid_review, with fields)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
  delete:
    operationId: deleteReview
    summary: Delete the caller's review of an order within its 7 days.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Deleted.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such order of the caller's (order_not_found), or, on delete, no review of it (review_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "409":
        description: "7 days have passed since the first submission (review_locked), or another write of the review came first (try_again)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
sellerReviews:
  get:
    operationId: listSellerReviews
    summary: A seller's reviews, newest first.
    tags: [trust]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "../parameters/common.yaml#/Cursor"
      - $ref: "../parameters/common.yaml#/Limit"
    responses:
      "200":
        description: One page of reviews.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/ReviewList"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "404":
        description: "No such account (account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
reports:
  post:
    operationId: createReport
    summary: Report a listing or an account.
    description: |
      Exactly one of listing_id and account_id. A report of a listing is
      also about its seller, whom account_id names in the answer. The
      caller has one open report per target: reporting it again replaces
      the reason and note and answers 200.
    tags: [trust]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/trust.yaml#/ReportCreate"
    responses:
      "200":
        description: The open report of the target, with the new reason and note.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/Report"
      "201":
        description: The report, opened.
        content:
          application/json:
            schema:
              $ref: "../schemas/trust.yaml#/Report"
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../responses/common.yaml#/Forbidden"
      "404":
        description: "No such listing, or a deleted one (listing_not_found), or no such account (account_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "422":
        description: "A rule is broken (invalid_report, with fields), conversation_id included: it goes with account_id only and must be the caller's conversation with that account. Or the caller named themselves or their own listing (self_report)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
report:
  delete:
    operationId: withdrawReport
    summary: Withdraw one of the caller's reports; a withdrawn one is fine.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Withdrawn.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such report of the caller's (report_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
scamWarningDismiss:
  post:
    operationId: dismissScamWarning
    summary: Dismiss the caller's scam warning in a conversation.
    description: |
      The warning stays in the inbox with dismissed true, and Chat hides its
      banner, until a check finds a message code it did not have. Without a
      warning, or dismissed already, nothing changes. A member who blocks
      the other may dismiss.
    tags: [trust]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Dismissed, or nothing to dismiss.
      "400":
        $ref: "../responses/common.yaml#/BadRequest"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
      "404":
        description: "No such conversation of the caller's (conversation_not_found)."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
