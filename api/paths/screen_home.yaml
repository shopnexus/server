screenHome:
  get:
    operationId: getHomeScreen
    summary: The Home view, the category tree with counts and the first page of the nearby feed.
    description: |
      nearby is the first page of GET /v1/search with sort=nearby and the
      same position and radius_km; its next_cursor pages on there. Without
      radius_km the feed keeps within 50 km. Without a position nearby has
      no items, and the app asks for a position to fill it.
    tags: [screen]
    security:
      - {}
      - bearerAuth: []
    parameters:
      - $ref: "../parameters/discovery.yaml#/NearLat"
      - $ref: "../parameters/discovery.yaml#/NearLng"
      - $ref: "../parameters/discovery.yaml#/NearCommune"
      - $ref: "../parameters/discovery.yaml#/RadiusKm"
    responses:
      "200":
        description: The Home view.
        content:
          application/json:
            schema:
              $ref: "../schemas/screen_home.yaml#/HomeScreen"
      "400":
        description: "A malformed parameter, invalid_position, or position_required: radius_km without a position."
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/Error"
      "401":
        $ref: "../responses/common.yaml#/Unauthorized"
