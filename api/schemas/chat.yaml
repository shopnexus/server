ConversationOpen:
  type: object
  additionalProperties: false
  required: [listing_id]
  properties:
    listing_id:
      type: string
      format: uuid
      description: Someone else's active listing; the first message names it.
    text:
      type: string
      description: 1 to 1,000 characters after trimming, unless photos are sent.
    photos:
      type: array
      items:
        type: string
        format: uuid
      description: Up to 4 upload IDs of the caller's.
MessageDraft:
  type: object
  additionalProperties: false
  properties:
    text:
      type: string
      description: 1 to 1,000 characters after trimming, unless photos are sent.
    photos:
      type: array
      items:
        type: string
        format: uuid
      description: Up to 4 upload IDs of the caller's.
    listing_id:
      type: string
      format: uuid
      description: A listing of either member the message is about.
ReadMark:
  type: object
  additionalProperties: false
  required: [message_id]
  properties:
    message_id:
      type: string
      format: uuid
Person:
  type: object
  additionalProperties: false
  required: [id, display_name]
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
MessagePhoto:
  type: object
  additionalProperties: false
  required: [upload_id]
  properties:
    upload_id:
      type: string
      format: uuid
    url:
      type: string
      format: uri
      description: Set once the photo is processed.
    thumb_url:
      type: string
      format: uri
Message:
  type: object
  additionalProperties: false
  required: [id, sender_id, text, photos, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    sender_id:
      type: string
      format: uuid
    text:
      type: string
    photos:
      type: array
      items:
        $ref: "#/MessagePhoto"
    listing_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [processing, sent, failed]
      description: Only the sender sees a processing or failed message.
    failure:
      type: string
      description: Why media refused a photo, on a failed message.
    created_at:
      type: string
      format: date-time
Conversation:
  type: object
  additionalProperties: false
  required: [id, other, deals, archived]
  properties:
    id:
      type: string
      format: uuid
    other:
      $ref: "#/Person"
    deals:
      type: array
      description: The deals of the two people on either side, newest first, as the caller sees them.
      items:
        $ref: "deal.yaml#/Deal"
    archived:
      type: boolean
InboxItem:
  type: object
  additionalProperties: false
  required: [id, other, last_message, unread, archived]
  properties:
    id:
      type: string
      format: uuid
    other:
      $ref: "#/Person"
    last_message:
      $ref: "#/Message"
    unread:
      type: integer
    archived:
      type: boolean
ConversationList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/InboxItem"
    next_cursor:
      type: string
      format: uuid
      description: Present when more conversations follow; pass it as cursor.
MessageList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Message"
    next_cursor:
      type: string
      format: uuid
      description: Present when more messages follow; pass it as cursor.
Unread:
  type: object
  additionalProperties: false
  required: [unread]
  properties:
    unread:
      type: integer
