ConversationOpen:
  type: object
  additionalProperties: false
  required: [listing_id]
  properties:
    listing_id:
      type: string
      format: uuid
      description: Someone else's active listing; the first message names it.
    text:
      type: string
      description: 1 to 1,000 characters after trimming, unless photos are sent.
    photos:
      type: array
      items:
        type: string
        format: uuid
      description: Up to 4 upload IDs of the caller's.
MessageDraft:
  type: object
  additionalProperties: false
  properties:
    text:
      type: string
      description: 1 to 1,000 characters after trimming, unless photos are sent.
    photos:
      type: array
      items:
        type: string
        format: uuid
      description: Up to 4 upload IDs of the caller's.
    listing_id:
      type: string
      format: uuid
      description: A listing of either member the message is about.
    reply_to:
      type: string
      format: uuid
      description: |
        A sent message of the same conversation the message quotes. A deal
        message cannot be quoted. Anything else is invalid_message with
        field reply_to.
ReadMark:
  type: object
  additionalProperties: false
  required: [message_id]
  properties:
    message_id:
      type: string
      format: uuid
Person:
  type: object
  additionalProperties: false
  required: [id, display_name, deleted]
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
    avatar_url:
      type: string
      format: uri
      description: A public 400 px square; absent without an avatar.
    last_active_at:
      type: string
      format: date-time
      description: |
        When the person last had the app open, to the 30 seconds; absent
        before the first time. The app shows "Đang hoạt động" under 5
        minutes, otherwise how long ago.
    deleted:
      type: boolean
      description: The person deleted their account; display_name is empty and there is no avatar.
    official:
      type: boolean
      description: ShopNexus itself, the other side of every support chat.
    away_until:
      type: string
      format: date-time
      description: |
        When the person's away mode (tạm nghỉ) ends; absent when they are
        not away. Until then a buyer's offer, accept or COD request on
        their listings answers 409 seller_away.
MessagePhoto:
  type: object
  additionalProperties: false
  required: [upload_id]
  properties:
    upload_id:
      type: string
      format: uuid
    url:
      type: string
      format: uri
      description: Set once the photo is processed.
    thumb_url:
      type: string
      format: uri
Message:
  type: object
  additionalProperties: false
  required: [id, sender_id, text, photos, status, created_at]
  description: |
    A message a member wrote, or a deal message the server wrote for a move
    on a deal of the two. A deal message has deal, an empty text and no
    photos, and nobody can send one.
  properties:
    id:
      type: string
      format: uuid
    sender_id:
      type: string
      format: uuid
      description: |
        The member who wrote the message or made the move. A deal message
        for a move by the system (a carrier's report, a timer) has the ID of
        ShopNexus, so it counts as unread for both members.
    text:
      type: string
    photos:
      type: array
      items:
        $ref: "#/MessagePhoto"
    listing_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [processing, sent, failed]
      description: Only the sender sees a processing or failed message.
    failure:
      type: string
      description: Why media refused a photo, on a failed message.
    reply_to:
      $ref: "#/Quote"
    deal:
      $ref: "#/MessageDeal"
    refs:
      type: array
      maxItems: 5
      description: |
        The ShopNexus links in text, as cards to draw in place of the URL:
        a listing, a person, an order, a category or a search on the
        website, or a shopnexus:// link of the app. A link to something
        gone, hidden, or an order the reader is not a side of, has none and
        stays text.
      items:
        $ref: "#/MessageRef"
    created_at:
      type: string
      format: date-time
MessageRef:
  type: object
  additionalProperties: false
  required: [url, kind]
  description: A link in a message and what it points at; the field of its kind is set.
  properties:
    url:
      type: string
      description: The link exactly as it is written in the message's text.
    kind:
      type: string
      enum: [listing, seller, order, category, search]
    listing:
      type: object
      additionalProperties: false
      required: [id, slug, title, price, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: "catalog.yaml#/ListingSlug"
        title:
          type: string
        price:
          type: integer
          format: int64
        status:
          $ref: "catalog.yaml#/ListingStatus"
        thumb_url:
          type: string
    seller:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar_url:
          type: string
    order:
      type: object
      additionalProperties: false
      required: [id, code, status, price, title]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          $ref: "deal.yaml#/OrderStatus"
        price:
          type: integer
          format: int64
        title:
          type: string
        thumb_url:
          type: string
    category:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    search:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
MessageDeal:
  type: object
  additionalProperties: false
  required: [deal_id, move]
  description: |
    The move a deal message is about. Every move a person makes on a deal
    writes one, and so does every order step, whoever made it. A change of
    the listing (price_changed, offers_closed, listing_closed) writes none.
  properties:
    deal_id:
      type: string
      format: uuid
    move:
      $ref: "deal.yaml#/Move"
Conversation:
  type: object
  additionalProperties: false
  required: [id, other, archived]
  properties:
    id:
      type: string
      format: uuid
    other:
      $ref: "#/Person"
    archived:
      type: boolean
    other_read_message_id:
      type: string
      format: uuid
      description: |
        The newest message the other member has read, for "Đã xem" under the
        caller's messages up to it. Absent while they have read nothing.
MessageList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Message"
    next_cursor:
      type: string
      format: uuid
      description: Present when more messages follow; pass it as cursor.
Unread:
  type: object
  additionalProperties: false
  required: [unread, notifications, offers]
  properties:
    unread:
      type: integer
      description: Unread messages over the caller's unarchived pair conversations.
    notifications:
      type: integer
      description: The caller's unread notices.
    offers:
      type: integer
      description: The buyers' open offers waiting on the caller as seller, as GET /v1/screens/offers lists them.
Quote:
  type: object
  additionalProperties: false
  required: [id, sender_id, text, photos]
  description: The message a reply quotes, as it reads now.
  properties:
    id:
      type: string
      format: uuid
    sender_id:
      type: string
      format: uuid
    text:
      type: string
      description: The first 200 characters.
    photos:
      type: integer
QuickReplies:
  type: object
  additionalProperties: false
  required: [items]
  description: |
    The caller's saved chat answers, in their order, which a composer
    offers to put in the field. An account that never saved any reads
    three defaults.
  properties:
    items:
      type: array
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 200
        pattern: "\\S"
        description: An answer, with something besides spaces; the server trims it.
