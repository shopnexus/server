Account:
  type: object
  additionalProperties: false
  required: [id, display_name, bio, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
      description: Empty until the person completes their profile.
    bio:
      type: string
      description: Public; may be empty.
    avatar_url:
      type: string
      format: uri
      description: A public 400 px square; absent without an avatar.
    status:
      type: string
      enum: [active, suspended]
    created_at:
      type: string
      format: date-time
AccountUpdate:
  type: object
  additionalProperties: false
  minProperties: 1
  description: |
    The fields to change; at least one. The text rules are business rules:
    breaking one answers 422 invalid_account with an entry per field.
  properties:
    display_name:
      type: string
      description: 1 to 50 characters after trimming.
    bio:
      type: string
      description: At most 200 characters after trimming; may be empty.
    avatar_upload_id:
      type: [string, "null"]
      format: uuid
      description: |
        An upload of the caller's, which becomes the avatar once processed
        into a square; null removes the avatar.
BlockCreate:
  type: object
  additionalProperties: false
  required: [account_id]
  properties:
    account_id:
      type: string
      format: uuid
Block:
  type: object
  additionalProperties: false
  required: [id, account_id, display_name, at]
  description: An account the caller blocks. Neither may message the other, open a conversation with them or open a deal on their listings.
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    display_name:
      type: string
    at:
      type: string
      format: date-time
BlockList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Block"
    next_cursor:
      type: string
      format: uuid
      description: Present when more blocks follow; pass it as cursor.
