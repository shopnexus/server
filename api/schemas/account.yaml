Account:
  type: object
  additionalProperties: false
  required: [id, display_name, bio, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
      description: Empty until the person completes their profile.
    bio:
      type: string
      description: Public; may be empty.
    avatar_url:
      type: string
      format: uri
      description: A public 400 px square; absent without an avatar.
    status:
      type: string
      enum: [active, suspended, deleted]
      description: deleted is an account its person deleted; its name and bio are empty and it has no avatar.
    created_at:
      type: string
      format: date-time
MyAccount:
  type: object
  additionalProperties: false
  required: [id, display_name, bio, status, created_at, identities]
  description: The caller's own account, with how it signs in.
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
      description: Empty until the person completes their profile.
    bio:
      type: string
      description: Public; may be empty.
    avatar_url:
      type: string
      format: uri
      description: A public 400 px square; absent without an avatar.
    status:
      type: string
      enum: [active, suspended]
    created_at:
      type: string
      format: date-time
    identities:
      type: array
      minItems: 1
      maxItems: 2
      items:
        $ref: "#/Identity"
      description: How the account signs in. Posting, opening a deal and opening a chat need a phone.
Identity:
  type: object
  additionalProperties: false
  required: [kind, value]
  properties:
    kind:
      type: string
      enum: [phone, email]
    value:
      type: string
      description: The number in the +84 form, or the address lower-cased.
Identities:
  type: object
  additionalProperties: false
  required: [identities]
  properties:
    identities:
      type: array
      items:
        $ref: "#/Identity"
AddIdentityRequest:
  type: object
  additionalProperties: false
  description: Exactly one proof, of the kind the account lacks.
  oneOf:
    - required: [phone_token]
    - required: [google_token]
    - required: [email_code]
  properties:
    phone_token:
      type: string
      minLength: 1
      maxLength: 8192
    google_token:
      type: string
      minLength: 1
      maxLength: 8192
    email_code:
      $ref: "auth.yaml#/EmailCodeProof"
AccountUpdate:
  type: object
  additionalProperties: false
  minProperties: 1
  description: |
    The fields to change; at least one. The text rules are business rules:
    breaking one answers 422 invalid_account with an entry per field.
  properties:
    display_name:
      type: string
      description: 1 to 50 characters after trimming.
    bio:
      type: string
      description: At most 200 characters after trimming; may be empty.
    avatar_upload_id:
      type: [string, "null"]
      format: uuid
      description: |
        An upload of the caller's, which becomes the avatar once processed
        into a square; null removes the avatar.
BlockCreate:
  type: object
  additionalProperties: false
  required: [account_id]
  properties:
    account_id:
      type: string
      format: uuid
Block:
  type: object
  additionalProperties: false
  required: [id, account_id, display_name, at]
  description: An account the caller blocks. Neither may message the other, open a conversation with them or open a deal on their listings.
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    display_name:
      type: string
    at:
      type: string
      format: date-time
BlockList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Block"
    next_cursor:
      type: string
      format: uuid
      description: Present when more blocks follow; pass it as cursor.
FollowCreate:
  type: object
  additionalProperties: false
  required: [account_id]
  properties:
    account_id:
      type: string
      format: uuid
Follow:
  type: object
  additionalProperties: false
  required: [id, account_id, display_name, at]
  description: An account the caller follows.
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    display_name:
      type: string
    avatar_url:
      type: string
      format: uri
      description: A public 400 px square; absent without an avatar.
    at:
      type: string
      format: date-time
FollowList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Follow"
    next_cursor:
      type: string
      format: uuid
      description: Present when more follows follow; pass it as cursor.
