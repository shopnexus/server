Account:
  type: object
  additionalProperties: false
  required: [id, display_name, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
      description: Empty until the person completes their profile.
    status:
      type: string
      enum: [active, suspended]
    created_at:
      type: string
      format: date-time
AccountUpdate:
  type: object
  additionalProperties: false
  required: [display_name]
  properties:
    display_name:
      type: string
      minLength: 1
      maxLength: 50
