Account:
  type: object
  additionalProperties: false
  required: [id, display_name, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
      description: Empty until the person completes their profile.
    status:
      type: string
      enum: [active, suspended]
    created_at:
      type: string
      format: date-time
AccountUpdate:
  type: object
  additionalProperties: false
  required: [display_name]
  properties:
    display_name:
      type: string
      minLength: 1
      maxLength: 50
BlockCreate:
  type: object
  additionalProperties: false
  required: [account_id]
  properties:
    account_id:
      type: string
      format: uuid
Block:
  type: object
  additionalProperties: false
  required: [id, account_id, display_name, at]
  description: An account the caller blocks. Neither may message the other, open a conversation with them or open a deal on their listings.
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    display_name:
      type: string
    at:
      type: string
      format: date-time
BlockList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Block"
    next_cursor:
      type: string
      format: uuid
      description: Present when more blocks follow; pass it as cursor.
