OrderScreen:
  type: object
  additionalProperties: false
  required: [order, deal, counterpart, own_review, their_review]
  description: The selected order and its current deal, with the caller's review of the other party and theirs of the caller. The ticket is the buyer's only and absent for a seller.
  properties:
    order:
      $ref: "deal.yaml#/Order"
    deal:
      $ref: "deal.yaml#/Deal"
    counterpart:
      $ref: "chat.yaml#/Person"
    own_review:
      $ref: "trust.yaml#/OwnReview"
    their_review:
      description: The other party's review of the caller; null when they have not reviewed or deleted it.
      anyOf:
        - $ref: "trust.yaml#/TheirReview"
        - type: "null"
    ticket:
      anyOf:
        - $ref: "support.yaml#/Ticket"
        - type: "null"
    tracking:
      $ref: "shipping.yaml#/Tracking"
      description: The shipment's timeline; absent until its carrier reports something. The buyer gets the steps only.
OrdersScreen:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/OrdersScreenItem"
    next_cursor:
      type: string
      format: uuid
      description: Present when more orders follow; pass it as cursor.
    cod_orders:
      $ref: "screen_account.yaml#/Cap"
      description: Buying only. The caller's pending and shipped orders against the open COD order cap, as the checkout reads it. Absent for selling.
    awaiting_shipment:
      type: integer
      minimum: 0
      description: Selling only. The caller's pending orders, which wait for the caller to create the shipment. Absent for buying.
OrdersScreenItem:
  type: object
  additionalProperties: false
  required: [order, counterpart, own_review]
  description: An order with the other party and the caller's review of them.
  properties:
    order:
      $ref: "deal.yaml#/OrderItem"
    counterpart:
      $ref: "chat.yaml#/Person"
    own_review:
      $ref: "trust.yaml#/OwnReview"
CodSetupScreen:
  type: object
  additionalProperties: false
  required: [account, addresses, settings, carrier_accounts]
  properties:
    account:
      $ref: "account.yaml#/MyAccount"
    addresses:
      type: array
      items:
        $ref: "address.yaml#/Address"
    settings:
      $ref: "shipping.yaml#/ShippingSettings"
    carrier_accounts:
      $ref: "shipping.yaml#/CarrierAccountList"
CodCheckoutScreen:
  type: object
  additionalProperties: false
  required: [deal, seller, address, cod_orders, shipping_estimate]
  description: Buyer-only checkout. This read writes nothing and calls no carrier.
  properties:
    deal:
      $ref: "deal.yaml#/Deal"
    seller:
      $ref: "chat.yaml#/Person"
    address:
      anyOf:
        - $ref: "address.yaml#/Address"
        - type: "null"
    cod_orders:
      $ref: "screen_account.yaml#/Cap"
    shipping_estimate:
      description: Null on every call until the server has a pre-order estimator; the field is there for it.
      anyOf:
        - type: object
          additionalProperties: false
          required: [low, high]
          properties:
            low:
              type: integer
              format: int64
              minimum: 0
            high:
              type: integer
              format: int64
              minimum: 0
        - type: "null"
