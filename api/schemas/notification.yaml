Target:
  type: object
  additionalProperties: false
  required: [kind, id]
  description: The screen a notice opens.
  properties:
    kind:
      type: string
      enum: [deal, order, listing, seller_reviews, account, search_watch]
    id:
      type: string
      description: The deal, listing, seller or search watch; empty for the account.
Notification:
  type: object
  additionalProperties: false
  required: [id, type, text, target, unread, at]
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
      enum: [offer, counter, agreed, declined, agreement_cancelled, offer_voided, cod_requested, shipped, completed,
        failed, order_cancelled, listing_live, listing_rejected, followed_listing, review, suspended, unsuspended,
        watch_matched, price_dropped]
    text:
      type: string
      description: What the notice says, in Vietnamese.
    target:
      $ref: "#/Target"
    unread:
      type: boolean
    at:
      type: string
      format: date-time
      description: When it last changed; a newer move on the same deal moves an unread notice up.
NotificationList:
  type: object
  additionalProperties: false
  required: [items, unread]
  properties:
    items:
      type: array
      items:
        $ref: "#/Notification"
    next_cursor:
      type: string
      format: uuid
      description: Present when more notices follow; pass it as cursor.
    unread:
      type: integer
PushToken:
  type: object
  additionalProperties: false
  required: [token]
  properties:
    token:
      type: string
NotificationIDs:
  type: object
  additionalProperties: false
  required: [ids]
  properties:
    ids:
      type: array
      minItems: 1
      maxItems: 500
      uniqueItems: true
      items:
        type: string
        format: uuid
ReadAllResult:
  type: object
  additionalProperties: false
  required: [ids]
  properties:
    ids:
      type: array
      description: |
        The notices this call marked read, as many as there were (the 90-day
        retention bounds them). To undo it, pass them to POST
        /v1/notifications/unread in chunks of at most 500.
      items:
        type: string
        format: uuid
NotificationSettings:
  type: object
  additionalProperties: false
  required: [messages, offers, orders, price_cuts, followed, reviews, quiet]
  description: |
    Which notices push. A switch that is off stops the push only; the notice
    is still listed. Search watch notices push by each watch's own bell, and
    the listing and account notices always push. No push goes out during
    quiet hours.
  properties:
    messages:
      type: boolean
      description: Chat messages.
    offers:
      type: boolean
      description: Offers, counters, agreements and their ends.
    orders:
      type: boolean
      description: COD requests, shipping, delivery, failed deliveries and cancellations.
    price_cuts:
      type: boolean
      description: A new low of a saved listing.
    followed:
      type: boolean
      description: A new listing of a seller the caller follows.
    reviews:
      type: boolean
      description: A new review of the caller.
    quiet:
      $ref: "#/QuietHours"
QuietHours:
  type: object
  additionalProperties: false
  required: ["on", from, to]
  description: |
    In Vietnam time. The window may cross midnight; from is inside it and to
    is not. A push skipped in the window is dropped, not delayed.
  properties:
    "on":
      type: boolean
    from:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Start, as HH:MM on a 24-hour clock.
      example: "22:00"
    to:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: End, as HH:MM on a 24-hour clock; not the same as from.
      example: "07:00"
