SavedListing:
  type: object
  additionalProperties: false
  required: [id, listing_id, saved_price, saved_at, listing]
  properties:
    id:
      type: string
      format: uuid
    listing_id:
      type: string
      format: uuid
    saved_price:
      type: integer
      format: int64
      description: The listing's price when it was saved.
    saved_at:
      type: string
      format: date-time
    alert_below:
      type: integer
      format: int64
      description: The save's own alert level; absent when it has none.
    listing:
      type: object
      additionalProperties: false
      required: [status]
      description: The listing as it is now. A hidden or deleted listing shows its status alone.
      properties:
        slug:
          $ref: "catalog.yaml#/ListingSlug"
        title:
          type: string
        price:
          type: integer
          format: int64
        cover_thumb_url:
          type: string
          format: uri
        category_code:
          type: string
          description: The listing's subcategory, such as phones.iphone.
        condition:
          $ref: "catalog.yaml#/Condition"
        commune:
          type: string
          description: The name of the listing's commune.
        status:
          $ref: "catalog.yaml#/ListingStatus"
SavedList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/SavedListing"
    next_cursor:
      type: string
      format: uuid
      description: Present when more saves follow; pass it as cursor.
SearchItem:
  type: object
  additionalProperties: false
  required: [id, slug, seller_id, title, price, category_code, condition, allow_offers, commune, saved]
  description: |
    A listing as a browse surface shows it: a search page, Home's nearby
    feed and the seller view. It carries no point of the listing.
  properties:
    id:
      type: string
      format: uuid
    slug:
      $ref: "catalog.yaml#/ListingSlug"
    seller_id:
      type: string
      format: uuid
    title:
      type: string
    price:
      type: integer
      format: int64
    cover_thumb_url:
      type: string
      format: uri
    photo_thumb_urls:
      type: array
      maxItems: 5
      items:
        type: string
        format: uri
      description: The thumbnails of the listing's first five photos in order, the cover first.
    category_code:
      type: string
      description: The listing's subcategory, such as phones.iphone.
    condition:
      $ref: "catalog.yaml#/Condition"
    allow_offers:
      type: boolean
    commune:
      type: string
      description: The name of the listing's commune.
    price_drop:
      $ref: "catalog.yaml#/PriceDrop"
    distance_km:
      type: integer
      minimum: 0
      description: Whole kilometres from the caller's position, 0 under 1 km; absent without a position.
    saved:
      type: boolean
      description: False when signed out.
SearchItemList:
  type: object
  additionalProperties: false
  required: [items]
  description: A page of search cards.
  properties:
    items:
      type: array
      items:
        $ref: "#/SearchItem"
    next_cursor:
      type: string
      format: uuid
      description: Present when more listings follow; pass it as cursor.
Chip:
  type: object
  additionalProperties: false
  required: [id, kind, label]
  description: A signal the model read from the query; off=<id> leaves it out.
  properties:
    id:
      type: string
    kind:
      type: string
      enum: [phrase, category, price, condition, place, near_me, fresh, offers]
    label:
      type: string
CategoryCount:
  type: object
  additionalProperties: false
  required: [category, count]
  properties:
    category:
      type: string
    count:
      type: integer
SearchView:
  type: object
  additionalProperties: false
  required: [search_id, items]
  properties:
    search_id:
      type: string
      format: uuid
      description: Names this response; the client sends it back with the search events of POST /v1/client-events.
    items:
      type: array
      items:
        $ref: "#/SearchItem"
    next_cursor:
      type: string
      description: Present when more listings follow, up to the 500th.
    chips:
      type: array
      items:
        $ref: "#/Chip"
    preview_chips:
      type: array
      description: >-
        Signed out, on a first page with q: the chips the model read for the
        same query when a signed-in person searched it, from the cache. The
        search did not apply them; signing in does. Absent when nobody signed
        in searched the query.
      items:
        $ref: "#/Chip"
    watch_id:
      type: string
      format: uuid
      description: The caller's watch of this query; absent signed out or when there is none.
    counts:
      type: array
      description: With a root category filter, the matches per subcategory, under every other filter, province included.
      items:
        $ref: "#/CategoryCount"
SearchHistory:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 10
      items:
        $ref: "#/SearchHistoryItem"
SearchHistoryItem:
  type: object
  additionalProperties: false
  required: [id, query, title, searched_at]
  description: A text search the caller made.
  properties:
    id:
      type: string
      format: uuid
    query:
      type: string
      description: The words as the caller typed them.
    title:
      type: string
      description: The query with its first letter upper-cased.
    category:
      type: string
      description: The category the search understood; absent when none.
    photo_url:
      type: string
      format: uri
      description: The first result's photo; absent when the search found nothing.
    searched_at:
      type: string
      format: date-time
SavedAlert:
  type: object
  additionalProperties: false
  required: [below]
  properties:
    below:
      type: integer
      format: int64
      minimum: 10000
      maximum: 1000000000
      description: Tell when the price falls below this.
SearchWatchInput:
  type: object
  additionalProperties: false
  required: [q]
  properties:
    q:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '\S'
    category:
      type: string
      description: A root or subcategory code from GET /v1/categories.
    price_min:
      type: integer
      format: int64
      minimum: 0
    price_max:
      type: integer
      format: int64
      minimum: 0
    condition:
      type: array
      items:
        $ref: "catalog.yaml#/Condition"
    offers_only:
      type: boolean
    near_commune:
      type: string
    near_lat:
      type: number
      minimum: -90
      maximum: 90
      description: With near_lng; turned into its nearest commune and not kept.
    near_lng:
      type: number
      minimum: -180
      maximum: 180
    radius_km:
      type: integer
      minimum: 1
      maximum: 200
      description: Needs a place.
SearchWatchFilters:
  type: object
  additionalProperties: false
  properties:
    category:
      type: string
    price_min:
      type: integer
      format: int64
    price_max:
      type: integer
      format: int64
    conditions:
      type: array
      items:
        $ref: "catalog.yaml#/Condition"
    offers_only:
      type: boolean
SearchWatch:
  type: object
  additionalProperties: false
  required: [id, query, filters, new_count, alert, created_at]
  properties:
    id:
      type: string
      format: uuid
    query:
      type: string
      description: The words as the caller typed them, trimmed.
    filters:
      $ref: "#/SearchWatchFilters"
    area:
      type: object
      additionalProperties: false
      required: [commune_code, name]
      description: The commune the watch searches from; absent without a place.
      properties:
        commune_code:
          type: string
        name:
          type: string
    radius_km:
      type: integer
    new_count:
      type: integer
      minimum: 0
      maximum: 99
      description: New listings since the caller last opened the watch; 99 means 99 or more.
    alert:
      type: boolean
      description: False when muted.
    created_at:
      type: string
      format: date-time
SearchWatchList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 20
      items:
        $ref: "#/SearchWatch"
