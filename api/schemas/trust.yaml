ReviewDraft:
  type: object
  additionalProperties: false
  required: [stars]
  properties:
    stars:
      type: integer
      description: 1 to 5; a business rule, so another number is 422.
    text:
      type: string
      description: At most 500 characters after trimming; may be empty.
Review:
  type: object
  additionalProperties: false
  required: [id, stars, text, buyer, listing, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    stars:
      type: integer
    text:
      type: string
    buyer:
      type: object
      additionalProperties: false
      required: [id, display_name, deleted]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        deleted:
          type: boolean
          description: The buyer deleted their account; display_name is empty and there is no avatar.
        avatar_url:
          type: string
          format: uri
          description: A public 400 px square; absent without an avatar.
    listing:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
    created_at:
      type: string
      format: date-time
      description: The first submission; the review changes only for 7 days after it.
    updated_at:
      type: string
      format: date-time
ReviewList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Review"
    next_cursor:
      type: string
      format: uuid
      description: Present when more reviews follow; pass it as cursor.
Rating:
  type: object
  additionalProperties: false
  required: [average, count]
  properties:
    average:
      type: number
      description: The average stars over every review of the seller; 0 without reviews.
    count:
      type: integer
ReportCreate:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    listing_id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    conversation_id:
      type: string
      format: uuid
      description: With account_id only, the caller's conversation with that account; another one is 422 invalid_report.
    reason:
      type: string
      description: banned, fake, scam or other; a business rule, so another value is 422.
    note:
      type: string
      description: At most 500 characters after trimming; may be empty.
Report:
  type: object
  additionalProperties: false
  required: [id, account_id, reason, note, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    listing_id:
      type: string
      format: uuid
      description: The listing reported; absent for a report of an account.
    account_id:
      type: string
      format: uuid
      description: The account reported, the seller for a listing.
    conversation_id:
      type: string
      format: uuid
      description: The caller's conversation with the account the report came from; absent when none was named.
    reason:
      type: string
      enum: [banned, fake, scam, other]
    note:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
ScamWarning:
  type: object
  additionalProperties: false
  required: [signals, dismissed]
  description: What the caller is told about the other member of a conversation; that member never sees it.
  properties:
    signals:
      type: array
      description: Oldest first; at least one is a message code.
      items:
        $ref: "#/ScamSignal"
    dismissed:
      type: boolean
      description: |
        True while no message code has appeared since the caller last
        dismissed the warning. The inbox shows the warning either way; Chat
        shows its banner only when this is false.
ScamSignal:
  type: object
  additionalProperties: false
  required: [code, text]
  properties:
    code:
      type: string
      description: |
        prepayment_request, off_app_contact, suspicious_link,
        sensitive_info_request, impersonation, fake_payment_proof, pressure,
        new_account or price_far_below. More may come; the app shows an
        unknown code with the Info icon.
    text:
      type: string
      description: Vietnamese, written by the server, as "Tài khoản mới tạo 2 ngày".
OwnReview:
  type: object
  additionalProperties: false
  required: [state, id, created_at, updated_at, change_until, locked]
  description: The buyer's review state. Dates and id are null before the first submission. Deleted reviews carry no stars or text. The seven-day window starts at the original created_at; locked uses the same boundary as edits and deletion.
  properties:
    state:
      type: string
      enum: [none, active, deleted]
    id:
      type: [string, "null"]
      format: uuid
    created_at:
      type: [string, "null"]
      format: date-time
    updated_at:
      type: [string, "null"]
      format: date-time
    change_until:
      type: [string, "null"]
      format: date-time
    locked:
      type: boolean
    stars:
      type: integer
      minimum: 1
      maximum: 5
    text:
      type: string
      maxLength: 500
