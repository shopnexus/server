ReviewDraft:
  type: object
  additionalProperties: false
  required: [stars]
  properties:
    stars:
      type: integer
      description: 1 to 5; a business rule, so another number is 422.
    text:
      type: string
      description: At most 500 characters after trimming; may be empty.
Review:
  type: object
  additionalProperties: false
  required: [id, stars, text, buyer, listing, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    stars:
      type: integer
    text:
      type: string
    buyer:
      type: object
      additionalProperties: false
      required: [id, display_name, deleted]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        deleted:
          type: boolean
          description: The buyer deleted their account; display_name is empty and there is no avatar.
        avatar_url:
          type: string
          format: uri
          description: A public 400 px square; absent without an avatar.
    listing:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
    created_at:
      type: string
      format: date-time
      description: The first submission; the review changes only for 7 days after it.
    updated_at:
      type: string
      format: date-time
ReviewList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Review"
    next_cursor:
      type: string
      format: uuid
      description: Present when more reviews follow; pass it as cursor.
Rating:
  type: object
  additionalProperties: false
  required: [average, count]
  properties:
    average:
      type: number
      description: The average stars over every review of the seller; 0 without reviews.
    count:
      type: integer
ReportCreate:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    listing_id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    reason:
      type: string
      description: banned, fake, scam or other; a business rule, so another value is 422.
    note:
      type: string
      description: At most 500 characters after trimming; may be empty.
Report:
  type: object
  additionalProperties: false
  required: [id, account_id, reason, note, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    listing_id:
      type: string
      format: uuid
      description: The listing reported; absent for a report of an account.
    account_id:
      type: string
      format: uuid
      description: The account reported, the seller for a listing.
    reason:
      type: string
      enum: [banned, fake, scam, other]
    note:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
