ReviewDraft:
  type: object
  additionalProperties: false
  required: [stars]
  properties:
    stars:
      type: integer
      description: 1 to 5; a business rule, so another number is 422.
    text:
      type: string
      description: At most 500 characters after trimming; may be empty.
    photos:
      type: array
      maxItems: 4
      uniqueItems: true
      description: |
        Upload IDs of the caller's photos, in the order they show; [] removes
        them, and leaving the field out keeps the review's photos. Each is a
        photo upload of the caller's, uploaded and not yet used elsewhere, or
        already one of this review's.
      items:
        type: string
        format: uuid
Review:
  type: object
  additionalProperties: false
  required: [id, role, stars, text, reviewer, listing, reply, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    role:
      $ref: "#/ReviewRole"
    stars:
      type: integer
    text:
      type: string
    reviewer:
      type: object
      additionalProperties: false
      required: [id, display_name, deleted]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        deleted:
          type: boolean
          description: The reviewer deleted their account; display_name is empty and there is no avatar.
        avatar_url:
          type: string
          format: uri
          description: A public 400 px square; absent without an avatar.
    listing:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
    reply:
      anyOf:
        - $ref: "#/ReviewReply"
        - type: "null"
      description: The subject's one reply; null without one.
    photos:
      type: array
      maxItems: 4
      description: The reviewer's photos in their order; empty without any.
      items:
        $ref: "#/ReviewPhoto"
    helpful:
      $ref: "#/ReviewHelpful"
    created_at:
      type: string
      format: date-time
      description: The first submission; the review changes only while hidden and for 7 days after it, and not after a reply.
    updated_at:
      type: string
      format: date-time
ReviewPhoto:
  type: object
  additionalProperties: false
  required: [upload_id, url, thumb_url]
  properties:
    upload_id:
      type: string
      format: uuid
      description: What ReviewDraft.photos names to keep the photo.
    url:
      type: string
      format: uri
      description: The photo, at most 1600 px on its long side.
    thumb_url:
      type: string
      format: uri
      description: A 400 px thumbnail.
ReviewHelpful:
  type: object
  additionalProperties: false
  required: [count]
  description: The people who found the review helpful.
  properties:
    count:
      type: integer
      minimum: 0
    marked:
      type: boolean
      description: |
        Whether the reader marked the review helpful; present only when the
        reader may mark it: signed in, and neither its reviewer nor its
        subject.
ReviewRole:
  type: string
  enum: [seller, buyer]
  description: The side the reviewed person was on. seller rates the person who sold, written by the buyer; buyer rates the person who bought, written by the seller.
ReviewReply:
  type: object
  additionalProperties: false
  required: [text, at]
  properties:
    text:
      type: string
      maxLength: 500
    at:
      type: string
      format: date-time
ReplyDraft:
  type: object
  additionalProperties: false
  required: [text]
  properties:
    text:
      type: string
      description: 1 to 500 characters after trimming; a business rule, so another length is 422.
ReviewList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Review"
    next_cursor:
      type: string
      format: uuid
      description: Present when more reviews follow; pass it as cursor.
Rating:
  type: object
  additionalProperties: false
  required: [average, count]
  properties:
    average:
      type: number
      description: The average stars over every review of the seller; 0 without reviews.
    count:
      type: integer
ReportCreate:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    listing_id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    conversation_id:
      type: string
      format: uuid
      description: With account_id only, the caller's conversation with that account; another one is 422 invalid_report.
    reason:
      type: string
      description: banned, fake, scam or other; a business rule, so another value is 422.
    note:
      type: string
      description: At most 500 characters after trimming; may be empty.
Report:
  type: object
  additionalProperties: false
  required: [id, account_id, reason, note, status, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    listing_id:
      type: string
      format: uuid
      description: The listing reported; absent for a report of an account.
    account_id:
      type: string
      format: uuid
      description: The account reported, the seller for a listing.
    conversation_id:
      type: string
      format: uuid
      description: The caller's conversation with the account the report came from; absent when none was named.
    reason:
      type: string
      enum: [banned, fake, scam, other]
    note:
      type: string
    status:
      type: string
      enum: [open, withdrawn, resolved]
      description: withdrawn once the caller withdrew it; resolved once ShopNexus closed the case it is part of; else open. A new or updated report is open.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
ReportList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Report"
    next_cursor:
      type: string
      format: uuid
      description: Present when more reports follow; pass it as cursor.
ScamWarning:
  type: object
  additionalProperties: false
  required: [signals, dismissed]
  description: What the caller is told about the other member of a conversation; that member never sees it.
  properties:
    signals:
      type: array
      description: Oldest first; at least one is a message code.
      items:
        $ref: "#/ScamSignal"
    dismissed:
      type: boolean
      description: |
        True while no message code has appeared since the caller last
        dismissed the warning. The inbox shows the warning either way; Chat
        shows its banner only when this is false.
ScamSignal:
  type: object
  additionalProperties: false
  required: [code, text]
  properties:
    code:
      type: string
      description: |
        prepayment_request, off_app_contact, suspicious_link,
        sensitive_info_request, impersonation, fake_payment_proof, pressure,
        new_account or price_far_below. More may come; the app shows an
        unknown code with the Info icon.
    text:
      type: string
      description: Vietnamese, written by the server, as "Tài khoản mới tạo 2 ngày".
    message_id:
      type: string
      format: uuid
      description: |
        The other member's newest message in the check that found the
        signal, so a client shows the warning under it. Absent when the
        check read no message of theirs, and on signals found before
        2026-11-20.
OwnReview:
  type: object
  additionalProperties: false
  required: [state, id, created_at, updated_at, change_until, visible_at, locked]
  description: The caller's review of the other side of an order. Dates and id are null before the first submission. Deleted reviews carry no stars or text. change_until is when the review shows or 7 days after the original created_at, whichever comes first; locked uses the same boundary as edits and deletion, and is true once the subject replied.
  properties:
    state:
      type: string
      enum: [none, active, deleted]
    id:
      type: [string, "null"]
      format: uuid
    created_at:
      type: [string, "null"]
      format: date-time
    updated_at:
      type: [string, "null"]
      format: date-time
    change_until:
      type: [string, "null"]
      format: date-time
    visible_at:
      type: [string, "null"]
      format: date-time
      description: When the other side and the public see the review; it waits for their review or 7 days after the order closed.
    locked:
      type: boolean
    stars:
      type: integer
      minimum: 1
      maximum: 5
    text:
      type: string
      maxLength: 500
    reply:
      $ref: "#/ReviewReply"
    photos:
      type: array
      maxItems: 4
      description: The review's photos; absent on a deleted review.
      items:
        $ref: "#/ReviewPhoto"
TheirReview:
  type: object
  additionalProperties: false
  required: [state, id, visible_at, can_reply]
  description: The other side's review of the caller. A hidden one carries only when it shows; a visible one carries its stars, text, date and reply.
  properties:
    state:
      type: string
      enum: [hidden, visible]
    id:
      type: string
      format: uuid
    visible_at:
      type: string
      format: date-time
    created_at:
      type: string
      format: date-time
    stars:
      type: integer
      minimum: 1
      maximum: 5
    text:
      type: string
      maxLength: 500
    reply:
      $ref: "#/ReviewReply"
    can_reply:
      type: boolean
      description: Visible and without a reply. A reply closes the review for both sides.
    photos:
      type: array
      maxItems: 4
      description: A visible review's photos.
      items:
        $ref: "#/ReviewPhoto"
