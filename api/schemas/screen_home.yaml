HomeCategory:
  type: object
  additionalProperties: false
  required: [code, display_name, count, children]
  description: A root of the category tree.
  properties:
    code:
      type: string
    display_name:
      type: string
    count:
      type: integer
      description: Active listings under the root.
    children:
      type: array
      items:
        $ref: "#/HomeSubcategory"
HomeSubcategory:
  type: object
  additionalProperties: false
  required: [code, display_name, count]
  description: A subcategory under a root of the category tree.
  properties:
    code:
      type: string
    display_name:
      type: string
    count:
      type: integer
      description: Active listings in the subcategory.
HomeScreen:
  type: object
  additionalProperties: false
  required: [categories, nearby, notifications_unread]
  properties:
    notifications_unread:
      type: integer
      description: The reader's unread notices; 0 when signed out.
    categories:
      type: array
      items:
        $ref: "#/HomeCategory"
    nearby:
      $ref: "discovery.yaml#/SearchView"
      description: The first page of the nearby feed; no items without a position.
