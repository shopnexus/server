ListingInput:
  type: object
  additionalProperties: false
  required: [title, price, category_code, condition, allow_offers, commune_code, photos]
  description: |
    A complete listing, to post or to replace one. The rules below are
    business rules: breaking one answers 422 invalid_listing with an entry
    per field.
  properties:
    title:
      type: string
      description: 1 to 70 characters after trimming.
    price:
      type: integer
      format: int64
      description: Whole đồng, 10,000 to 1,000,000,000.
    description:
      type: string
      description: At most 1,500 characters; may be empty.
    category_code:
      type: string
      description: A subcategory code from GET /v1/categories, such as phones.iphone.
    condition:
      $ref: "#/Condition"
    allow_offers:
      type: boolean
    commune_code:
      type: string
      description: A commune code from GET /v1/regions/{province_code}/communes.
    photos:
      type: array
      items:
        type: string
        format: uuid
      description: 1 to 10 upload IDs, in order; the first is the cover.
    specs:
      type: array
      items:
        $ref: "#/Spec"
      description: Up to 20 label and value pairs, with one for each of the category's spec_labels.
    gps:
      type: object
      additionalProperties: false
      required: [lat, lng]
      description: |
        The seller's position, sent only with their permission. The server
        blurs it to about 1 km before storing it and never returns it. A
        point farther than 30 km from the commune is 422 invalid_listing on
        field gps.
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
Spec:
  type: object
  additionalProperties: false
  required: [label, value]
  properties:
    label:
      type: string
      description: 1 to 50 characters.
    value:
      type: string
      description: 1 to 50 characters.
Condition:
  type: string
  enum: [new, like_new, used]
ListingStatus:
  type: string
  enum: [processing, active, hidden, rejected, reserved, sold, deleted]
  description: |
    processing: the photos are being processed. active: on sale. hidden:
    taken down by the seller, or by ShopNexus, and then only ShopNexus puts
    it back on sale (listing_held). rejected: a photo was refused; the photo says
    why, and an edit tries again. reserved: held while an order's parcel
    travels; anyone may read it, and the seller cannot change it. sold: sold
    off the app or through an order. deleted: removed by the seller; only a
    save or a deal that names the listing still shows it. Only active and
    reserved listings are public.
Listing:
  type: object
  additionalProperties: false
  required:
    - id
    - slug
    - seller_id
    - title
    - price
    - description
    - category_code
    - condition
    - allow_offers
    - location
    - photos
    - specs
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    slug:
      $ref: "#/ListingSlug"
    seller_id:
      type: string
      format: uuid
    title:
      type: string
    price:
      type: integer
      format: int64
    description:
      type: string
    category_code:
      type: string
    condition:
      $ref: "#/Condition"
    allow_offers:
      type: boolean
    location:
      $ref: "#/Location"
    photos:
      type: array
      items:
        $ref: "#/Photo"
    specs:
      type: array
      items:
        $ref: "#/Spec"
    status:
      $ref: "#/ListingStatus"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    published_at:
      type: string
      format: date-time
      description: When the listing first went on sale.
    sold_at:
      type: string
      format: date-time
    price_drop:
      $ref: "#/PriceDrop"
PriceDrop:
  type: object
  additionalProperties: false
  required: [previous_price, dropped_at]
  description: |
    The listing's last price change, sent while it is a drop of 5 % or more
    made in the last 7 days. A later raise ends it, and a drop that follows
    a raise in that week counts from the price before the raise.
  properties:
    previous_price:
      type: integer
      format: int64
      description: The price the drop replaced.
    dropped_at:
      type: string
      format: date-time
ListingSlug:
  type: string
  description: |
    The end of the listing's web address, /listings/{slug}: the title
    without accents in lowercase words joined by hyphens, then the
    listing's 8-character code. Only the code finds the listing, so an
    address written before a title edit still works.
  example: xe-dap-giant-escape-3-k7m2qx9a
ListingPhotoCopies:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 10
      items:
        $ref: "#/ListingDraftPhoto"
Photo:
  type: object
  additionalProperties: false
  required: [upload_id, copied]
  properties:
    upload_id:
      type: string
      format: uuid
    copied:
      type: boolean
      description: |
        True for a photo ShopNexus copied from the seller's own listing on
        another site (POST /v1/listing-reads); false for one taken or picked in
        the app, and until the photo is processed. Read only.
    url:
      type: string
      format: uri
      description: The photo, at most 1600 px on its long side; set once processed.
    thumb_url:
      type: string
      format: uri
      description: A 400 px thumbnail; set once processed.
    failure:
      type: string
      description: Why processing refused the photo, on a rejected listing, in English.
    failure_code:
      type: string
      description: |
        failure as a code, for a client to write in its own words:
        too_large, wrong_type, unreadable, too_many_pixels (over 40
        megapixels, or 20 at 16 bits a channel), unknown_upload,
        not_attached or other. More may come; a client reads an unknown
        code as other.
Location:
  type: object
  additionalProperties: false
  required: [commune, province, lat, lng]
  description: A commune and its province, with a point inside the commune rather than where a seller or the caller is.
  properties:
    commune:
      $ref: "#/Region"
    province:
      $ref: "#/Region"
    lat:
      type: number
    lng:
      type: number
Region:
  type: object
  additionalProperties: false
  required: [code, display_name]
  properties:
    code:
      type: string
    display_name:
      type: string
Category:
  type: object
  additionalProperties: false
  required: [code, display_name, spec_labels]
  properties:
    code:
      type: string
    parent_code:
      type: string
      description: Absent on a root. A listing takes a category with a parent.
    display_name:
      type: string
    spec_labels:
      type: array
      description: The specs a listing under it must fill, in order. Empty on a root and on "Khác".
      items:
        type: string
CategoryGuessRequest:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 70
    description:
      type: string
      maxLength: 1500
CategoryGuess:
  type: object
  additionalProperties: false
  required: [category_code]
  properties:
    category_code:
      type: [string, "null"]
      description: A subcategory code, null when the text reads as none.
CategoryList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      description: The roots in order, then each root's subcategories in order.
      items:
        $ref: "#/Category"
Province:
  type: object
  additionalProperties: false
  required: [code, display_name]
  properties:
    code:
      type: string
    display_name:
      type: string
ProvinceList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Province"
Commune:
  type: object
  additionalProperties: false
  required: [code, province_code, display_name, lat, lng]
  properties:
    code:
      type: string
    province_code:
      type: string
    display_name:
      type: string
    lat:
      type: number
    lng:
      type: number
CommuneList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      description: By display name; empty for an unknown province.
      items:
        $ref: "#/Commune"
ListingDraftInput:
  type: object
  additionalProperties: false
  required: [schema_version, title, price, photos, body]
  description: |
    A draft as the app has it. The server reads title, price and photos and
    keeps body as it came, without reading it; the posting rules apply only
    at POST /v1/listings.
  properties:
    schema_version:
      type: integer
      minimum: 1
      description: The layout of body, which the app defines.
    title:
      type: string
      maxLength: 100
      description: May be empty.
    price:
      type: [integer, "null"]
      format: int64
      minimum: 0
      description: Whole đồng, or null while the seller has typed none.
    photos:
      type: array
      maxItems: 10
      items:
        type: string
        format: uuid
      description: |
        Upload IDs of the caller's, in order. A photo a listing took, or one
        that expired, is dropped from the stored draft; an ID given twice is
        kept once. Each photo kept is kept 30 days from this PUT.
    body:
      type: string
      maxLength: 32768
      description: JSON the app owns, as a string.
ListingDraftPhoto:
  type: object
  additionalProperties: false
  required: [upload_id, url]
  properties:
    upload_id:
      type: string
      format: uuid
    url:
      type: string
      description: A presigned GET of the original upload, valid for an hour.
ListingDraft:
  type: object
  additionalProperties: false
  required: [id, schema_version, title, price, photos, body, updated_at, expires_at]
  description: |
    A listing the caller started and has not posted, kept for their other
    devices until expires_at, 30 days after its last PUT. Photos a listing
    took or that expired are left out.
  properties:
    id:
      type: string
      format: uuid
    schema_version:
      type: integer
      minimum: 1
    title:
      type: string
      maxLength: 100
    price:
      type: [integer, "null"]
      format: int64
      minimum: 0
    photos:
      type: array
      maxItems: 10
      items:
        $ref: "#/ListingDraftPhoto"
    body:
      type: string
      maxLength: 32768
    updated_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
ListingDraftList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 20
      items:
        $ref: "#/ListingDraft"
Sitemap:
  type: object
  additionalProperties: false
  required: [listings, sellers]
  properties:
    listings:
      type: array
      description: The parts of the public listings, newest first; none when no listing is public.
      items:
        $ref: "#/SitemapPart"
    sellers:
      type: array
      description: The parts of the sellers with a public listing, newest account first.
      items:
        $ref: "#/SitemapPart"
SitemapPart:
  type: object
  additionalProperties: false
  required: [updated_at]
  properties:
    cursor:
      type: string
      format: uuid
      description: What GET /v1/sitemap/listings or /v1/sitemap/sellers takes for this part; absent on the first part.
    updated_at:
      type: string
      format: date-time
      description: The latest change to an entry of the part.
SitemapListingList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/SitemapListing"
SitemapListing:
  type: object
  additionalProperties: false
  required: [slug, photos, updated_at]
  properties:
    slug:
      type: string
      description: The listing's web address name, /listings/{slug} on the website.
    photos:
      type: array
      description: The public URLs of the listing's processed photos, in order, the cover first; the same URLs as the listing's photos[].url.
      items:
        type: string
        format: uri
    updated_at:
      type: string
      format: date-time
SitemapAreaList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/SitemapArea"
SitemapArea:
  type: object
  additionalProperties: false
  required: [category_code, province_code, count, updated_at]
  description: A root category in a province, with at least 5 listings on sale.
  properties:
    category_code:
      type: string
      description: A root category code from GET /v1/categories.
    province_code:
      type: string
      description: A province code from GET /v1/regions.
    count:
      type: integer
      minimum: 5
      description: How many listings of the category are on sale in the province.
    updated_at:
      type: string
      format: date-time
      description: The latest change to one of those listings.
IndexNowKey:
  type: object
  additionalProperties: false
  required: [key]
  properties:
    key:
      type: string
      pattern: "^[a-zA-Z0-9-]{8,128}$"
      description: The key; the website serves it at /<key>.txt.
SitemapSellerList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/SitemapSeller"
SitemapSeller:
  type: object
  additionalProperties: false
  required: [id, updated_at]
  properties:
    id:
      type: string
      format: uuid
    updated_at:
      type: string
      format: date-time
      description: The latest change to one of the seller's public listings.
