InboxScreen:
  type: object
  additionalProperties: false
  required: [items, unread]
  properties:
    items:
      type: array
      items:
        $ref: "#/InboxItem"
    next_cursor:
      type: string
      format: uuid
      description: Present when more conversations follow; pass it as cursor.
    unread:
      type: integer
      description: The caller's unread messages over unarchived conversations, as GET /v1/me/unread counts them.
InboxItem:
  type: object
  additionalProperties: false
  required: [id, other, last_message, unread, archived, ignored, other_active_deals]
  description: |
    deal is the pair's deal the row is about, absent when the two have none:
    the newest, by last move, of those where it is the caller's turn, else
    the newest negotiating or agreed one, else the newest. order_status is
    that of the deal's newest order. scam_warning is absent when the caller
    has no warning in the conversation.
  properties:
    id:
      type: string
      format: uuid
    other:
      $ref: "chat.yaml#/Person"
    last_message:
      $ref: "chat.yaml#/Message"
    unread:
      type: integer
      description: The other member's sent messages after the caller's read marker; at least 1 while the caller's unread mark is set.
    archived:
      type: boolean
    ignored:
      type: boolean
    deal:
      $ref: "deal.yaml#/DealSummary"
    other_active_deals:
      type: integer
      description: The pair's negotiating or agreed deals besides deal.
    scam_warning:
      $ref: "trust.yaml#/ScamWarning"
InboxSearch:
  type: object
  additionalProperties: false
  required: [threads, messages]
  properties:
    threads:
      type: array
      items:
        $ref: "#/InboxItem"
    messages:
      type: array
      items:
        $ref: "#/MessageHit"
    next_cursor:
      type: string
      format: uuid
      description: Present when more messages follow; pass it as cursor.
MessageHit:
  type: object
  additionalProperties: false
  required: [conversation_id, other, message]
  properties:
    conversation_id:
      type: string
      format: uuid
    other:
      $ref: "chat.yaml#/Person"
    message:
      $ref: "chat.yaml#/Message"
ChatScreen:
  type: object
  additionalProperties: false
  required: [id, other, archived, ignored, blocked, deals, messages]
  properties:
    id:
      type: string
      format: uuid
    other:
      $ref: "chat.yaml#/Person"
    archived:
      type: boolean
    ignored:
      type: boolean
      description: The caller ignores the conversation.
    blocked:
      type: boolean
      description: A block stands between the two, either way, so neither can send a message.
    other_read_message_id:
      type: string
      format: uuid
      description: |
        The newest message the other member has read, for "Đã xem" under the
        caller's messages up to it. Absent while they have read nothing.
    deals:
      type: array
      description: The deals of the two people on either side, newest first, as the caller sees them.
      items:
        $ref: "deal.yaml#/Deal"
    messages:
      $ref: "chat.yaml#/MessageList"
    scam_warning:
      $ref: "trust.yaml#/ScamWarning"
    ticket:
      $ref: "support.yaml#/Ticket"
      description: Present for a support chat, whose other side is ShopNexus.
    buyer_rating:
      $ref: "trust.yaml#/Rating"
      description: The other member's rating as a buyer; present when the caller sells to them in one of the deals.
