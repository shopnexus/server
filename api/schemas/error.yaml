Error:
  description: The body of every error response.
  type: object
  additionalProperties: false
  required: [error]
  properties:
    error:
      type: object
      additionalProperties: false
      required: [code, message, trace_id]
      properties:
        code:
          type: string
          description: Stable, snake_case; clients map it to their own text.
          example: invalid_request
        message:
          type: string
          description: English, for developers.
        fields:
          type: object
          description: One entry per invalid field, keyed by its JSON path, in English for developers.
          additionalProperties:
            type: string
        field_codes:
          type: object
          description: |
            The code of each entry in fields, by the same keys, so a client
            writes the problem in its own words: required, too_short,
            too_long (text), too_few, too_many (lists), out_of_range,
            off_step (an amount between two steps), invalid (type or
            format), not_allowed (a value the field does not take there),
            unknown (names nothing that exists, or a property the schema
            lacks), duplicate, one_of (takes exactly one of several fields),
            missing_specs (with details.missing_spec_keys) or in_use. More may come; a client reads an unknown code as
            invalid.
          additionalProperties:
            type: string
        details:
          type: object
          additionalProperties: false
          description: Values a client acts on. An operation's error description names the ones its codes send; an error without one has no details.
          properties:
            retry_after:
              type: integer
              minimum: 1
              description: Seconds to wait before trying again, rounded up, sent with otp_too_soon, otp_limit and login_locked.
            attempts_left:
              type: integer
              minimum: 1
              description: Guesses the code still takes, sent with invalid_code. With 1 left, a wrong guess answers code_locked.
            reason:
              type: string
              description: What the carrier answered, in its words and language, sent with carrier_refused.
            missing_spec_keys:
              type: array
              minItems: 1
              items:
                type: string
              description: The keys of the specs the listing's category asks for that it lacks, in the category's order, sent with invalid_listing when field_codes.specs is missing_specs.
            profile:
              type: object
              additionalProperties: false
              required: [name, avatar_url]
              description: The Chợ Tốt profile the server read, sent with code_not_found.
              properties:
                name:
                  type: string
                avatar_url:
                  type: [string, "null"]
        trace_id:
          type: string
          description: Equals the Trace-Id response header.
