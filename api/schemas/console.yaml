LoginRequest:
  type: object
  additionalProperties: false
  required: [email, password]
  properties:
    email:
      type: string
      minLength: 1
      maxLength: 254
      description: As typed; the server trims and lower-cases it, so this has no email format check.
    password:
      type: string
      minLength: 1
      maxLength: 1024
    new_password:
      type: string
      minLength: 1
      maxLength: 1024
      description: |
        Replaces the temporary password at the first sign-in; ignored
        afterwards. 12 to 128 characters, not the email and not the current
        password. Later calls send it as password.
    code:
      type: string
      pattern: "^[0-9]{6}$"
      description: The TOTP code, once the member has started or finished enrollment.
EnrollmentRequest:
  type: object
  additionalProperties: false
  required: [email, password]
  properties:
    email:
      type: string
      minLength: 1
      maxLength: 254
    password:
      type: string
      minLength: 1
      maxLength: 1024
TOTPEnrollment:
  type: object
  additionalProperties: false
  required: [secret, otpauth_uri]
  properties:
    secret:
      type: string
      description: Base32, for typing into an authenticator by hand.
    otpauth_uri:
      type: string
      description: For a QR code.
Me:
  type: object
  additionalProperties: false
  required: [id, email, display_name, role]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
    display_name:
      type: string
    role:
      type: string
      enum: [moderator, admin]
ChangePasswordRequest:
  type: object
  additionalProperties: false
  required: [current_password, new_password]
  properties:
    current_password:
      type: string
      minLength: 1
      maxLength: 1024
    new_password:
      type: string
      minLength: 1
      maxLength: 1024
Member:
  type: object
  additionalProperties: false
  required: [id, email, display_name, role, status, totp_enrolled, created_at]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
    display_name:
      type: string
    role:
      type: string
      enum: [moderator, admin]
    status:
      type: string
      enum: [active, disabled]
    totp_enrolled:
      type: boolean
    locked_until:
      type: string
      format: date-time
      description: Present while failed sign-ins lock the member's email.
    created_at:
      type: string
      format: date-time
MemberList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Member"
    next_cursor:
      type: string
      format: uuid
CreateMemberRequest:
  type: object
  additionalProperties: false
  required: [email, display_name]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    display_name:
      type: string
      minLength: 1
      maxLength: 100
CreatedMember:
  type: object
  additionalProperties: false
  required: [member, temporary_password]
  properties:
    member:
      $ref: "#/Member"
    temporary_password:
      type: string
      description: Shown once; the member must replace it at the first sign-in.
TemporaryPassword:
  type: object
  additionalProperties: false
  required: [temporary_password]
  properties:
    temporary_password:
      type: string
ConsoleAccount:
  type: object
  additionalProperties: false
  required: [id, display_name, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
    status:
      type: string
      enum: [active, suspended, deleted]
    suspended_until:
      type: string
      format: date-time
    suspend_reason:
      type: string
    created_at:
      type: string
      format: date-time
ConsoleAccountList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/ConsoleAccount"
    next_cursor:
      type: string
      format: uuid
    total:
      type: integer
      minimum: 0
      description: With status, how many accounts are in that status now, whatever q and the page.
ConsoleAccountDetail:
  type: object
  additionalProperties: false
  required: [account, identities, actions]
  properties:
    account:
      $ref: "#/ConsoleAccount"
    identities:
      type: array
      items:
        $ref: "account.yaml#/Identity"
    actions:
      type: array
      description: The 20 latest console actions on the account, newest first.
      items:
        $ref: "#/Action"
SuspendRequest:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 500
    until:
      type: string
      format: date-time
      description: Absent for a suspension without an end.
Action:
  type: object
  additionalProperties: false
  required: [id, at, actor, action, details]
  properties:
    id:
      type: string
      format: uuid
    at:
      type: string
      format: date-time
    actor:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [member, cli]
        member_id:
          type: string
          format: uuid
        display_name:
          type: string
          description: The console member's name, or the OS user for the CLI.
    ip:
      type: string
    action:
      type: string
      enum:
        - account.suspend
        - account.unsuspend
        - member.create
        - member.disable
        - member.enable
        - member.reset_password
        - member.reset_totp
        - member.unlock
        - ticket.reply
        - ticket.resolve
        - ticket.reopen
        - report.dismiss
        - report.resolve
        - report.reopen
        - listing.hide
        - listing.unhide
        - ai.provider_create
        - ai.provider_update
        - ai.provider_delete
        - ai.provider_models
        - ai.model_tags
        - ai.agent_create
        - ai.agent_update
        - ai.rotation
        - ai.budgets
    target:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [account, member, ticket, listing, ai_provider, ai_model, ai_agent, ai_settings]
        id:
          type: string
          format: uuid
    details:
      type: object
      description: >-
        What the action needs beyond its name, such as a suspension's reason and end. Never a secret. The report
        actions carry resolution_id; listing.hide and listing.unhide carry account_id, the listing's seller. The ai.* actions
        on a provider or a model carry its name, since their target id is a hash of it.
ActionList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Action"
    next_cursor:
      type: string
      format: uuid
DashboardTicketRequest:
  type: object
  additionalProperties: false
  required: [app]
  properties:
    app:
      type: string
      enum: [grafana, restate, litellm, s3, argocd, db]
      description: Grafana opens for moderators and admins; the others for admins.
DashboardTicket:
  type: object
  additionalProperties: false
  required: [ticket, callback_url]
  properties:
    ticket:
      type: string
      description: Opaque; opens the dashboard once within 60 seconds.
    callback_url:
      type: string
      description: https://<the dashboard's host>/_dashboard/callback?ticket=<ticket>. The console adds rd and sends the browser there.
ConsoleTicket:
  type: object
  additionalProperties: false
  required: [ticket, person, last_from, last_message_at]
  properties:
    ticket:
      $ref: "support.yaml#/Ticket"
    person:
      $ref: "chat.yaml#/Person"
    last_text:
      type: string
      description: The last message's text, for the queue row.
    last_from:
      type: string
      enum: [person, shopnexus]
      description: person shows "Chờ trả lời".
    last_message_at:
      type: string
      format: date-time
ConsoleTicketList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/ConsoleTicket"
    next_cursor:
      type: string
      format: uuid
ConsoleMessage:
  type: object
  additionalProperties: false
  required: [message, automatic]
  properties:
    message:
      $ref: "chat.yaml#/Message"
    member:
      type: string
      description: The member who wrote a ShopNexus reply; absent for the person's messages and for an automatic one.
    automatic:
      type: boolean
      description: A message ShopNexus sent by itself, such as the note when a carrier request closes.
ConsoleMessageList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/ConsoleMessage"
    next_cursor:
      type: string
      format: uuid
ConsoleReply:
  type: object
  additionalProperties: false
  required: [body]
  properties:
    body:
      type: string
      description: 1 to 1000 characters after trimming.
    reply_to:
      type: string
      format: uuid
      description: A sent message of the ticket's chat the reply quotes.
ConsoleTicketOrder:
  type: object
  additionalProperties: false
  required: [id, title, price, status, seller]
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    price:
      type: integer
      format: int64
    status:
      type: string
      enum: [pending, shipped, completed, failed, cancelled]
    seller:
      $ref: "chat.yaml#/Person"
    carrier:
      type: string
    tracking_code:
      type: string
    shipment_status:
      type: string
    shipped_at:
      type: string
      format: date-time
    delivered_at:
      type: string
      format: date-time
ConsoleTicketDetail:
  type: object
  additionalProperties: false
  required: [ticket, person_status, joined_at, others, messages]
  properties:
    ticket:
      $ref: "#/ConsoleTicket"
    person_status:
      type: string
      enum: [active, suspended, deleted]
    joined_at:
      type: string
      format: date-time
    order:
      $ref: "#/ConsoleTicketOrder"
    same_carrier_30d:
      type: integer
      description: carrier_request only; tickets naming the same carrier in 30 days, this one included.
    others:
      type: array
      items:
        $ref: "support.yaml#/Ticket"
    messages:
      $ref: "#/ConsoleMessageList"
ConsoleSupportSummary:
  type: object
  additionalProperties: false
  required: [open]
  properties:
    open:
      type: integer
ReportReasons:
  type: object
  additionalProperties: false
  description: How many reports of the case give each reason; a reason no report gives is absent.
  properties:
    banned:
      type: integer
      minimum: 1
    fake:
      type: integer
      minimum: 1
    scam:
      type: integer
      minimum: 1
    other:
      type: integer
      minimum: 1
ReportedListing:
  type: object
  additionalProperties: false
  required: [id, title, price, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    price:
      type: integer
      format: int64
      description: In đồng.
    status:
      $ref: "catalog.yaml#/ListingStatus"
    photo_url:
      type: string
      description: The cover photo's thumbnail; absent until the cover is processed.
    created_at:
      type: string
      format: date-time
ReportResolution:
  type: object
  additionalProperties: false
  required: [outcome, at, by]
  properties:
    outcome:
      type: string
      enum: [dismissed, actioned]
      description: dismissed is "Không vi phạm"; actioned follows the member's hides or suspension.
    at:
      type: string
      format: date-time
    by:
      type: object
      additionalProperties: false
      required: [member_id, display_name]
      properties:
        member_id:
          type: string
          format: uuid
        display_name:
          type: string
ReportCase:
  type: object
  additionalProperties: false
  description: >-
    The reports about one account, the seller for a listing report, that share one resolution. Withdrawn reports
    never count. listing is the case's most reported listing, a tie going to the one reported last, absent when only
    the account was reported; resolution is on a resolved case only.
  required: [account, reports, reasons, first_at, last_at]
  properties:
    account:
      $ref: "#/ConsoleAccount"
    reports:
      type: integer
      minimum: 1
      description: How many reports the case holds.
    reasons:
      $ref: "#/ReportReasons"
    listing:
      $ref: "#/ReportedListing"
    first_at:
      type: string
      format: date-time
    last_at:
      type: string
      format: date-time
    resolution:
      $ref: "#/ReportResolution"
ReportCaseList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/ReportCase"
    next_cursor:
      type: string
      format: uuid
    total:
      type: integer
      minimum: 0
      description: With status=open, how many accounts have an open case, whatever the page.
ReportCaseReport:
  type: object
  additionalProperties: false
  required: [id, reporter, reason, note, created_at]
  properties:
    id:
      type: string
      format: uuid
    reporter:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: Empty for a deleted account.
    reason:
      type: string
      enum: [banned, fake, scam, other]
    note:
      type: string
      description: May be empty.
    listing_id:
      type: string
      format: uuid
      description: The listing reported; absent for a report of the account.
    conversation_id:
      type: string
      format: uuid
      description: The reporter's conversation with the account the report came from; absent when none was named.
    created_at:
      type: string
      format: date-time
ReportCaseDetail:
  type: object
  additionalProperties: false
  description: A case as ReportCase says; resolution is on a resolved case only.
  required: [account, reasons, first_at, last_at, listings, reports]
  properties:
    account:
      $ref: "#/ConsoleAccount"
    reasons:
      $ref: "#/ReportReasons"
    first_at:
      type: string
      format: date-time
    last_at:
      type: string
      format: date-time
    resolution:
      $ref: "#/ReportResolution"
    listings:
      type: array
      description: Every listing reported in the case, the most reported first.
      items:
        $ref: "#/ReportedListing"
    reports:
      type: array
      description: The case's reports, newest first.
      items:
        $ref: "#/ReportCaseReport"
