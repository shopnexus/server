ListingScreen:
  type: object
  additionalProperties: false
  required: [listing, seller]
  properties:
    listing:
      $ref: "catalog.yaml#/Listing"
    distance_km:
      type: integer
      minimum: 0
      description: |
        Whole kilometres from the caller's position to the listing, 0 under
        1 km; absent without a position. It sits beside the listing because
        it depends on the request, and a Listing reads the same for everyone.
    seller:
      $ref: "#/SellerSummary"
    viewer:
      $ref: "#/ListingViewer"
    boost:
      $ref: "boost.yaml#/Boost"
      description: The listing's boost awaiting payment or running, sent to its seller only; absent when none.
    boostable:
      type: boolean
      description: |
        Sent to the seller only: whether POST /v1/boosts would sell a
        package for the listing now. True when the listing is on sale,
        has no boost awaiting payment or running, the account may write and
        has a phone, and the server takes payments.
SoldListingScreen:
  type: object
  additionalProperties: false
  required: [listing]
  properties:
    listing:
      $ref: "#/SoldListing"
SoldListing:
  type: object
  additionalProperties: false
  required: [id, slug, title, price, category_code, condition, location, photos, sold_at]
  description: A sold listing as anyone still sees it.
  properties:
    id:
      type: string
      format: uuid
    slug:
      $ref: "catalog.yaml#/ListingSlug"
    title:
      type: string
    price:
      type: integer
      format: int64
      description: The price the listing asked when it sold; an order's agreed price stays with its two people.
    category_code:
      type: string
    condition:
      $ref: "catalog.yaml#/Condition"
    location:
      $ref: "catalog.yaml#/Location"
    photos:
      type: array
      items:
        $ref: "catalog.yaml#/Photo"
    sold_at:
      type: string
      format: date-time
SellerSummary:
  type: object
  additionalProperties: false
  required: [id, display_name, joined_at, rating, sold, phone_verified]
  description: The seller of a listing, as the listing view shows them.
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
    avatar_url:
      type: string
      format: uri
      description: A public 400 px square; absent without an avatar.
    joined_at:
      type: string
      format: date-time
    rating:
      $ref: "trust.yaml#/Rating"
    sold:
      type: integer
      description: Listings sold, through an order or marked by hand.
    phone_verified:
      type: boolean
      description: |
        Whether the person signs in with a phone number, which the sign-in
        verified. The number itself is never sent.
    reply_time:
      $ref: "#/ReplyTime"
    away_until:
      type: string
      format: date-time
      description: |
        When the seller's away mode (tạm nghỉ) ends; absent when they are
        not away. Until then an offer, an accept or a COD request on their
        listings answers 409 seller_away.
ListingViewer:
  type: object
  additionalProperties: false
  required: [saved]
  description: |
    The reader's own ties to the listing, sent when the reader is signed in
    and is not the seller.
  properties:
    saved:
      type: boolean
      description: Whether the reader saved the listing.
    deal:
      $ref: "deal.yaml#/DealSummary"
    conversation_id:
      type: string
      format: uuid
      description: The reader's conversation with the seller; absent when there is none.
SellerScreen:
  type: object
  additionalProperties: false
  required: [seller, listings, reviews, buyer_reviews]
  properties:
    seller:
      $ref: "#/SellerProfile"
    listings:
      $ref: "discovery.yaml#/SearchItemList"
    reviews:
      $ref: "trust.yaml#/ReviewList"
      description: The first page of the person's reviews as a seller (Khi bán).
    buyer_reviews:
      $ref: "trust.yaml#/ReviewList"
      description: The first page of the person's reviews as a buyer (Khi mua).
    viewer:
      $ref: "#/SellerViewer"
SellerProfile:
  type: object
  additionalProperties: false
  required: [id, display_name, bio, joined_at, rating, buyer_rating, sold, on_sale, followers, phone_verified]
  description: The seller as the seller view shows them.
  properties:
    id:
      type: string
      format: uuid
    display_name:
      type: string
    avatar_url:
      type: string
      format: uri
      description: A public 400 px square; absent without an avatar.
    bio:
      type: string
      description: May be empty.
    joined_at:
      type: string
      format: date-time
    rating:
      $ref: "trust.yaml#/Rating"
      description: The rating as a seller, which search and the seller head use.
    buyer_rating:
      $ref: "trust.yaml#/Rating"
      description: The rating as a buyer.
    sold:
      type: integer
      description: Listings sold, through an order or marked by hand.
    on_sale:
      type: integer
      description: Listings active or reserved for an order on its way.
    followers:
      type: integer
      description: How many accounts follow the seller.
    phone_verified:
      type: boolean
      description: |
        Whether the person signs in with a phone number, which the sign-in
        verified. The number itself is never sent.
    reply_time:
      $ref: "#/ReplyTime"
    last_active_at:
      type: string
      format: date-time
      description: |
        When the person last had the app open, to the 30 seconds; absent
        before the first time. The app shows "Đang hoạt động" under 5
        minutes, otherwise how long ago.
    away_until:
      type: string
      format: date-time
      description: |
        When the seller's away mode (tạm nghỉ) ends; absent when they are
        not away. Until then an offer, an accept or a COD request on their
        listings answers 409 seller_away.
ReplyTime:
  type: string
  enum: [minutes, hour, hours, day]
  description: |
    How soon the seller usually answers someone who writes about one of
    their listings: the median wait over the answers of the last 30 days.
    A wait starts at the other person's first message after the seller's
    last one, when that came at least an hour before, or at the first
    message of the conversation; the seller's next message ends it. minutes
    is within 10 minutes, hour within an hour, hours within 6 hours and day
    within 24 hours. Absent with fewer than 5 answers in the 30 days, or a
    median over a day.
SellerViewer:
  type: object
  additionalProperties: false
  required: [blocked, following]
  description: |
    The reader's ties to the seller, sent when the reader is signed in and
    is not the seller.
  properties:
    blocked:
      type: boolean
      description: Whether either of the two blocks the other.
    following:
      type: boolean
      description: Whether the reader follows the seller.
    conversation_id:
      type: string
      format: uuid
      description: The reader's conversation with the seller; absent when there is none.
