ListingReadRequest:
  type: object
  additionalProperties: false
  description: What to read, exactly one of video, photo or link, with transcript only beside video.
  oneOf:
    - required: [video]
    - required: [photo]
    - required: [link]
  dependentRequired:
    transcript: [video]
  properties:
    video:
      type: string
      format: uuid
      description: A video upload of the caller's (video/mp4 or video/quicktime), uploaded and not read yet.
    transcript:
      type: string
      maxLength: 1000
      description: |
        What the phone's speech recognizer heard while the video was filmed,
        taken as the seller's words. Blank or absent, the server hears the
        video's sound. Never stored past the read, logged or returned.
    photo:
      type: string
      format: uuid
      description: |
        A photo upload of the caller's, uploaded and not yet in a listing:
        the cover. The read does not take it; post it in the listing.
    link:
      type: string
      maxLength: 2048
      description: The link the seller pasted to their own listing on Chợ Tốt.
ListingRead:
  type: object
  additionalProperties: false
  required: [id, source, status, expires_at]
  description: |
    A read of a seller's video, photo or listing on Chợ Tốt into a listing
    draft. Fields fill in as its steps finish: photos after the frames step
    of a video or the copy step of a link, draft when the read is done. A
    field not reached yet is absent, and so is a field of another source. A
    video is deleted when its read ends; the read is kept 24 hours. GET
    /v1/listing-reads/{id}/events streams the title and description while
    the model writes them.
  properties:
    id:
      type: string
      format: uuid
    source:
      type: string
      enum: [video, photo, link]
    status:
      type: string
      enum: [reading, done, failed]
    failure:
      type: string
      enum: [unreadable, video_too_short, video_too_long, listing_not_found, no_item, unavailable]
      description: |
        Only when status is failed. unreadable: no picture could be read;
        video_too_short and video_too_long: under 3 s or over 35 s;
        listing_not_found: Chợ Tốt has no such listing on sale, or none of
        its photos could be copied; no_item: no single item for sale;
        unavailable: the models or Chợ Tốt did not answer in time, try again.
    failure_reason:
      type: string
      maxLength: 300
      description: |
        Only when status is failed, and only when there is one: why, in a
        Vietnamese sentence for the seller. For no_item it is the model's
        own reason; for unavailable, the error the model gave or what went
        wrong asking it. Show it under the failure's own words.
    link:
      $ref: "#/LinkSource"
    photos:
      type: array
      maxItems: 10
      description: |
        A video's clearest frames in time order (at most 8), a link's
        copies in the old listing's order, or the photo read.
      items:
        $ref: "#/ReadPhoto"
    draft:
      $ref: "#/ReadDraft"
    contact_removed:
      type: boolean
      description: A link read's; true when a phone number, Zalo or other contact was taken out of the description.
    expires_at:
      type: string
      format: date-time
ReadPhoto:
  type: object
  additionalProperties: false
  required: [upload_id, url]
  properties:
    upload_id:
      type: string
      format: uuid
      description: A photo upload of the caller's; post it in a listing's photos.
    url:
      type: string
      format: uri
      description: Where to read the JPEG, for one hour after this response.
    at_seconds:
      type: number
      minimum: 0
      description: A video's frames only.
ReadDraft:
  type: object
  additionalProperties: false
  required: [title, category_code, condition, specs, description, price, allow_offers, photos]
  description: |
    ListingInput's fields as the read filled them. The model writes only
    the title and the description; catalog guesses the category from them.
    The seller adds the price, the category's specs (its spec_labels) and
    commune_code (and gps when allowed), then posts it to POST /v1/listings.
  properties:
    title:
      type: string
      maxLength: 70
    category_code:
      type: string
      description: A subcategory code, or empty when none was found.
    condition:
      $ref: "catalog.yaml#/Condition"
      description: Always used; the seller changes it.
    specs:
      type: array
      maxItems: 0
      description: Always empty; the seller fills the category's specs.
      items:
        $ref: "catalog.yaml#/Spec"
    description:
      type: string
      maxLength: 1500
      description: The seller's own words, restated, or for a photo read what the photo shows; empty when there is nothing.
    price:
      type: [integer, "null"]
      format: int64
      description: A link read's price on Chợ Tốt; null for the others.
    allow_offers:
      type: boolean
      description: Always false; the seller sets it.
    photos:
      type: array
      minItems: 1
      maxItems: 10
      description: |
        Upload IDs of the draft's photos, the cover first: a video read's
        sharpest frame then the others in time order (at most 6), a photo
        read's photo, or a link read's copies (at most 10).
      items:
        type: string
        format: uuid
PriceEstimate:
  type: object
  additionalProperties: false
  required: [low, median, high, source, sample_size]
  properties:
    low:
      type: integer
      format: int64
    median:
      type: integer
      format: int64
    high:
      type: integer
      format: int64
    source:
      type: string
      enum: [market, model]
      description: market is similar listings on the platform; model is the AI's own guess.
    sample_size:
      type: integer
      minimum: 0
      description: Listings behind a market range; 0 for model.
PriceGuideRequest:
  type: object
  additionalProperties: false
  required: [title, category_code, condition, commune_code]
  description: The draft as it stands in the Giá step; ListingInput's fields that price an item.
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 70
    category_code:
      type: string
      description: A subcategory code.
    condition:
      $ref: "catalog.yaml#/Condition"
    specs:
      type: array
      maxItems: 20
      items:
        $ref: "catalog.yaml#/Spec"
    description:
      type: string
      maxLength: 1500
    commune_code:
      type: string
      description: The listing's commune; distances and watch areas are measured from its point.
    photos:
      type: array
      maxItems: 3
      uniqueItems: true
      description: The caller's waiting photo uploads, the cover first. Without photos the text alone is compared.
      items:
        type: string
        format: uuid
PriceGuide:
  type: object
  additionalProperties: false
  required: [estimate, suggestions, similar, sold_prices, live_prices, watchers]
  properties:
    estimate:
      description: The range of the listings most like the draft; null under 5 of them or when the comparison failed.
      anyOf:
        - $ref: "#/PriceEstimate"
        - type: "null"
    suggestions:
      type: array
      maxItems: 2
      description: fast before market; empty under 3 sold listings. fast is left out unless it is below market.
      items:
        $ref: "#/PriceSuggestion"
    similar:
      type: array
      maxItems: 12
      description: The most similar listings first, sold within 180 days or on sale and published within 90.
      items:
        $ref: "#/SimilarListing"
    sold_prices:
      type: array
      description: The prices of the compared listings that sold, ascending.
      items:
        type: integer
        format: int64
    live_prices:
      type: array
      description: The prices of the compared listings on sale, ascending.
      items:
        type: integer
        format: int64
    watchers:
      type: array
      maxItems: 200
      description: |
        One row per search watch, muted ones too, that a listing of this
        draft would match by category, condition, area and words. The app
        counts the rows whose price range holds its price and whose
        offers_only its offers switch allows.
      items:
        $ref: "#/Watcher"
PriceSuggestion:
  type: object
  additionalProperties: false
  required: [kind, price, days]
  properties:
    kind:
      type: string
      enum: [fast, market]
    price:
      type: integer
      format: int64
    days:
      type: integer
      minimum: 1
      description: The median whole days from publication to sale at this price.
SimilarListing:
  type: object
  additionalProperties: false
  required: [listing_id, title, cover_url, price, condition, sold, km]
  properties:
    listing_id:
      type: string
      format: uuid
    title:
      type: string
    cover_url:
      type: string
    price:
      type: integer
      format: int64
    condition:
      $ref: "catalog.yaml#/Condition"
    sold:
      type: boolean
    km:
      type: integer
      minimum: 0
      description: Whole kilometres from the draft's commune.
    days_to_sell:
      type: integer
      minimum: 1
      description: Sold listings only.
Watcher:
  type: object
  additionalProperties: false
  required: [offers_only]
  properties:
    price_min:
      type: integer
      format: int64
    price_max:
      type: integer
      format: int64
    offers_only:
      type: boolean
LinkRequest:
  type: object
  additionalProperties: false
  required: [url]
  properties:
    url:
      type: string
      maxLength: 2048
      description: The link the seller pasted to their own listing.
LinkPreview:
  type: object
  additionalProperties: false
  required: [site, url, title, price, cover_url, photo_count]
  properties:
    site:
      type: string
      enum: [chotot.com]
    url:
      type: string
      format: uri
      description: The link without what tracks the share, as https://www.chotot.com/<list id>.htm.
    title:
      type: string
      description: The listing's title as Chợ Tốt shows it.
    price:
      type: [integer, "null"]
      format: int64
      description: Whole đồng; null when the listing has no price between 10,000 and 1,000,000,000.
    cover_url:
      type: string
      format: uri
      description: The listing's first photo on Chợ Tốt's CDN.
    photo_count:
      type: integer
      minimum: 1
LinkSource:
  type: object
  description: A link read's listing.
  additionalProperties: false
  required: [site, url]
  properties:
    site:
      type: string
      enum: [chotot.com]
    url:
      type: string
      format: uri
      description: The old listing, for the seller's "Từ tin Chợ Tốt của bạn" line; only the seller sees it.
    photo_count:
      type: integer
      minimum: 1
      description: Photos on the old listing; set after the read step.
ReadText:
  type: object
  additionalProperties: false
  required: [title, description]
  description: The title and description so far, each time whole; a retried step starts them again.
  properties:
    title:
      type: string
      maxLength: 70
    description:
      type: string
      maxLength: 1500
