VideoReadRequest:
  type: object
  additionalProperties: false
  required: [video]
  properties:
    video:
      type: string
      format: uuid
      description: A video upload of the caller's (video/mp4 or video/quicktime), uploaded and not read yet.
ListingReadRequest:
  description: What to read, one of a video, a photo or a link.
  oneOf:
    - $ref: "#/VideoReadRequest"
    - $ref: "#/LinkReadRequest"
LinkReadRequest:
  type: object
  additionalProperties: false
  required: [link]
  properties:
    link:
      type: string
      maxLength: 2048
      description: The link the seller pasted to their own listing on Chợ Tốt.
ListingRead:
  type: object
  additionalProperties: false
  required: [id, source, status, expires_at]
  description: |
    A read of a seller's video, photo or listing on Chợ Tốt into a listing
    draft. Fields fill in as its steps finish: photos after the frames step
    of a video or the copy step of a link, draft after the fill, estimate
    when the read is done. A field not reached yet is absent, and so is a
    field of another source. A video is deleted when its read ends; the read
    is kept 24 hours.
  properties:
    id:
      type: string
      format: uuid
    source:
      type: string
      enum: [video, link]
    status:
      type: string
      enum: [reading, done, failed]
    failure:
      type: string
      enum: [unreadable, video_too_short, video_too_long, listing_not_found, no_item, unavailable]
      description: |
        Only when status is failed. unreadable: no picture could be read;
        video_too_short and video_too_long: under 3 s or over 35 s;
        listing_not_found: Chợ Tốt has no such listing on sale, or none of
        its photos could be copied; no_item: no single item for sale;
        unavailable: the models or Chợ Tốt did not answer in time, try again.
    link:
      $ref: "#/LinkSource"
    photos:
      type: array
      maxItems: 10
      description: |
        A video's clearest frames in time order (at most 8), or a link's
        copies in the old listing's order.
      items:
        $ref: "#/ReadPhoto"
    draft:
      $ref: "#/ReadDraft"
    contact_removed:
      type: boolean
      description: A link read's; true when a phone number, Zalo or other contact was taken out of the description.
    estimate:
      description: Only when status is done; null when neither the market nor the model gave a range.
      anyOf:
        - $ref: "#/PriceEstimate"
        - type: "null"
    expires_at:
      type: string
      format: date-time
ReadPhoto:
  type: object
  additionalProperties: false
  required: [upload_id, url]
  properties:
    upload_id:
      type: string
      format: uuid
      description: A photo upload of the caller's; post it in a listing's photos.
    url:
      type: string
      format: uri
      description: Where to read the JPEG, for one hour after this response.
    at_seconds:
      type: number
      minimum: 0
      description: A video's frames only.
ReadDraft:
  type: object
  additionalProperties: false
  required: [title, category_code, condition, specs, description, price, allow_offers, photos]
  description: |
    ListingDraft's fields as the AI filled them. Add commune_code (and gps
    when allowed) and post it to POST /v1/listings. A field with a value is
    one the AI filled.
  properties:
    title:
      type: string
      maxLength: 70
    category_code:
      type: string
      description: A subcategory code, or empty when none was found.
    condition:
      $ref: "catalog.yaml#/Condition"
    specs:
      type: array
      maxItems: 20
      items:
        $ref: "catalog.yaml#/Spec"
    description:
      type: string
      maxLength: 1500
      description: The seller's own words, restated; empty when they said nothing.
    price:
      type: [integer, "null"]
      format: int64
      description: Whole đồng the seller said; null when they named no price.
    allow_offers:
      type: boolean
      description: True when the seller said the price is negotiable.
    photos:
      type: array
      minItems: 1
      maxItems: 10
      description: |
        Upload IDs of the draft's photos, the cover first: a video read's
        kept frames (at most 6) or a link read's copies (at most 10).
      items:
        type: string
        format: uuid
PriceEstimate:
  type: object
  additionalProperties: false
  required: [low, median, high, source, sample_size]
  properties:
    low:
      type: integer
      format: int64
    median:
      type: integer
      format: int64
    high:
      type: integer
      format: int64
    source:
      type: string
      enum: [market, model]
      description: market is similar listings on the platform; model is the AI's own guess.
    sample_size:
      type: integer
      minimum: 0
      description: Listings behind a market range; 0 for model.
LinkRequest:
  type: object
  additionalProperties: false
  required: [url]
  properties:
    url:
      type: string
      maxLength: 2048
      description: The link the seller pasted to their own listing.
LinkPreview:
  type: object
  additionalProperties: false
  required: [site, url, title, price, cover_url, photo_count]
  properties:
    site:
      type: string
      enum: [chotot.com]
    url:
      type: string
      format: uri
      description: The link without what tracks the share, as https://www.chotot.com/<list id>.htm.
    title:
      type: string
      description: The listing's title as Chợ Tốt shows it.
    price:
      type: [integer, "null"]
      format: int64
      description: Whole đồng; null when the listing has no price between 10,000 and 1,000,000,000.
    cover_url:
      type: string
      format: uri
      description: The listing's first photo on Chợ Tốt's CDN.
    photo_count:
      type: integer
      minimum: 1
LinkSource:
  type: object
  description: A link read's listing.
  additionalProperties: false
  required: [site, url]
  properties:
    site:
      type: string
      enum: [chotot.com]
    url:
      type: string
      format: uri
      description: The old listing, for the seller's "Từ tin Chợ Tốt của bạn" line; only the seller sees it.
    photo_count:
      type: integer
      minimum: 1
      description: Photos on the old listing; set after the read step.
