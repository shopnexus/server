AIProviderMode:
  type: string
  description: pick keeps the models an admin added; sync lists the provider's models every 6 hours and adds the new ones, with no tags.
  enum: [pick, sync]
AIProvider:
  type: object
  additionalProperties: false
  description: A provider, a LiteLLM credential. Each of its models is a deployment of every agent alias that runs on it, with the provider's weight and order.
  required: [id, name, kind, weight, order, mode, enabled, models]
  properties:
    id:
      type: string
      description: The LiteLLM credential name.
    name:
      type: string
    kind:
      type: string
      description: LiteLLM's provider route, such as openai, anthropic or openrouter.
    base_url:
      type: string
    key_hint:
      type: string
      description: The key as LiteLLM shows it, masked. The key itself never comes back.
    weight:
      type: number
      minimum: 0
      description: The provider's share of calls among providers of the same order.
    order:
      type: integer
      minimum: 1
      description: Lower is tried first; a higher order is the fallback.
    mode:
      $ref: "#/AIProviderMode"
    enabled:
      type: boolean
      description: The provider serves the agents' aliases; a provider turned off keeps its models and serves none.
    models:
      type: array
      items:
        type: string
    synced_at:
      type: string
      format: date-time
      description: The last sync, for a provider in sync mode.
AIProviderList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/AIProvider"
AIProviderNew:
  type: object
  additionalProperties: false
  required: [id, kind, api_key]
  properties:
    id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,40}$"
    name:
      type: string
      maxLength: 100
    kind:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,30}$"
    base_url:
      type: string
      format: uri
      maxLength: 500
    api_key:
      type: string
      minLength: 1
      maxLength: 1000
      writeOnly: true
    weight:
      type: number
      minimum: 0
    order:
      type: integer
      minimum: 1
    mode:
      $ref: "#/AIProviderMode"
AIProviderPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      maxLength: 100
    base_url:
      type: string
      maxLength: 500
    api_key:
      type: string
      minLength: 1
      maxLength: 1000
      writeOnly: true
    weight:
      type: number
      minimum: 0
    order:
      type: integer
      minimum: 1
    mode:
      $ref: "#/AIProviderMode"
    enabled:
      type: boolean
      description: false takes the provider out of every alias (ai_provider_in_use when it is an agent's model's only one).
AIProviderModelNew:
  type: object
  additionalProperties: false
  required: [model]
  properties:
    model:
      type: string
      minLength: 1
      maxLength: 200
      description: The model as the provider names it, without LiteLLM's route.
    input_cost_per_mtok:
      type: number
      minimum: 0
      description: USD per million input tokens, for LiteLLM's spend.
    output_cost_per_mtok:
      type: number
      minimum: 0
AIProviderTestRequest:
  type: object
  additionalProperties: false
  properties:
    model:
      type: string
      maxLength: 200
      description: The model to call; the first of the provider's list when left out.
AIProviderTest:
  type: object
  additionalProperties: false
  required: [ok, latency_ms]
  properties:
    ok:
      type: boolean
    model:
      type: string
    error:
      type: string
      description: The provider's error as LiteLLM gives it.
    latency_ms:
      type: integer
AITag:
  type: object
  additionalProperties: false
  required: [name, kind]
  properties:
    name:
      type: string
    kind:
      type: string
      enum: [type, capability]
AINamed:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string
AIAgentRef:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
AIModel:
  type: object
  additionalProperties: false
  required: [model, tags, providers, agents]
  properties:
    model:
      type: string
    tags:
      type: array
      items:
        type: string
    providers:
      type: array
      items:
        $ref: "#/AINamed"
    agents:
      type: array
      description: The agents that run on the model.
      items:
        $ref: "#/AIAgentRef"
    input_cost_per_mtok:
      type: number
    output_cost_per_mtok:
      type: number
    context_tokens:
      type: integer
      description: The input tokens LiteLLM's model info gives the model.
AIModelList:
  type: object
  additionalProperties: false
  required: [items, tags]
  properties:
    items:
      type: array
      items:
        $ref: "#/AIModel"
    tags:
      type: array
      description: Every tag, in order.
      items:
        $ref: "#/AITag"
AIModelTagsRequest:
  type: object
  additionalProperties: false
  required: [model, tags]
  properties:
    model:
      type: string
      minLength: 1
      maxLength: 200
      description: The model, which may hold a slash (baai/bge-m3).
    tags:
      type: array
      maxItems: 20
      items:
        type: string
AIModelTags:
  type: object
  additionalProperties: false
  required: [model, tags]
  properties:
    model:
      type: string
    tags:
      type: array
      items:
        type: string
AIAgentLimits:
  type: object
  additionalProperties: false
  description: >-
    A console agent's limits, sent to the agent service with each turn: the deadline (10 to 300 s, 60 by
    default), the model calls of a run segment, the context window, each tool call's time limit and attempts,
    and an answer's tokens; a field left out takes the agent service's default. An app agent's timeout_s is its
    call's time limit.
  properties:
    deadline_s:
      type: integer
      minimum: 10
      maximum: 300
    max_model_calls:
      type: integer
      minimum: 1
    context_window:
      type: integer
      minimum: 1
    tool_timeout_s:
      type: integer
      minimum: 1
    tool_attempts:
      type: integer
      minimum: 1
    max_tokens:
      type: integer
      minimum: 1
    timeout_s:
      type: integer
      minimum: 1
AIAgent:
  type: object
  additionalProperties: false
  required: [id, kind, name, alias, icon, purpose, required_tags, model, instructions_version, tools, limits, enabled, updated_at]
  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      description: app agents are called by the server's code; console agents run in the agent service.
      enum: [app, console]
    name:
      type: string
    alias:
      type: string
      description: The model name sent to LiteLLM; shown nowhere else.
    icon:
      type: string
    purpose:
      type: string
    required_tags:
      type: array
      items:
        type: string
    model:
      type: string
    instructions:
      type: string
      description: A console agent's instructions.
    instructions_version:
      type: integer
    tools:
      type: array
      description: The MCP tools a console agent may call.
      items:
        type: string
    limits:
      $ref: "#/AIAgentLimits"
    monthly_budget_usd:
      type: number
    enabled:
      type: boolean
    updated_by:
      type: string
      format: uuid
    updated_at:
      type: string
      format: date-time
AIAgentList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/AIAgent"
AIAgentNew:
  type: object
  additionalProperties: false
  required: [name, alias, model]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
    alias:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    icon:
      type: string
      maxLength: 40
    purpose:
      type: string
      maxLength: 500
    required_tags:
      type: array
      maxItems: 10
      items:
        type: string
    model:
      type: string
      minLength: 1
      maxLength: 200
    instructions:
      type: string
      maxLength: 20000
    tools:
      type: array
      maxItems: 50
      items:
        type: string
    limits:
      $ref: "#/AIAgentLimits"
    monthly_budget_usd:
      type: number
      minimum: 0
    enabled:
      type: boolean
AIAgentPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  description: An app agent takes model, limits and monthly_budget_usd only (else ai_agent_app_fixed).
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
    icon:
      type: string
      maxLength: 40
    purpose:
      type: string
      maxLength: 500
    required_tags:
      type: array
      maxItems: 10
      items:
        type: string
    model:
      type: string
      minLength: 1
      maxLength: 200
    instructions:
      type: string
      maxLength: 20000
    tools:
      type: array
      maxItems: 50
      items:
        type: string
    limits:
      $ref: "#/AIAgentLimits"
    monthly_budget_usd:
      type: [number, "null"]
      minimum: 0
      description: null takes the budget away.
    enabled:
      type: boolean
AIAgentVersion:
  type: object
  additionalProperties: false
  required: [version, instructions, created_at]
  properties:
    version:
      type: integer
    instructions:
      type: string
    created_by:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
AIAgentVersionList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      description: Newest first.
      items:
        $ref: "#/AIAgentVersion"
AIRoutingStrategy:
  type: string
  description: LiteLLM's routing strategy. simple-shuffle picks by the providers' weights.
  enum: [simple-shuffle, least-busy, latency-based-routing, usage-based-routing-v2]
AIRotation:
  type: object
  additionalProperties: false
  required: [routing_strategy, num_retries, allowed_fails, cooldown_s, timeout_s]
  properties:
    routing_strategy:
      type: string
    num_retries:
      type: integer
    allowed_fails:
      type: integer
      description: Failures in a minute before a deployment cools down.
    cooldown_s:
      type: number
    timeout_s:
      type: number
AIRotationPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    routing_strategy:
      $ref: "#/AIRoutingStrategy"
    num_retries:
      type: integer
      minimum: 0
      maximum: 10
    allowed_fails:
      type: integer
      minimum: 0
      maximum: 100
    cooldown_s:
      type: number
      minimum: 0
      maximum: 3600
    timeout_s:
      type: number
      minimum: 1
      maximum: 600
AIAgentBudget:
  type: object
  additionalProperties: false
  required: [agent_id, name, kind, spent_usd]
  properties:
    agent_id:
      type: string
      format: uuid
    name:
      type: string
    kind:
      type: string
      enum: [app, console]
    monthly_budget_usd:
      type: number
    spent_usd:
      type: number
      description: Spent in the budget's current period, as LiteLLM counts it.
AIRoleBudgets:
  type: object
  additionalProperties: false
  description: The daily budget of a moderator and of an admin through the console agents; none when left out.
  properties:
    moderator:
      type: number
    admin:
      type: number
AIMemberBudget:
  type: object
  additionalProperties: false
  required: [member_id, daily_usd]
  properties:
    member_id:
      type: string
      format: uuid
    daily_usd:
      type: number
      minimum: 0
AIBudgets:
  type: object
  additionalProperties: false
  required: [agents]
  properties:
    agents:
      type: array
      items:
        $ref: "#/AIAgentBudget"
    monthly_cap_usd:
      type: number
      description: The cap on the month's spend of every agent (UTC month).
    month_spent_usd:
      type: number
    alert_pct:
      type: integer
    on_cap:
      type: string
      description: stop_agents refuses console turns once the month's spend reaches the cap; alert_only only alerts.
      enum: [stop_agents, alert_only]
    alerting:
      type: boolean
      description: The month's spend is at or past alert_pct of the cap.
    capped:
      type: boolean
      description: The month's spend is at or past the cap.
    member_daily_usd:
      $ref: "#/AIRoleBudgets"
    overrides:
      type: array
      description: Members with a daily budget of their own, in place of their role's.
      items:
        $ref: "#/AIMemberBudget"
AIBudgetsPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    agents:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required: [agent_id, monthly_budget_usd]
        properties:
          agent_id:
            type: string
            format: uuid
          monthly_budget_usd:
            type: [number, "null"]
            minimum: 0
    monthly_cap_usd:
      type: [number, "null"]
      minimum: 0
    alert_pct:
      type: integer
      minimum: 1
      maximum: 100
    on_cap:
      type: string
      enum: [stop_agents, alert_only]
    member_daily_usd:
      type: object
      additionalProperties: false
      description: A role's daily budget; null or 0 takes it away.
      properties:
        moderator:
          type: [number, "null"]
          minimum: 0
        admin:
          type: [number, "null"]
          minimum: 0
    overrides:
      type: array
      description: Every member's own daily budget; replaces the list.
      maxItems: 200
      items:
        $ref: "#/AIMemberBudget"
AISpend:
  type: object
  additionalProperties: false
  required: [range, start, end, total_usd, days, members]
  properties:
    range:
      type: string
      enum: [7d, 30d, 90d]
    start:
      type: string
      format: date
    end:
      type: string
      format: date
    total_usd:
      type: number
    days:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [date, total_usd, agents]
        properties:
          date:
            type: string
            format: date
          total_usd:
            type: number
          agents:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [agent_id, usd]
              properties:
                agent_id:
                  type: string
                  format: uuid
                usd:
                  type: number
    members:
      type: array
      description: Each member's spend through the console agents (LiteLLM's end users) and questions, most spent first.
      items:
        type: object
        additionalProperties: false
        required: [member_id, display_name, usd, requests]
        properties:
          member_id:
            type: string
            format: uuid
          display_name:
            type: string
          usd:
            type: number
          requests:
            type: integer
AIProviderModelList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [model, added]
        properties:
          model:
            type: string
          tags:
            type: array
            items:
              type: string
          input_cost_per_mtok:
            type: number
          output_cost_per_mtok:
            type: number
          context_tokens:
            type: integer
          added:
            type: boolean
            description: The model is in the provider's list.
AIProviderHealthList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [id, requests_24h, share_pct, success_pct, p50_ms]
        properties:
          id:
            type: string
          requests_24h:
            type: integer
          share_pct:
            type: number
          success_pct:
            type: number
          p50_ms:
            type: integer
          cooling_until:
            type: string
            format: date-time
          last_error:
            type: string
AIDayCount:
  type: object
  additionalProperties: false
  required: [date, requests]
  properties:
    date:
      type: string
      format: date
    requests:
      type: integer
AIAgentUsageList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [agent_id, requests, days]
        properties:
          agent_id:
            type: string
            format: uuid
          requests:
            type: integer
          days:
            type: array
            items:
              $ref: "#/AIDayCount"
AIToolStats:
  type: object
  additionalProperties: false
  required: [items, recent]
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [name, display_name, calls, failed, days]
        properties:
          name:
            type: string
          display_name:
            type: string
            description: The tool's title.
          calls:
            type: integer
          failed:
            type: integer
          p50_ms:
            type: integer
          days:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [date, calls]
              properties:
                date:
                  type: string
                  format: date
                calls:
                  type: integer
    recent:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [call_id, turn_id, tool, label, status, at]
        properties:
          call_id:
            type: string
            format: uuid
          turn_id:
            type: string
            format: uuid
          member_id:
            type: string
            format: uuid
          tool:
            type: string
          label:
            type: string
          duration_ms:
            type: integer
          status:
            type: string
          at:
            type: string
            format: date-time
AIGuardrailStats:
  type: object
  additionalProperties: false
  required: [items, recent]
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [rule, count]
        properties:
          rule:
            type: string
          count:
            type: integer
    recent:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [rule, detail, at]
        properties:
          rule:
            type: string
          detail:
            type: string
          member_id:
            type: string
            format: uuid
          turn_id:
            type: string
            format: uuid
          at:
            type: string
            format: date-time
