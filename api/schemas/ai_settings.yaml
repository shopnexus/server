AIProviderStatus:
  type: string
  description: >-
    unknown with no request in the last hour; down when Bifrost marks the provider's status error, or when
    error_share_1h is at least 0.5 over at least 5 requests; degraded when it is at least 0.05 over at least 20
    requests; else ok.
  enum: [ok, degraded, down, unknown]
AIProvider:
  type: object
  additionalProperties: false
  description: A provider Bifrost runs from its config.json; a new one or a new key is an infra change.
  required: [name, kind, status, error_share_1h, requests_1h, model_count]
  properties:
    name:
      type: string
      description: The provider's name in Bifrost, the prefix of its models (upstream/claude-sonnet-5-5).
    kind:
      type: string
      description: A built-in provider's name, such as openrouter, or custom.
    base_host:
      type: string
      description: The host of the provider's base URL, when it has one.
    status:
      $ref: "#/AIProviderStatus"
    error_share_1h:
      type: number
      minimum: 0
      maximum: 1
      description: The share of the last hour's requests that failed.
    requests_1h:
      type: integer
      description: The requests of the last hour.
    model_count:
      type: integer
      description: The models of the provider's catalog in Bifrost.
AIProviderList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/AIProvider"
AIPrice:
  type: object
  additionalProperties: false
  description: USD per token. A null cache price is the input price.
  required: [input, output, cache_read, cache_write]
  properties:
    input:
      type: number
    output:
      type: number
    cache_read:
      type: [number, "null"]
    cache_write:
      type: [number, "null"]
AIProviderModel:
  type: object
  additionalProperties: false
  required: [model_id]
  properties:
    model_id:
      type: string
      description: The model as the provider names it, without the provider's prefix.
    catalog_price:
      $ref: "#/AIPrice"
    max_input_tokens:
      type: integer
AIProviderModelList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/AIProviderModel"
AIModelRef:
  type: object
  additionalProperties: false
  description: A provider's model, which callers send Bifrost as provider/model_id.
  required: [provider, model_id]
  properties:
    provider:
      type: string
      minLength: 1
      maxLength: 63
    model_id:
      type: string
      minLength: 1
      maxLength: 200
AITag:
  type: object
  additionalProperties: false
  required: [name, kind]
  properties:
    name:
      type: string
    kind:
      type: string
      enum: [type, capability]
AIAgentRef:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
AIModel:
  type: object
  additionalProperties: false
  required: [provider, model_id, tags, price, catalog_price, agents]
  properties:
    provider:
      type: string
    model_id:
      type: string
    tags:
      type: array
      items:
        type: string
    price:
      description: The model's price; null until an admin sets one, and an agent cannot run on it before.
      anyOf:
        - $ref: "#/AIPrice"
        - type: "null"
    catalog_price:
      description: The list price of the provider's catalog in Bifrost; null where the catalog has none.
      anyOf:
        - $ref: "#/AIPrice"
        - type: "null"
    agents:
      type: array
      description: The agents that use the model, as their model or a fallback.
      items:
        $ref: "#/AIAgentRef"
AIModelList:
  type: object
  additionalProperties: false
  required: [items, tags]
  properties:
    items:
      type: array
      items:
        $ref: "#/AIModel"
    tags:
      type: array
      description: Every tag, in order.
      items:
        $ref: "#/AITag"
AIModelTags:
  type: object
  additionalProperties: false
  required: [provider, model_id, tags]
  properties:
    provider:
      type: string
      minLength: 1
      maxLength: 63
    model_id:
      type: string
      minLength: 1
      maxLength: 200
    tags:
      type: array
      maxItems: 20
      items:
        type: string
AIModelPrice:
  type: object
  additionalProperties: false
  description: A model's price in USD per token; a negative one is refused (ai_price_invalid).
  required: [provider, model_id, input, output]
  properties:
    provider:
      type: string
      minLength: 1
      maxLength: 63
    model_id:
      type: string
      minLength: 1
      maxLength: 200
    input:
      type: number
    output:
      type: number
    cache_read:
      type: [number, "null"]
      description: Null or left out is the input price.
    cache_write:
      type: [number, "null"]
      description: Null or left out is the input price.
AIAgentLimits:
  type: object
  additionalProperties: false
  description: >-
    A console agent's limits, sent to the agent service with each turn: the deadline (10 to 300 s, 60 by
    default), the model calls of a run segment, the context window, each tool call's time limit and attempts,
    and an answer's tokens; a field left out takes the agent service's default. An app agent's timeout_s is its
    call's time limit.
  properties:
    deadline_s:
      type: integer
      minimum: 10
      maximum: 300
    max_model_calls:
      type: integer
      minimum: 1
    context_window:
      type: integer
      minimum: 1
    tool_timeout_s:
      type: integer
      minimum: 1
    tool_attempts:
      type: integer
      minimum: 1
    max_tokens:
      type: integer
      minimum: 1
    timeout_s:
      type: integer
      minimum: 1
AIAgentCaller:
  type: object
  additionalProperties: false
  description: >-
    One virtual key of an agent, named after the code that calls it, with its rate limits per minute; null is
    no limit.
  required: [name, requests_per_min, tokens_per_min]
  properties:
    name:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    requests_per_min:
      type: [integer, "null"]
      minimum: 1
    tokens_per_min:
      type: [integer, "null"]
      minimum: 1
AIAgent:
  type: object
  additionalProperties: false
  required: [id, kind, name, slug, icon, purpose, required_tags, model, fallbacks, instructions_version, capabilities, limits,
    monthly_budget_usd, budget_spent_usd, budget_resets_at, callers, enabled, updated_at]
  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      description: app agents are called by the server's code; console agents run in the agent service.
      enum: [app, console]
    name:
      type: string
    slug:
      type: string
      description: The agent's stable name, its team's in Bifrost; set once.
    icon:
      type: string
    purpose:
      type: string
    required_tags:
      type: array
      items:
        type: string
    model:
      $ref: "#/AIModelRef"
    fallbacks:
      type: array
      description: The models Bifrost tries in order when the model fails.
      items:
        $ref: "#/AIModelRef"
    instructions:
      type: string
      description: A console agent's instructions.
    instructions_version:
      type: integer
    capabilities:
      type: array
      description: >-
        What a console agent may do through the API: each capability grants the operations whose x-capability
        names it (GET /v1/console/agent/operations lists them). An operation that changes something still waits
        for a member's approval.
      items:
        type: string
    limits:
      $ref: "#/AIAgentLimits"
    monthly_budget_usd:
      type: [number, "null"]
      description: The agent's budget per UTC month; null for none.
    budget_spent_usd:
      type: [number, "null"]
      description: This month's spend, as Bifrost counts it; null with no budget or when Bifrost cannot be read.
    budget_resets_at:
      type: [string, "null"]
      format: date-time
      description: The 1st of next month (UTC), when the spend starts again; null as budget_spent_usd is.
    callers:
      type: array
      items:
        $ref: "#/AIAgentCaller"
    enabled:
      type: boolean
    updated_by:
      type: string
      format: uuid
    updated_at:
      type: string
      format: date-time
AIAgentList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/AIAgent"
AIAgentNew:
  type: object
  additionalProperties: false
  description: A console agent; its one caller is named after its slug.
  required: [name, slug, model]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
    slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    icon:
      type: string
      maxLength: 40
    purpose:
      type: string
      maxLength: 500
    required_tags:
      type: array
      maxItems: 10
      items:
        type: string
    model:
      $ref: "#/AIModelRef"
    fallbacks:
      type: array
      maxItems: 5
      items:
        $ref: "#/AIModelRef"
    instructions:
      type: string
      maxLength: 20000
    capabilities:
      type: array
      maxItems: 50
      items:
        type: string
    limits:
      $ref: "#/AIAgentLimits"
    monthly_budget_usd:
      type: number
      exclusiveMinimum: 0
    enabled:
      type: boolean
AIAgentPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  description: >-
    An app agent takes model, fallbacks, limits, monthly_budget_usd and callers only (else
    ai_agent_app_fixed).
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
    icon:
      type: string
      maxLength: 40
    purpose:
      type: string
      maxLength: 500
    required_tags:
      type: array
      maxItems: 10
      items:
        type: string
    model:
      $ref: "#/AIModelRef"
    fallbacks:
      type: array
      maxItems: 5
      items:
        $ref: "#/AIModelRef"
    instructions:
      type: string
      maxLength: 20000
    capabilities:
      type: array
      maxItems: 50
      items:
        type: string
    limits:
      $ref: "#/AIAgentLimits"
    monthly_budget_usd:
      type: [number, "null"]
      exclusiveMinimum: 0
      description: null takes the budget away.
    callers:
      type: array
      maxItems: 20
      description: >-
        Every caller of the agent, each once, with its new rate limits; only the limits change (else
        ai_agent_invalid).
      items:
        $ref: "#/AIAgentCaller"
    enabled:
      type: boolean
AIAgentVersion:
  type: object
  additionalProperties: false
  required: [version, instructions, created_at]
  properties:
    version:
      type: integer
    instructions:
      type: string
    created_by:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
AIAgentVersionList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      description: Newest first.
      items:
        $ref: "#/AIAgentVersion"
AISpend:
  type: object
  additionalProperties: false
  required: [days, lag_s]
  properties:
    days:
      type: array
      description: Each UTC day from from to to, oldest first.
      items:
        type: object
        additionalProperties: false
        required: [date, total_usd, by_agent]
        properties:
          date:
            type: string
            format: date
          total_usd:
            type: number
            description: Every call's cost, an agent's or not.
          by_agent:
            type: object
            description: Each agent's cost, by its slug.
            additionalProperties:
              type: number
    lag_s:
      type: integer
      description: How many seconds Bifrost's totals may trail real time.
AIDayCount:
  type: object
  additionalProperties: false
  required: [date, requests]
  properties:
    date:
      type: string
      format: date
    requests:
      type: integer
AIAgentUsageList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [agent_id, requests, days]
        properties:
          agent_id:
            type: string
            format: uuid
          requests:
            type: integer
          days:
            type: array
            items:
              $ref: "#/AIDayCount"
