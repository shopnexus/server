OTPSendRequest:
  type: object
  additionalProperties: false
  required: [kind, destination, purpose]
  properties:
    kind:
      type: string
      enum: [phone, email]
    destination:
      type: string
      minLength: 1
      maxLength: 254
      description: A Vietnamese mobile number in any common format, or an email address.
    purpose:
      type: string
      enum: [login]
OTPChallenge:
  type: object
  additionalProperties: false
  required: [challenge_id, resend_after]
  properties:
    challenge_id:
      type: string
      format: uuid
    resend_after:
      type: integer
      description: Seconds before another code may be requested for this destination.
