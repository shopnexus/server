SignInRequest:
  type: object
  additionalProperties: false
  required: [phone_token]
  properties:
    phone_token:
      type: string
      minLength: 1
      maxLength: 8192
      description: The token Firebase returned for the verified number.
    device_name:
      type: string
      maxLength: 100
      description: Shown in the list of signed-in devices.
Tokens:
  type: object
  additionalProperties: false
  required: [access_token, access_token_expires_at, refresh_token, token_type]
  properties:
    access_token:
      type: string
    access_token_expires_at:
      type: string
      format: date-time
    refresh_token:
      type: string
    token_type:
      type: string
      enum: [Bearer]
SignIn:
  type: object
  additionalProperties: false
  required: [access_token, access_token_expires_at, refresh_token, token_type, account]
  properties:
    access_token:
      type: string
    access_token_expires_at:
      type: string
      format: date-time
    refresh_token:
      type: string
    token_type:
      type: string
      enum: [Bearer]
    account:
      type: object
      additionalProperties: false
      required: [id, is_new]
      properties:
        id:
          type: string
          format: uuid
        is_new:
          type: boolean
          description: True when this sign-in created the account; the app then asks for a profile.
RefreshRequest:
  type: object
  additionalProperties: false
  required: [refresh_token]
  properties:
    refresh_token:
      type: string
      minLength: 1
      maxLength: 200
Session:
  type: object
  additionalProperties: false
  required: [id, device_name, created_at, last_used_at, current]
  properties:
    id:
      type: string
      format: uuid
    device_name:
      type: string
    created_at:
      type: string
      format: date-time
    last_used_at:
      type: string
      format: date-time
    current:
      type: boolean
      description: True for the session the request was made with.
SessionList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Session"
    next_cursor:
      type: string
      format: uuid
      description: Present when more sessions follow; pass it as cursor.
