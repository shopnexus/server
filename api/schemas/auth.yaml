SignInRequest:
  type: object
  additionalProperties: false
  description: Exactly one proof, phone_token, google_token or email_code, and the device's name.
  oneOf:
    - required: [phone_token]
    - required: [google_token]
    - required: [email_code]
  properties:
    phone_token:
      type: string
      minLength: 1
      maxLength: 8192
      description: The token Firebase returned for the verified number.
    google_token:
      type: string
      minLength: 1
      maxLength: 8192
      description: The ID token Credential Manager returned for the Google account; it proves the account's email.
    email_code:
      $ref: "#/EmailCodeProof"
    device_name:
      type: string
      maxLength: 100
      description: Shown in the list of signed-in devices.
ProofRequest:
  type: object
  additionalProperties: false
  description: |
    Exactly one proof, phone_token, google_token or email_code: the body of
    addMyIdentity and reauthenticateSession. SignInRequest repeats these
    three properties beside device_name, since kin-openapi's JSON Schema
    2020-12 compiler cannot follow this file's refs under allOf and
    unevaluatedProperties.
  oneOf:
    - required: [phone_token]
    - required: [google_token]
    - required: [email_code]
  properties:
    phone_token:
      type: string
      minLength: 1
      maxLength: 8192
      description: The token Firebase returned for the verified number.
    google_token:
      type: string
      minLength: 1
      maxLength: 8192
      description: The ID token Credential Manager returned for the Google account; it proves the account's email.
    email_code:
      $ref: "#/EmailCodeProof"
EmailCodeProof:
  type: object
  additionalProperties: false
  required: [challenge_id, code]
  properties:
    challenge_id:
      type: string
      format: uuid
    code:
      type: string
      pattern: "^[0-9]{6}$"
Tokens:
  type: object
  additionalProperties: false
  required: [access_token, access_token_expires_at, refresh_token, token_type]
  properties:
    access_token:
      type: string
    access_token_expires_at:
      type: string
      format: date-time
    refresh_token:
      type: string
    token_type:
      type: string
      enum: [Bearer]
AccessToken:
  type: object
  additionalProperties: false
  required: [access_token, access_token_expires_at, token_type]
  description: A new access token for the caller's session. The refresh token the app holds stays valid and is not replaced.
  properties:
    access_token:
      type: string
    access_token_expires_at:
      type: string
      format: date-time
    token_type:
      type: string
      enum: [Bearer]
SignIn:
  type: object
  additionalProperties: false
  required: [access_token, access_token_expires_at, refresh_token, token_type, account]
  properties:
    access_token:
      type: string
    access_token_expires_at:
      type: string
      format: date-time
    refresh_token:
      type: string
    token_type:
      type: string
      enum: [Bearer]
    account:
      type: object
      additionalProperties: false
      required: [id, is_new]
      properties:
        id:
          type: string
          format: uuid
        is_new:
          type: boolean
          description: True when this sign-in created the account; the app then asks for a profile.
RefreshRequest:
  type: object
  additionalProperties: false
  required: [refresh_token]
  properties:
    refresh_token:
      type: string
      minLength: 1
      maxLength: 200
Session:
  type: object
  additionalProperties: false
  required: [id, device_name, created_at, last_used_at, current]
  properties:
    id:
      type: string
      format: uuid
    device_name:
      type: string
    created_at:
      type: string
      format: date-time
    last_used_at:
      type: string
      format: date-time
    current:
      type: boolean
      description: True for the session the request was made with.
SessionList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Session"
    next_cursor:
      type: string
      format: uuid
      description: Present when more sessions follow; pass it as cursor.
EmailCodeRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      minLength: 3
      maxLength: 254
      description: Trimmed and lower-cased by the server.
EmailCode:
  type: object
  additionalProperties: false
  required: [challenge_id, expires_at, resend_at]
  properties:
    challenge_id:
      type: string
      format: uuid
      description: Sent back with the code.
    expires_at:
      type: string
      format: date-time
    resend_at:
      type: string
      format: date-time
      description: The first moment another code to this address is allowed.
