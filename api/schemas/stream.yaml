Update:
  type: object
  additionalProperties: false
  required: [seq, kind]
  description: A change for the caller, in their update log; IDs only.
  properties:
    seq:
      type: integer
      format: int64
      minimum: 1
    kind:
      type: string
      enum: [message, read, deal, notification, scam_warning, listing_read]
    conversation_id:
      type: string
      format: uuid
    message_id:
      type: string
      format: uuid
    deal_id:
      type: string
      format: uuid
    notification_id:
      type: string
      format: uuid
    listing_read_id:
      type: string
      format: uuid
UpdatePage:
  type: object
  additionalProperties: false
  required: [updates, seq, reset, has_more]
  properties:
    updates:
      type: array
      maxItems: 500
      items:
        $ref: "#/Update"
    seq:
      type: integer
      format: int64
      minimum: 0
      description: The caller's current seq.
    reset:
      type: boolean
    has_more:
      type: boolean
      description: More updates follow the last one; ask again from its seq.
DevUpdate:
  description: An update to log for the caller, with exactly the IDs its kind carries.
  oneOf:
    - type: object
      additionalProperties: false
      required: [kind, conversation_id, message_id]
      properties:
        kind:
          type: string
          enum: [message]
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
    - type: object
      additionalProperties: false
      required: [kind, conversation_id]
      properties:
        kind:
          type: string
          enum: [read]
        conversation_id:
          type: string
          format: uuid
    - type: object
      additionalProperties: false
      required: [kind, deal_id]
      properties:
        kind:
          type: string
          enum: [deal]
        deal_id:
          type: string
          format: uuid
    - type: object
      additionalProperties: false
      required: [kind, notification_id]
      properties:
        kind:
          type: string
          enum: [notification]
        notification_id:
          type: string
          format: uuid
    - type: object
      additionalProperties: false
      required: [kind, conversation_id]
      properties:
        kind:
          type: string
          enum: [scam_warning]
        conversation_id:
          type: string
          format: uuid
    - type: object
      additionalProperties: false
      required: [kind, listing_read_id]
      properties:
        kind:
          type: string
          enum: [listing_read]
        listing_read_id:
          type: string
          format: uuid
