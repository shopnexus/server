AgentSubjectKind:
  type: string
  description: The record a conversation is about.
  enum: [ticket, account]
AgentConversation:
  type: object
  additionalProperties: false
  required: [id, updated_at]
  properties:
    id:
      type: string
      format: uuid
    subject_kind:
      $ref: "#/AgentSubjectKind"
    subject_id:
      type: string
      format: uuid
    title:
      type: string
    updated_at:
      type: string
      format: date-time
AgentConversationList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/AgentConversation"
AgentConversationNew:
  type: object
  additionalProperties: false
  description: A record to talk about, subject_kind and subject_id together, or neither for a conversation of the caller's own.
  properties:
    subject_kind:
      $ref: "#/AgentSubjectKind"
    subject_id:
      type: string
      format: uuid
AgentConversationRename:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 80
AgentConversationDetail:
  type: object
  additionalProperties: false
  description: A conversation with its messages and turns, oldest first.
  required: [id, updated_at, messages, turns]
  properties:
    id:
      type: string
      format: uuid
    subject_kind:
      $ref: "#/AgentSubjectKind"
    subject_id:
      type: string
      format: uuid
    title:
      type: string
    updated_at:
      type: string
      format: date-time
    messages:
      type: array
      items:
        $ref: "#/AgentMessage"
    turns:
      type: array
      items:
        $ref: "#/AgentTurn"
AgentMessage:
  type: object
  additionalProperties: false
  description: |
    One message of a conversation's history, as the model reads it. A user
    message is what a member wrote, with context, the facts the server put
    in front of it (the time, the member, the conversation's record, the
    approvals decided since the last turn). An assistant message is the
    model's text, reasoning and the commands it ran (tool_calls); a tool
    message is what one of them printed.
  required: [seq, role]
  properties:
    seq:
      type: integer
      minimum: 1
    turn_id:
      type: string
      format: uuid
    role:
      type: string
      enum: [user, assistant, tool]
    context:
      type: string
    content:
      type: string
    reasoning:
      type: string
    tool_calls:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [id, name, input]
        properties:
          id:
            type: string
          name:
            type: string
          input:
            type: string
            description: The call's arguments as the model wrote them, a JSON object.
    tool_call_id:
      type: string
    is_error:
      type: boolean
AgentTurnStatus:
  type: string
  description: |
    A turn's status. running until its run ends: paused when a member
    paused it, stopped when one stopped it, succeeded when the agent
    answered, timed_out past its deadline, failed otherwise. Every status
    but running can take a new message; the conversation's last turn can
    also resume.
  enum: [running, paused, stopped, succeeded, failed, timed_out]
AgentRef:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string
AgentUsage:
  type: object
  additionalProperties: false
  required: [input_tokens, output_tokens, cached_tokens]
  properties:
    input_tokens:
      type: integer
      description: Every input token, the cached ones included.
    output_tokens:
      type: integer
    cached_tokens:
      type: integer
      description: The input read from the prompt cache.
AgentTurn:
  type: object
  additionalProperties: false
  description: A turn of a conversation, in it and from GET /v1/console/agent/turns/{id}.
  required: [id, conversation_id, member_id, agent, status, usage, last_seq, started_at]
  properties:
    id:
      type: string
      format: uuid
    conversation_id:
      type: string
      format: uuid
    member_id:
      type: string
      format: uuid
      description: The member who started it.
    agent:
      $ref: "#/AgentRef"
    model:
      type: string
      description: The model at the gateway, provider/model.
    status:
      $ref: "#/AgentTurnStatus"
    stop:
      type: string
      description: |
        Why the run ended without an error, as the runtime says: done,
        length (the answer hit the output limit), deadline, paused, stopped,
        loop (the same calls gave the same results three steps running),
        context_full, or budget (the model gateway refused: the agent's
        budget is spent, and the turn failed).
    error:
      type: string
      description: What went wrong, for a failed turn.
    usage:
      $ref: "#/AgentUsage"
    last_seq:
      type: integer
      description: The seq of its last event; 0 before the first.
    started_at:
      type: string
      format: date-time
    finished_at:
      type: string
      format: date-time
AgentQuestion:
  type: object
  additionalProperties: false
  required: [text]
  properties:
    text:
      type: string
      minLength: 1
      maxLength: 8000
    agent_id:
      type: string
      format: uuid
      description: A console agent from GET /v1/console/agents; the Console assistant when left out.
AgentTurnStarted:
  type: object
  additionalProperties: false
  required: [conversation_id, turn_id]
  properties:
    conversation_id:
      type: string
      format: uuid
    turn_id:
      type: string
      format: uuid
AgentTurnState:
  type: object
  additionalProperties: false
  description: The turn a control was taken for.
  required: [turn_id, status]
  properties:
    turn_id:
      type: string
      format: uuid
    status:
      $ref: "#/AgentTurnStatus"
AgentSteer:
  type: object
  additionalProperties: false
  required: [text]
  properties:
    text:
      type: string
      minLength: 1
      maxLength: 4000
ConsoleAgent:
  type: object
  additionalProperties: false
  required: [id, name, icon, purpose, default]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    icon:
      type: string
    purpose:
      type: string
    default:
      type: boolean
      description: The agent a question goes to when it names none.
ConsoleAgentList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/ConsoleAgent"
AgentRunEvent:
  type: object
  description: |
    The data of one server-sent event of a turn, `{seq, type, at, ...}`;
    the event's `id:` is its seq, counted from 1 per turn. The fields
    beside seq, type and at are those of the type:

    - turn.started: agent {id, name}, model
    - turn.resumed: by, the member who resumed it
    - text.delta, reasoning.delta: delta, the model's text as it streams
    - tool.started: call_id, tool, input
    - tool.finished: call_id, tool, output (what the model reads),
      is_error
    - step: messages, the AgentMessages the step added to the
      conversation (the model's message, its commands' outputs, and the
      steers it read)
    - step.failed: error; the text streamed since the last step is void
    - approval: approval, an AgentApproval asked for or decided
    - steer: text, by; a member's steer the runtime took, which a later
      step carries as a user message once the model reads it. A turn that
      ends without such a step did not read it
    - turn.pausing: by
    - turn.paused: usage
    - turn.finished: status, stop, error, usage

    The stream ends after turn.paused or turn.finished.
  required: [seq, type, at]
  properties:
    seq:
      type: integer
      minimum: 1
    type:
      type: string
      enum:
        - turn.started
        - turn.resumed
        - text.delta
        - reasoning.delta
        - tool.started
        - tool.finished
        - step
        - step.failed
        - approval
        - steer
        - turn.pausing
        - turn.paused
        - turn.finished
    at:
      type: string
      format: date-time
  additionalProperties: true
AgentOperation:
  type: object
  additionalProperties: false
  description: One API operation an agent may call, a command of the shopnexus CLI.
  required: [name, method, path, summary, capability, approval, parameters]
  properties:
    name:
      type: string
      description: The operationId without Console, the CLI's command.
    method:
      type: string
    path:
      type: string
    summary:
      type: string
    description:
      type: string
    capability:
      type: string
      description: The capability that grants it, its x-capability.
    approval:
      type: boolean
      description: It changes something, so an agent's call waits for a member's approval.
    parameters:
      type: array
      description: Its path and query parameters.
      items:
        type: object
        additionalProperties: false
        required: [name, in, required]
        properties:
          name:
            type: string
          in:
            type: string
            enum: [path, query]
          required:
            type: boolean
          description:
            type: string
          schema:
            type: object
    body:
      type: object
      description: Its request body's JSON Schema; absent when it takes none.
AgentOperationList:
  type: object
  additionalProperties: false
  required: [operations]
  properties:
    operations:
      type: array
      items:
        $ref: "#/AgentOperation"
AgentApprovalStatus:
  type: string
  description: pending until a member decides; approved when the call answered 2xx, failed when it did not.
  enum: [pending, approved, rejected, failed]
AgentApproval:
  type: object
  additionalProperties: false
  description: A change an agent asked for, the API call it would make.
  required: [id, conversation_id, turn_id, member_id, operation, method, path, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    conversation_id:
      type: string
      format: uuid
    turn_id:
      type: string
      format: uuid
    member_id:
      type: string
      format: uuid
      description: The member the agent worked for.
    operation:
      type: string
      description: The operation's name, as AgentOperation names it.
    method:
      type: string
    path:
      type: string
      description: The path with its query.
    body:
      description: The request's JSON body; absent when it had none.
    status:
      $ref: "#/AgentApprovalStatus"
    decided_by:
      type: string
      format: uuid
    decided_at:
      type: string
      format: date-time
    result_status:
      type: integer
      description: The HTTP status the call answered, once approved.
    result:
      description: The call's JSON answer, once approved; absent when it had none.
    created_at:
      type: string
      format: date-time
AgentApprovalList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/AgentApproval"
