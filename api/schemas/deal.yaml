DealOpen:
  type: object
  additionalProperties: false
  required: [listing_id]
  properties:
    listing_id:
      type: string
      format: uuid
Offer:
  type: object
  additionalProperties: false
  required: [amount]
  properties:
    amount:
      type: integer
      format: int64
      description: |
        Whole đồng in multiples of 1,000, inside the deal's offer_range. The
        range is a business rule, so an amount outside it is 422.
Accept:
  type: object
  additionalProperties: false
  required: [price]
  properties:
    price:
      type: integer
      format: int64
      description: |
        The price the person saw: the other side's open price or, for the
        buyer, the listed price. Another price is 409 price_changed.
Party:
  type: string
  enum: [buyer, seller]
DealStatus:
  type: string
  enum: [negotiating, agreed, sold]
  description: |
    Agreeing reserves nothing; several buyers may agree a price on one
    listing. sold: the deal's order was completed; the deal takes no move.
DealListing:
  type: object
  additionalProperties: false
  required: [id, slug, title, price, status]
  description: The deal's listing as it is now.
  properties:
    id:
      type: string
      format: uuid
    slug:
      $ref: "catalog.yaml#/ListingSlug"
    title:
      type: string
    price:
      type: integer
      format: int64
    cover_thumb_url:
      type: string
      format: uri
      description: Absent until the cover photo is processed.
    status:
      $ref: "catalog.yaml#/ListingStatus"
OpenPrice:
  type: object
  additionalProperties: false
  required: [by, amount, at]
  description: The offer or counter waiting for the other side.
  properties:
    by:
      $ref: "#/Party"
    amount:
      type: integer
      format: int64
    at:
      type: string
      format: date-time
DealSummary:
  type: object
  additionalProperties: false
  required: [id, conversation_id, role, listing, status, your_turn]
  description: A deal at a glance, as the caller sees it.
  properties:
    id:
      type: string
      format: uuid
    conversation_id:
      type: string
      format: uuid
      description: The conversation of the buyer and the seller, which holds the deal's messages.
    role:
      $ref: "#/Party"
    listing:
      $ref: "#/DealListing"
    status:
      $ref: "#/DealStatus"
    open_price:
      $ref: "#/OpenPrice"
    agreed_price:
      type: integer
      format: int64
      description: Present while agreed or sold.
    order_status:
      $ref: "#/OrderStatus"
    your_turn:
      type: boolean
      description: |
        The caller has to act: the deal is negotiating and the open price is
        the other side's; or the caller is the buyer of an agreed deal
        without a pending or shipped order, on a listing still active; or
        the caller is the seller and the deal's newest order is pending.
OfferRange:
  type: object
  additionalProperties: false
  required: [min, max]
  description: |
    The amounts the viewer's next offer may take, both included. Absent when
    the viewer may not offer now; the app bounds its input with it.
  properties:
    min:
      type: integer
      format: int64
    max:
      type: integer
      format: int64
Move:
  type: object
  additionalProperties: false
  required: [kind, by, at]
  properties:
    kind:
      type: string
      enum:
        - offer
        - counter
        - accept
        - decline
        - withdraw
        - cancel
        - price_changed
        - offers_closed
        - listing_closed
        - cod_requested
        - shipped
        - shipment_updated
        - completed
        - failed
        - order_cancelled
    by:
      type: string
      enum: [buyer, seller, system]
      description: system is the server, following a change of the listing, a carrier's report or a timer.
    amount:
      type: integer
      format: int64
      description: |
        The offered or agreed price, the new listed price on price_changed,
        the order's price on cod_requested, the carrier's fee on shipped when it gave one.
    at:
      type: string
      format: date-time
Deal:
  type: object
  additionalProperties: false
  required: [id, conversation_id, buyer_id, seller_id, listing, role, status, moves]
  description: A buyer's negotiation with a seller over one listing; one per buyer and listing.
  properties:
    id:
      type: string
      format: uuid
    conversation_id:
      type: string
      format: uuid
      description: |
        The conversation of the buyer and the seller, which opening the deal
        opened or reused. Each move a person makes and each order step adds a
        message there.
    buyer_id:
      type: string
      format: uuid
    seller_id:
      type: string
      format: uuid
    listing:
      $ref: "#/DealListing"
    role:
      $ref: "#/Party"
    status:
      $ref: "#/DealStatus"
    open_price:
      $ref: "#/OpenPrice"
    agreed_price:
      type: integer
      format: int64
      description: Present while agreed or sold.
    agreed_at:
      type: string
      format: date-time
    offer_range:
      $ref: "#/OfferRange"
    order:
      $ref: "#/Order"
    moves:
      type: array
      description: Every move, oldest first.
      items:
        $ref: "#/Move"
DealList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Deal"
    next_cursor:
      type: string
      format: uuid
      description: Present when more deals follow; pass it as cursor.
CodRequest:
  type: object
  additionalProperties: false
  required: [price, address_id]
  properties:
    price:
      type: integer
      format: int64
      minimum: 1
      description: The price the buyer saw. On an agreed deal, the agreed price. On a deal still negotiating, the listed price or the seller's open counter; the order agrees the deal at it. Any other price is price_changed.
    address_id:
      type: string
      format: uuid
      description: An address of the caller's from GET /v1/addresses. The order keeps a copy, so a later edit or delete of the address leaves it as it was.
Carrier:
  type: string
  enum: [ghtk, ghn, spx, jt, viettel_post]
  description: A shipment's carrier. New shipments are at ghtk or ghn; spx, jt and viettel_post appear only on manual shipments from before 2026-11-25.
ShipmentDraft:
  type: object
  additionalProperties: false
  required: [carrier, service, weight_grams, pickup]
  description: A shipment to make on the seller's account at GHTK or GHN.
  properties:
    carrier:
      type: string
      description: ghtk or ghn, a carrier the caller linked; another value is 422 invalid_shipment, an unlinked one 409 carrier_not_linked.
    service:
      type: string
      description: standard or express.
    weight_grams:
      type: integer
      description: The parcel's weight, 1 to 20,000 grams.
    pickup:
      type: string
      description: home (the carrier picks the parcel up from the seller) or post_office (the seller brings it to one).
    pickup_from:
      type: object
      additionalProperties: false
      description: Where the carrier picks the parcel up, one of carrier_pickup_id, address_id or saved_pickup; absent, the carrier's default pickup point. The order keeps a copy.
      properties:
        carrier_pickup_id:
          type: string
          description: One of the carrier's pickup points, from GET /v1/carrier-accounts/{carrier}/pickups.
        saved_pickup:
          type: boolean
          enum: [true]
          description: Use the caller's saved pickup address and contact phone with their current display name.
        address_id:
          type: string
          format: uuid
          description: An address of the caller's from GET /v1/addresses.
ShipmentStatus:
  type: string
  enum: [pending_pickup, in_transit, delivered, failed]
  description: Where the parcel is, as its carrier reports it.
Recipient:
  type: object
  additionalProperties: false
  required: [name, commune_code, commune, province, kind]
  description: The buyer's address as the order copied it from the address book.
  properties:
    name:
      type: string
    phone:
      type: string
      description: In the +84 form. Absent for the seller on a cancelled order.
    street:
      type: string
      description: Absent for the seller on a cancelled order.
    commune_code:
      type: string
    commune:
      type: string
    province:
      type: string
    kind:
      $ref: "address.yaml#/AddressKind"
Shipment:
  type: object
  additionalProperties: false
  required: [mode, carrier, tracking_code, status]
  description: The parcel of a shipped order.
  properties:
    mode:
      type: string
      enum: [linked, manual]
      description: linked is made on the seller's account at GHTK or GHN. manual is an order shipped before 2026-11-25, which the seller made on a carrier's own app and typed the code of; no new shipment is manual.
    carrier:
      $ref: "#/Carrier"
    tracking_code:
      type: string
    fee:
      type: integer
      format: int64
      description: The carrier's fee in đồng; absent while the carrier has none.
    status:
      $ref: "#/ShipmentStatus"
    picked_up_at:
      type: string
      format: date-time
      description: When the carrier first reported the parcel past pending_pickup; absent while it waits for pickup.
    delivered_at:
      type: string
      format: date-time
      description: When the carrier reported the parcel delivered; present while status is delivered.
    pickup:
      $ref: "#/ShipmentPickup"
CancelReason:
  type: string
  enum: [buyer, seller, seller_timeout, pickup_timeout, shipped_to_another, listing_closed]
  description: |
    buyer and seller: that side cancelled a pending order. seller_timeout:
    the seller created no shipment within 3 days. pickup_timeout: the
    carrier had not picked the parcel up 3 days after the shipment.
    shipped_to_another: the seller shipped the listing to another buyer.
    listing_closed: the listing was hidden, sold off the app or deleted.
OrderStatus:
  type: string
  enum: [pending, shipped, completed, failed, cancelled]
  description: |
    pending: the buyer asked for COD; either side may cancel. shipped: the
    seller created the shipment; the listing is reserved. completed: the
    buyer confirmed receipt, or 3 days passed after the carrier reported
    the parcel delivered. failed: the carrier reported the delivery
    failed; the deal negotiates again. cancelled: before the shipment, or
    by the pickup timeout.
Order:
  type: object
  additionalProperties: false
  required: [id, code, status, price, recipient, requested_at]
  description: A buyer's request for cash on delivery at the agreed price.
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
      description: The order number, such as SN-100001.
    status:
      $ref: "#/OrderStatus"
    price:
      type: integer
      format: int64
    recipient:
      $ref: "#/Recipient"
    shipment:
      $ref: "#/Shipment"
    completed_by:
      type: string
      enum: [buyer, system]
      description: The stored completion actor; present on a completed order.
    cancelled_by:
      type: string
      enum: [buyer, seller, system]
    cancel_reason:
      $ref: "#/CancelReason"
    requested_at:
      type: string
      format: date-time
    shipped_at:
      type: string
      format: date-time
    closed_at:
      type: string
      format: date-time
    due_at:
      type: string
      format: date-time
      description: |
        When the server moves the order on unless someone acts first: a
        pending order is cancelled with seller_timeout, a parcel still
        waiting for pickup is cancelled with pickup_timeout, a delivered
        one completes. Absent while no such wait runs.
OrderItem:
  type: object
  additionalProperties: false
  description: An order with its deal and its listing as it is now.
  required: [id, code, status, price, recipient, requested_at, deal_id, listing]
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
    status:
      $ref: "#/OrderStatus"
    price:
      type: integer
      format: int64
    recipient:
      $ref: "#/Recipient"
    shipment:
      $ref: "#/Shipment"
    completed_by:
      type: string
      enum: [buyer, system]
      description: The stored completion actor; present on a completed order.
    cancelled_by:
      type: string
      enum: [buyer, seller, system]
    cancel_reason:
      $ref: "#/CancelReason"
    requested_at:
      type: string
      format: date-time
    shipped_at:
      type: string
      format: date-time
    closed_at:
      type: string
      format: date-time
    due_at:
      type: string
      format: date-time
      description: |
        When the server moves the order on unless someone acts first: a
        pending order is cancelled with seller_timeout, a parcel still
        waiting for pickup is cancelled with pickup_timeout, a delivered
        one completes. Absent while no such wait runs.
    deal_id:
      type: string
      format: uuid
    listing:
      $ref: "#/DealListing"
ShipmentPickup:
  type: object
  additionalProperties: false
  description: "Where a linked shipment is picked up, as the order keeps it: a carrier's pickup point, or a copy of the seller's address."
  properties:
    point_id:
      type: string
    name:
      type: string
    phone:
      type: string
    street:
      type: string
    commune_code:
      type: string
