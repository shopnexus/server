MyListingsScreen:
  type: object
  additionalProperties: false
  required: [week, items]
  properties:
    week:
      $ref: "#/ListingWeek"
    items:
      type: array
      items:
        $ref: "#/MyListingsItem"
    next_cursor:
      type: string
      format: uuid
      description: Present when more listings follow; pass it as cursor.
ListingWeek:
  type: object
  additionalProperties: false
  required: [views, askers, saves]
  description: The last seven days of the caller's listings on sale.
  properties:
    views:
      type: integer
      minimum: 0
    askers:
      type: integer
      minimum: 0
      description: The people who first asked about one of the listings in the seven days, once per listing.
    saves:
      type: integer
      minimum: 0
      description: The saves made in the seven days that still stand.
MyListingsItem:
  type: object
  additionalProperties: false
  required: [listing, views, views_7d, askers, saves, from_chotot]
  properties:
    listing:
      $ref: "catalog.yaml#/Listing"
    views:
      type: integer
      minimum: 0
    views_7d:
      type: integer
      minimum: 0
    askers:
      type: integer
      minimum: 0
    saves:
      type: integer
      minimum: 0
      description: The saves that stand now.
    order:
      $ref: "#/ListingOrder"
    from_chotot:
      type: boolean
      description: The listing was brought over from the seller's Chợ Tốt profile.
    boost:
      $ref: "boost.yaml#/Boost"
      description: The listing's boost awaiting payment or running; absent when none.
    boostable:
      type: boolean
      description: |
        Whether POST /v1/boosts would sell a package for the listing now:
        it is on sale, has no boost awaiting payment or running, the
        account may write and has a phone, and the server takes payments.
ListingOrder:
  type: object
  additionalProperties: false
  required: [deal_id, order_id, status]
  description: |
    The order on the listing the seller acts on: the shipped one, else the
    pending order requested first. Absent while none is pending or shipped.
  properties:
    deal_id:
      type: string
      format: uuid
    order_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [pending, shipped]
