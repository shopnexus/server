LinkedCarrier:
  type: string
  enum: [ghtk, ghn]
  description: The carriers a seller can link. The other carriers in Carrier cannot be linked yet.
CarrierAccount:
  type: object
  additionalProperties: false
  required: [carrier, shop_code, linked_at]
  description: A carrier account the seller linked. The token never leaves the server.
  properties:
    carrier:
      $ref: "#/LinkedCarrier"
    shop_code:
      type: string
      description: GHTK's shop code or GHN's ShopId.
    linked_at:
      type: string
      format: date-time
CarrierAccountList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/CarrierAccount"
CarrierLogin:
  type: object
  additionalProperties: false
  description: GHTK takes the seller's email and password; GHN takes the seller's API token and ShopId, or the phone of the seller's GHN account and the code GHN texted to it. A body holds one pair and nothing of the others.
  oneOf:
    - required: [email, password]
    - required: [token, shop_id]
    - required: [phone, otp]
  dependentRequired:
    email: [password]
    password: [email]
    token: [shop_id]
    shop_id: [token]
    phone: [otp]
    otp: [phone]
  properties:
    email:
      type: string
      minLength: 1
      maxLength: 254
      description: GHTK's.
    password:
      type: string
      minLength: 1
      maxLength: 200
      description: GHTK's, used once to get the shop's token; never stored.
    token:
      type: string
      minLength: 1
      maxLength: 200
      description: GHN's API token.
    shop_id:
      type: string
      minLength: 1
      maxLength: 50
      description: GHN's ShopId.
    phone:
      type: string
      minLength: 1
      maxLength: 20
      description: The phone of the seller's GHN account, sent to POST /v1/carrier-accounts/ghn/otp first.
    otp:
      type: string
      minLength: 4
      maxLength: 10
      description: The code GHN texted to phone; GHN makes the seller a shop with ShopNexus as its staff.
CarrierOTPRequest:
  type: object
  additionalProperties: false
  required: [phone]
  properties:
    phone:
      type: string
      minLength: 1
      maxLength: 20
      description: The phone of the seller's GHN account, a Vietnamese mobile.
PickupPoint:
  type: object
  additionalProperties: false
  required: [id, name, phone, address]
  description: A pickup point the seller registered at the carrier.
  properties:
    id:
      type: string
    name:
      type: string
    phone:
      type: string
    address:
      type: string
PickupPointList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/PickupPoint"
Quote:
  type: object
  additionalProperties: false
  required: [fee]
  properties:
    fee:
      type: integer
      format: int64
      description: The carrier's fee in đồng, read-only.
ShippingSettings:
  type: object
  additionalProperties: false
  required: [pickup]
  properties:
    pickup:
      description: An owned address reference and separate unverified contact phone. Deleting the address clears both; existing shipment copies stay unchanged.
      anyOf:
        - $ref: "#/SavedPickup"
        - type: "null"
SavedPickup:
  type: object
  additionalProperties: false
  required: [address_id, phone]
  properties:
    address_id:
      type: string
      format: uuid
    phone:
      type: string
      description: A Vietnamese mobile normalized to +84 on save; invalid values are 422 invalid_shipping_settings with field phone.
ShipmentStep:
  type: string
  enum: [ready_to_pick, picking, pickup_failed, picked, at_hub, transporting, out_for_delivery, delivery_failed, delivered, returning, returned, cancelled, lost]
  description: |
    Where the parcel is, in the same words for every carrier, finer than
    ShipmentStatus. ready_to_pick, picking and pickup_failed are
    pending_pickup; picked, at_hub, transporting, out_for_delivery and
    delivery_failed are in_transit, since the carrier tries a failed
    delivery again; delivered is delivered; returning and returned are
    failed. cancelled and lost move no order.
TrackingEvent:
  type: object
  additionalProperties: false
  required: [at, kind]
  description: One thing the carrier reported of the parcel. Fields the carrier did not send are absent.
  properties:
    at:
      type: string
      format: date-time
      description: When it happened, as the carrier tells it.
    kind:
      type: string
      enum: [step, weight, fee, cod, cod_transfer]
      description: step is a move of the parcel; weight, fee and cod a new weight in grams, fee or COD amount in đồng; cod_transfer the COD paid out to the seller. The buyer sees only steps.
    step:
      $ref: "#/ShipmentStep"
      description: Present on a step.
    carrier_status:
      type: string
      description: The carrier's own status code on a step, such as GHN's storing or GHTK's 9, for a client that tells more than the step.
    reason:
      type: string
      description: The carrier's words on a failed pickup or delivery, a return or a delay.
    reason_code:
      type: string
    warehouse:
      type: string
      description: The carrier's hub the parcel is at.
    shipper_name:
      type: string
    shipper_phone:
      type: string
    proof_url:
      type: string
      description: The carrier's photo of the delivery.
    amount:
      type: integer
      format: int64
      description: The weight in grams, or the fee, the COD or the COD paid out in đồng.
Tracking:
  type: object
  additionalProperties: false
  required: [events]
  description: The parcel's timeline as its carrier reported it, through webhooks and the poll.
  properties:
    step:
      $ref: "#/ShipmentStep"
      description: The newest step; absent before the carrier reported one.
    events:
      type: array
      description: Newest first.
      items:
        $ref: "#/TrackingEvent"
DevShipmentReport:
  type: object
  additionalProperties: false
  required: [step]
  properties:
    step:
      $ref: "#/ShipmentStep"
    reason:
      type: string
    warehouse:
      type: string
    shipper_name:
      type: string
    shipper_phone:
      type: string
    proof_url:
      type: string
