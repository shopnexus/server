NearLat:
  name: near_lat
  in: query
  description: The caller's latitude, with near_lng. Used for this request only; never stored or logged.
  schema:
    type: number
    minimum: -90
    maximum: 90
NearLng:
  name: near_lng
  in: query
  description: The caller's longitude, with near_lat.
  schema:
    type: number
    minimum: -180
    maximum: 180
NearCommune:
  name: near_commune
  in: query
  description: A commune code, when the app has no GPS; distance is from its point.
  schema:
    type: string
SearchCursor:
  name: cursor
  in: query
  description: The next_cursor of the previous page.
  schema:
    type: string
SearchPhoto:
  name: photo
  in: query
  description: |
    An upload of the caller's from POST /v1/uploads, still waiting (attached to
    nothing): search by this photo alone. Needs a signed-in caller; goes without
    q and like. The photo is never published and goes when the upload expires.
  schema:
    type: string
    format: uuid
SearchLike:
  name: like
  in: query
  description: |
    A listing on sale or reserved: listings similar to it, leaving out that
    listing and the caller's own. Goes with q and the filters, not with photo.
  schema:
    type: string
    format: uuid
