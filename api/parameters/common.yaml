IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: A new UUID per user action, reused when the app retries that action. A repeated key returns the first result.
  schema:
    type: string
    format: uuid
Cursor:
  name: cursor
  in: query
  description: The next_cursor of the previous page; absent for the first page.
  schema:
    type: string
    format: uuid
Limit:
  name: limit
  in: query
  description: Page size.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
ConsoleCSRF:
  name: X-Requested-With
  in: header
  required: true
  description: |
    Must be shopnexus-console on every console call. A form or link on another
    site cannot set it, which stops cross-site requests riding the session
    cookie, sign-in included.
  schema:
    type: string
    enum: [shopnexus-console]
ConsoleMemberID:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
ConsoleAccountID:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
ConsoleTicketID:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
TicketStatusQuery:
  name: status
  in: query
  required: true
  schema:
    $ref: "../schemas/support.yaml#/TicketStatus"
TicketKindQuery:
  name: kind
  in: query
  required: false
  schema:
    $ref: "../schemas/support.yaml#/TicketKind"
AgentConversationID:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
