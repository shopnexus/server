IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: A new UUID per user action, reused when the app retries that action. A repeated key returns the first result.
  schema:
    type: string
    format: uuid
Cursor:
  name: cursor
  in: query
  description: The next_cursor of the previous page; absent for the first page.
  schema:
    type: string
    format: uuid
Limit:
  name: limit
  in: query
  description: Page size.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
StaffCSRF:
  name: X-Requested-With
  in: header
  required: true
  description: Must be shopnexus-console. A form on another site cannot set it, which stops a cross-site refresh.
  schema:
    type: string
    enum: [shopnexus-console]
StaffRefreshCookie:
  name: staff_refresh
  in: cookie
  required: true
  schema:
    type: string
    minLength: 1
StaffMemberID:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
StaffAccountID:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
