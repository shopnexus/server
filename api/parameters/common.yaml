IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: A new UUID per user action, reused when the app retries that action. A repeated key returns the first result.
  schema:
    type: string
    format: uuid
IdempotencyKeyOptional:
  name: Idempotency-Key
  in: header
  required: false
  description: A new UUID per user action, reused when the client retries that action. A repeated key returns the first result. Without one, every request runs; the key is optional because earlier app versions send none.
  schema:
    type: string
    format: uuid
AcceptLanguage:
  name: Accept-Language
  in: header
  required: false
  description: |
    The caller's languages, as browsers and the apps send them. The server
    writes in Vietnamese (vi) or English (en), whichever the header
    prefers, and Vietnamese when it names neither. An email code is mailed,
    and the text the server writes in a response (notices, category names,
    search chips, scam signals, default quick replies) is written, in the
    request's language; such a response sends Vary: Accept-Language. A
    sign-in records it as the language of the account's pushes and mail.
  schema:
    type: string
    example: vi-VN,vi;q=0.9,en;q=0.8
SecPurpose:
  name: Sec-Purpose
  in: header
  required: false
  description: |
    The Fetch standard's purpose of the request. A list with the token
    prefetch, such as prefetch or prefetch;prerender, marks a
    speculative read: a browser fetching a page the person may not open.
    Such a read answers as any other and records nothing; the client
    reports the open when the person sees the page.
  schema:
    type: string
Cursor:
  name: cursor
  in: query
  description: The next_cursor of the previous page; absent for the first page.
  schema:
    type: string
    format: uuid
Limit:
  name: limit
  in: query
  description: Page size.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
ConsoleCSRF:
  name: X-Requested-With
  in: header
  required: true
  description: |
    Must be shopnexus-console on every console call. A form or link on another
    site cannot set it, which stops cross-site requests riding the session
    cookie, sign-in included.
  schema:
    type: string
    enum: [shopnexus-console]
