  /v1/sellers/{id}/reviews:
    $ref: "paths/trust.yaml#/sellerReviews"
  /v1/sellers/{id}/listings:
    $ref: "paths/catalog.yaml#/sellerListings"
  /v1/saved:
    $ref: "paths/discovery.yaml#/saved"
  /v1/saved/{listing_id}:
