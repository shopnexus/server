openapi: 3.2.0
info:
  title: shopnexus API
  version: 0.1.0
  description: |
    The contract between shopnexus clients and server2. Code satisfies this
    document: requests are validated against it at runtime, and the e2e suite
    validates every response against it.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    $ref: "paths/system.yaml#/healthz"
  /readyz:
    $ref: "paths/system.yaml#/readyz"
  /v1/auth/otp:
    $ref: "paths/auth.yaml#/otp"
  /v1/auth/otp/verify:
    $ref: "paths/auth.yaml#/otpVerify"
  /v1/auth/refresh:
    $ref: "paths/auth.yaml#/refresh"
  /v1/auth/logout:
    $ref: "paths/auth.yaml#/logout"
  /v1/auth/logout-all:
    $ref: "paths/auth.yaml#/logoutAll"
  /v1/auth/sessions:
    $ref: "paths/auth.yaml#/sessions"
  /v1/auth/sessions/{id}:
    $ref: "paths/auth.yaml#/session"
  /v1/accounts/me:
    $ref: "paths/account.yaml#/me"
  /v1/staff/login:
    $ref: "paths/staff.yaml#/login"
  /v1/staff/login/password:
    $ref: "paths/staff.yaml#/loginPassword"
  /v1/staff/login/totp-enrollment:
    $ref: "paths/staff.yaml#/loginTotpEnrollment"
  /v1/staff/login/totp:
    $ref: "paths/staff.yaml#/loginTotp"
  /v1/staff/session/refresh:
    $ref: "paths/staff.yaml#/sessionRefresh"
  /v1/staff/session/logout:
    $ref: "paths/staff.yaml#/sessionLogout"
  /v1/staff/me:
    $ref: "paths/staff.yaml#/me"
  /v1/staff/me/password:
    $ref: "paths/staff.yaml#/mePassword"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A staff access token (audience shopnexus-staff). Customer tokens fail here.
