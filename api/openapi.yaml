  /v1/auth/logout-all:
    $ref: "paths/auth.yaml#/logoutAll"
  /v1/auth/sessions:
    $ref: "paths/auth.yaml#/sessions"
  /v1/auth/sessions/{id}:
    $ref: "paths/auth.yaml#/session"
  /v1/accounts/me:
    $ref: "paths/account.yaml#/me"
  /v1/blocks:
    $ref: "paths/account.yaml#/blocks"
  /v1/blocks/{account_id}:
