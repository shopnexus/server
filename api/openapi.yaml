  /v1/conversations:
    $ref: "paths/chat.yaml#/conversations"
  /v1/conversations/{id}/messages:
    $ref: "paths/chat.yaml#/conversationMessages"
  /v1/conversations/{id}/read:
    $ref: "paths/chat.yaml#/conversationRead"
  /v1/conversations/{id}/archive:
    $ref: "paths/chat.yaml#/conversationArchive"
  /v1/conversations/{id}/unarchive:
    $ref: "paths/chat.yaml#/conversationUnarchive"
  /v1/me/unread:
    $ref: "paths/chat.yaml#/unread"
  /v1/screens/inbox:
    $ref: "paths/screen_inbox.yaml#/screenInbox"
  /v1/screens/chat/{conversation_id}:
    $ref: "paths/screen_inbox.yaml#/screenChat"
  /v1/screens/listing/{id}:
