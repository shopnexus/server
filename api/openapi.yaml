openapi: 3.2.0
info:
  title: shopnexus API
  version: 0.1.0
  description: |
    The contract between shopnexus clients and server2. Code satisfies this
    document: requests are validated against it at runtime, and the e2e suite
    validates every response against it.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    $ref: "paths/system.yaml#/healthz"
  /readyz:
    $ref: "paths/system.yaml#/readyz"
  /v1/auth/otp:
    $ref: "paths/auth.yaml#/otp"
  /v1/auth/otp/verify:
    $ref: "paths/auth.yaml#/otpVerify"
  /v1/auth/refresh:
    $ref: "paths/auth.yaml#/refresh"
  /v1/auth/logout:
    $ref: "paths/auth.yaml#/logout"
  /v1/auth/logout-all:
    $ref: "paths/auth.yaml#/logoutAll"
  /v1/auth/sessions:
    $ref: "paths/auth.yaml#/sessions"
  /v1/auth/sessions/{id}:
    $ref: "paths/auth.yaml#/session"
  /v1/accounts/me:
    $ref: "paths/account.yaml#/me"
  /v1/staff/login:
    $ref: "paths/staff.yaml#/login"
  /v1/staff/login/totp-enrollment:
    $ref: "paths/staff.yaml#/loginTotpEnrollment"
  /v1/staff/logout:
    $ref: "paths/staff.yaml#/logout"
  /v1/staff/me:
    $ref: "paths/staff.yaml#/me"
  /v1/staff/me/password:
    $ref: "paths/staff.yaml#/mePassword"
  /v1/staff/members:
    $ref: "paths/staff.yaml#/members"
  /v1/staff/members/{id}/disable:
    $ref: "paths/staff.yaml#/memberDisable"
  /v1/staff/members/{id}/enable:
    $ref: "paths/staff.yaml#/memberEnable"
  /v1/staff/members/{id}/unlock:
    $ref: "paths/staff.yaml#/memberUnlock"
  /v1/staff/members/{id}/reset-password:
    $ref: "paths/staff.yaml#/memberResetPassword"
  /v1/staff/members/{id}/reset-totp:
    $ref: "paths/staff.yaml#/memberResetTotp"
  /v1/staff/accounts:
    $ref: "paths/staff.yaml#/accounts"
  /v1/staff/accounts/{id}:
    $ref: "paths/staff.yaml#/account"
  /v1/staff/accounts/{id}/suspend:
    $ref: "paths/staff.yaml#/accountSuspend"
  /v1/staff/accounts/{id}/unsuspend:
    $ref: "paths/staff.yaml#/accountUnsuspend"
  /v1/staff/actions:
    $ref: "paths/staff.yaml#/actions"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffAuth:
      type: apiKey
      in: cookie
      name: staff_session
      description: |
        The session cookie a staff sign-in sets: HttpOnly, Secure,
        SameSite=Strict, path /v1/staff, eight hours. The server checks the
        session and the member on every request.
