    $ref: "paths/ai_settings.yaml#/guardrails"
  /v1/console/settings/dashboards:
    $ref: "paths/ai_settings.yaml#/dashboards"
  /v1/console/dashboard-tickets:
    $ref: "paths/console.yaml#/dashboardTickets"
  /v1/console/dashboard-auth:
    $ref: "paths/console.yaml#/dashboardAuth"
  /_dashboard/callback:
    $ref: "paths/console.yaml#/dashboardCallback"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    consoleAuth:
      type: apiKey
      in: cookie
      name: console_session
      description: |
        The session cookie a console sign-in sets: HttpOnly, Secure,
        SameSite=Strict, path /v1/console, eight hours. The server checks the
        session and the member on every request.
    dashboardAuth:
      type: apiKey
      in: cookie
      name: console_dashboard
      description: |
        The cookie of one ops dashboard's host, set by /_dashboard/callback:
        HttpOnly, Secure, SameSite=Lax, path /, no Domain. It lives as long
        as the console session it came from, and the server checks that
        session and its member on every request.
