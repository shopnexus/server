openapi: 3.2.0
info:
  title: ShopNexus API
  version: 0.1.0
  description: |
    The HTTP contract between the ShopNexus app and its server. The server
    validates every request against this document, and the end-to-end suite
    validates every response against it. The docs site explains each module:
    https://docs.shopnexus.id.vn/en/api.

    ## Signing in

    1. `POST /v1/auth/email-codes` mails a six-digit code to an email address.
    2. `POST /v1/auth/sign-in` with that code returns an access token and a
       refresh token. The first sign-in of an address creates the account. A
       phone number Firebase verified or a Google account signs in the same way.
    3. Send the access token as `Authorization: Bearer <token>`. It lasts 15
       minutes; `POST /v1/auth/refresh` returns a new one and rotates the
       refresh token.
    4. A call that needs a sign-in within 15 minutes answers 428
       `reauth_required` after that. `POST /v1/auth/sessions/current/reauthenticate`
       with a new proof of the same account returns an access token that
       passes it.

    In the playground, paste the access token under Authentication. It stays in
    this browser only.

    ## Requests and answers

    - Bodies are JSON. A field the schema does not list is 400.
    - A write the app may send twice takes an `Idempotency-Key` header: a new
      UUID per user action, the same one on a retry. A repeated key returns the
      first answer.
    - Lists page with `cursor` and `limit`; pass the `next_cursor` of one page to
      get the next.
    - Every error has the body `{"error": {"code", "message", "fields",
      "details", "trace_id"}}`. `code` is stable and snake_case, and each operation lists the
      codes it can return. `trace_id` equals the `Trace-Id` header.
    - A resource the caller may not see is 404, the same as one that does not
      exist.
    - Any operation answers 429 `rate_limited`, with `details.retry_after` in
      seconds, when one address or one signed-in caller sends faster than its
      tier allows. `x-rate-limit` names an operation's tier; without it, GET
      is `read` and every other method `write`.

    ## Live updates

    `GET /v1/ws` is a WebSocket that tells the open app what changed for the
    caller; the playground cannot open it. `GET /v1/updates` returns the same
    updates after a `since` seq, for an app with no socket open.
servers:
  - url: https://api.shopnexus.id.vn
    description: Production
  - url: https://api.dev.shopnexus.id.vn
    description: Dev, on the cluster
  - url: http://api.shopnexus.localhost:56481
    description: Local, from `make dev` in the umbrella repository
tags:
  - name: auth
    x-displayName: Sign-in
    description: Sign in with an email code, a phone number Firebase verified or a Google account; refresh tokens; list and end sessions.
  - name: account
    x-displayName: Account
    description: The caller's profile, phone, addresses, blocks and follows.
  - name: media
    x-displayName: Uploads
    description: Presigned URLs to upload a photo or a video, which a listing or a message then names.
  - name: catalog
    x-displayName: Listings
    description: Listings and their drafts. A seller posts, edits, hides and marks sold; anyone reads a public listing.
  - name: assist
    x-displayName: Listing assist
    description: Fill a listing draft from a video, photos or a Chợ Tốt link, and price it against similar listings.
  - name: discovery
    x-displayName: Search and saved listings
    description: Search and browse listings, saved listings, recent searches and a seller's public listings.
  - name: chat
    x-displayName: Chat
    description: Conversations between two people and their messages, deal messages included.
  - name: deal
    x-displayName: Deals and orders
    description: A buyer and a seller agree a price, the buyer asks for cash on delivery, the seller ships and the order closes.
  - name: shipping
    x-displayName: Shipping
    description: The seller's GHTK and GHN accounts, pickup addresses, shipping quotes and the carriers' webhooks.
  - name: trust
    x-displayName: Reviews and reports
    description: Reviews of sellers, reports of listings and accounts, and scam warnings in chat.
  - name: support
    x-displayName: Support
    description: Tickets the caller opens with ShopNexus and their chat.
  - name: feedback
    x-displayName: Feedback
    description: Feedback the caller sends ShopNexus, which needs no answer, and what became of it.
  - name: notification
    x-displayName: Notifications
    description: The caller's notices, their read state, push tokens and notification settings.
  - name: stream
    x-displayName: Live updates
    description: Live updates over a WebSocket, and the same updates by seq for an app with no socket open.
  - name: screen
    x-displayName: Screens
    description: One call per app screen, with everything that screen shows.
  - name: console
    x-displayName: Console
    description: The staff console. It signs in with a session cookie, so the playground cannot call it from another origin.
  - name: system
    x-displayName: Health
    description: Liveness and readiness checks.
  - name: beacon
    x-displayName: Client events
    description: What the website and the app report about errors, page speed, request times and search results.
  # internal and websocket are in no group of x-tagGroups, so the reference
  # lists each operation under its module's tag only. They are the one list
  # of the routes the app leaves out: its generated client drops every
  # operation that has either of them.
  - name: internal
    description: Operations the app does not call. The console and the ops dashboards' sign-in, carrier webhooks, the health checks, the dev routes and the website's sitemap have it.
  - name: websocket
    description: GET /v1/ws, a WebSocket. The app opens it with its socket code, since an HTTP client cannot.
x-tagGroups:
  - name: Accounts
    tags: [auth, account, media]
  - name: Listings and search
    tags: [catalog, assist, discovery]
  - name: Deals
    tags: [chat, deal, shipping]
  - name: After the sale
    tags: [trust, support, feedback, notification, stream]
  - name: App screens
    tags: [screen]
  - name: Staff console
    tags: [console]
  - name: System
    tags: [system, beacon]
