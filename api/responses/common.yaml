BadRequest:
  description: "The request does not match the API description (invalid_request, malformed_json)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
Unauthorized:
  description: "No valid credentials (unauthenticated, invalid_token, a refresh or session code, invalid_credentials, invalid_totp_code)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
Forbidden:
  description: "The account is suspended (account_suspended)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
NotFound:
  description: "No such resource for this caller."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
Conflict:
  description: "The request collided with another (try_again)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
Unprocessable:
  description: "Well formed, but a rule refuses it."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
PreconditionRequired:
  description: "The caller must do something first: sign in again (reauth_required), or at a console sign-in replace the temporary password (password_change_required), enroll TOTP (totp_enrollment_required) or send a code (totp_required)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
TooManyRequests:
  description: "Rate limited; details.retry_after gives seconds to wait when known."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
ConsoleForbidden:
  description: "The caller's role is too low (console_forbidden), or the target is an admin (admin_managed_by_cli)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
AgentUnavailable:
  description: "The agent cannot be reached (agent_unavailable); the rest of the console works without it."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
AgentConversationNotFound:
  description: "No such agent conversation, or one of another member's (agent_conversation_not_found)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
AgentSubjectInvalid:
  description: "subject_id without subject_kind, or a new conversation with subject_kind alone (agent_subject_invalid)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
AgentTurnNotFound:
  description: "No such turn, or not one this member may open (agent_turn_not_found)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
AgentTurnState:
  description: "The turn is not in a state that takes this control (agent_turn_state): pause and stop take a running turn, continue a paused one or a continuable failed or timed out one, end a paused one or one awaiting input, input one awaiting input."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
AIGatewayUnavailable:
  description: "Bifrost cannot be reached (ai_gateway_unavailable). A change is saved and goes to Bifrost when it is back, within 5 minutes."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
AISettingsRefused:
  description: "A rule refuses the change: ai_model_unpriced (the model or a fallback has no price), ai_model_lacks_tags (it lacks a required tag), ai_tag_unknown, ai_agent_invalid (such as a caller not the agent's, or a fallback for an Embedding agent), ai_agent_app_fixed, ai_price_invalid, or Bifrost refused it (ai_gateway_refused)."
  content:
    application/json:
      schema:
        $ref: "../schemas/error.yaml#/Error"
