# Linter choices and settings partly taken from
# https://github.com/maratori/golangci-lint-config (MIT, Marat Reimers).
version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - decorder
    - depguard
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - funcorder
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - iface
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        non-test files:
          files:
            - "!$test"
            # Test support may build on other test support.
            - "!**/internal/**/*test/*.go"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2.
            - pkg: github.com/shopnexus/server/internal/account/accounttest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/ai/aitest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/catalog/catalogtest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/chat/chattest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/media/mediatest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/platform/objectstore/objectstoretest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/platform/postgres/pgtest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/provider/embed/embedtest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/platform/restatex/restatetest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/provider/firebase/firebasetest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/provider/google/googletest
              desc: test support; only tests import it.
        non-main files:
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog.
        # A module's layers import downward only: domain, repository,
        # service, then handler and worker. A module reaches another only
        # through its service, so the other module can move to its own
        # process; its tests may wire another module's repositories.
        # depguard matches package prefixes, so the rules list every
        # package. depguardgen writes them from the packages under
        # internal/: run make depguard after adding a module or a layer.
        # BEGIN depguardgen
        module account:
          files:
            - "**/internal/account/**"
            - "!$test"
          deny:
            - pkg: github.com/shopnexus/server/internal/agent/repository
              desc: another module is reached through its service.
            - pkg: github.com/shopnexus/server/internal/assist/repository
