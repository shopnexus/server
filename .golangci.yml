# Linter choices and settings partly taken from
# https://github.com/maratori/golangci-lint-config (MIT, Marat Reimers).
version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - decorder
    - depguard
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - funcorder
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - iface
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        non-test files:
          files:
            - "!$test"
            # Test support may build on other test support.
            - "!**/internal/**/*test/*.go"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2.
            - pkg: github.com/shopnexus/server/internal/account/accounttest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/ai/aitest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/catalog/catalogtest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/chat/chattest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/media/mediatest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/platform/objectstore/objectstoretest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/platform/postgres/pgtest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/provider/embed/embedtest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/platform/restatex/restatetest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/provider/firebase/firebasetest
              desc: test support; only tests import it.
            - pkg: github.com/shopnexus/server/internal/provider/google/googletest
              desc: test support; only tests import it.
        non-main files:
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog.
        # The module and layer rules are a test, internal/layers_test.go,
        # since depguard would need every package listed.
    errcheck:
      check-type-assertions: true
    exhaustruct_v5:
      explicit-mode: true
      # Only configuration, where a forgotten field is a real bug; elsewhere
      # a struct literal names the fields it sets.
      enforce-patterns:
        - ^github\.com/shopnexus/server/internal/platform/config\..+
      allow-empty-returns: true
    funcorder:
      struct-method: false
    goconst:
      # pgx.StrictNamedArgs keys repeat the SQL parameter names.
      ignore-string-values:
        - ^[a-z_]+$
    gocritic:
      enable-all: true
      disabled-checks:
        # Account, Identity and the other aggregates are passed by value.
        - hugeParam
        # Asks for err := where govet's shadow check asks for err =.
        - sloppyReassign
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
    reassign:
      patterns:
        - ".*"
    recvcheck:
      # json.Marshal skips a pointer-receiver MarshalJSON when given a value.
      exclusions:
        - "*.MarshalJSON"
    revive:
      enable-default-rules: true
      rules:
        # Exported names carry a doc comment only when the name alone does
        # not say enough.
        - name: exported
          disabled: true
        - name: bool-literal-in-expr
        - name: confusing-naming
        - name: enforce-switch-style
        - name: unchecked-type-assertion
        - name: unnecessary-format
        - name: confusing-results
        - name: constant-logical-expr
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: early-return
        - name: identical-branches
        - name: modifies-value-receiver
        - name: redundant-import-alias
        - name: string-of-int
        - name: unconditional-recursion
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: use-any
        - name: use-errors-new
        - name: useless-break
        - name: waitgroup-by-value
    tagliatelle:
      case:
        rules:
          json: snake
    sloglint:
      no-global: all
      context: scope
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008
    wrapcheck:
      # A module's domain returns business errors, *apperr.Error, that reach
      # the client as they are.
      ignore-package-globs:
        - github.com/shopnexus/server/internal/*/domain
        # The seed pack packages name the file, line or row in their errors.
        - github.com/shopnexus/server/internal/seedpack*
      extra-ignore-sigs:
        # These build an *apperr.Error; there is nothing below it to wrap.
        - apperr.New(
        - .WithRetryAfter(
        - .WithAttemptsLeft(
        - .WithReason(
        - .WithField(
        - .WithCause(
        - httpx.Bind[
        # These wrap their own errors ("read clock", "insert events",
        # "insert console actions", "config", "lock account"); a caller has
        # nothing to add.
        - config.FromDotEnv(
        - restatex.Now(
        - events.Insert(
        - stream.Notify(
        - audit.Insert(
        # The first error of a group, whose functions wrap their own.
        - errgroup.Group).Wait(
        # The *apperr.Error a Restate service refused with; the client gets it
        # as the service built it. Caller.Call wraps a transport error itself.
        - .Refusal()
        - restatex.Caller[
        # Called from MarshalJSON and UnmarshalJSON. encoding/json names the
        # type itself and adds field context only to errors it can see.
        - encoding/json.Marshal(
        - encoding/json.Unmarshal(
    usetesting:
      os-temp-dir: true
  exclusions:
    warn-unused: true
    presets:
      - common-false-positives
    rules:
      # Tests may ignore Close errors, repeat literals, build fixtures with
      # only the fields a case needs, and return errors unwrapped.
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - exhaustruct_v5
          - goconst
          - gosec
          - wrapcheck
      # A handler hands the use case's error to WriteError as it is.
      - path: internal/[^/]+/handler/
        linters:
          - wrapcheck
      # A module's Service lists every use case, and a module that keeps
      # its tables in one store lists every query there.
      - path: internal/[^/]+/(service/service|repository/repository)\.go$
        linters:
          - interfacebloat
        text: the interface has more than

formatters:
  enable:
    - gofumpt
